<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeevan Bikas Flow Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f4f6f8;--surface:#fff;--subtle:#f7f9fa;--line:#e3e8ee;--line-strong:#cfd7e0;--ink:#0f1c2a;--ink-2:#3c4a5a;--ink-3:#6b7888;--ink-4:#98a3af;--brand:#0d7d79;--brand-soft:#e6f4f2;--brand-ink:#0b6461;
--ui:#175cd3;--ui-s:#eef4ff;--api:#3f6fb0;--api-s:#f0f5fb;--gw:#4a5868;--gw-s:#f1f3f6;--auth:#b54708;--auth-s:#fff4ea;--opd:#0d7d79;--opd-s:#e6f4f2;--lab:#6941c6;--lab-s:#f4f0fe;--db:#5b6675;--db-s:#eff1f4;
--font-sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1417;--surface:#121d21;--subtle:#152227;--line:#223238;--line-strong:#2f444b;--ink:#e6eef0;--ink-2:#b9c7cb;--ink-3:#8597a0;--ink-4:#627580;--brand:#3dbab3;--brand-soft:#123331;--brand-ink:#6fd3cc;--ui:#84adff;--ui-s:#15223a;--api:#8fb3e3;--api-s:#152030;--gw:#a9b6c4;--gw-s:#1a2228;--auth:#f7a66b;--auth-s:#2b1c10;--opd:#3dbab3;--opd-s:#123331;--lab:#b9a3f5;--lab-s:#221a36;--db:#a3adb9;--db-s:#1a2226;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1417;--surface:#121d21;--subtle:#152227;--line:#223238;--line-strong:#2f444b;--ink:#e6eef0;--ink-2:#b9c7cb;--ink-3:#8597a0;--ink-4:#627580;--brand:#3dbab3;--brand-soft:#123331;--brand-ink:#6fd3cc;--ui:#84adff;--ui-s:#15223a;--api:#8fb3e3;--api-s:#152030;--gw:#a9b6c4;--gw-s:#1a2228;--auth:#f7a66b;--auth-s:#2b1c10;--opd:#3dbab3;--opd-s:#123331;--lab:#b9a3f5;--lab-s:#221a36;--db:#a3adb9;--db-s:#1a2226;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--font-sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
.gutter{padding-inline:max(16px,env(safe-area-inset-left,0px))}
.inner{max-width:1400px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .inner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:10px}
.brand{display:flex;gap:10px;align-items:center}.mark{width:28px;height:28px;border-radius:7px;background:var(--brand);display:grid;place-items:center}
.brand b{font-weight:600}.brand small{display:block;color:var(--ink-3);font-size:12.5px}
.tabs{display:flex;gap:2px}.tabs a{text-decoration:none;color:var(--ink-3);font-weight:500;font-size:13.5px;padding:7px 12px;border-radius:8px}
.tabs a[aria-current=page]{color:var(--brand-ink);background:var(--brand-soft)}
main{padding-block:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.lay{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px;align-items:start}
.pick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);max-height:calc(100vh - 90px);overflow:auto;padding:10px}
.pick input{width:100%;height:34px;border:1px solid var(--line-strong);border-radius:8px;background:var(--subtle);padding:0 10px;margin-bottom:6px}
.pick h4{margin:12px 6px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.pick button{display:flex;width:100%;gap:8px;align-items:center;text-align:left;border:0;background:none;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.pick button:hover{background:var(--subtle)}.pick button.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
[data-t=ui]{--c:var(--ui);--cs:var(--ui-s)}[data-t=api]{--c:var(--api);--cs:var(--api-s)}[data-t=gw]{--c:var(--gw);--cs:var(--gw-s)}[data-t=auth]{--c:var(--auth);--cs:var(--auth-s)}[data-t=opd]{--c:var(--opd);--cs:var(--opd-s)}[data-t=lab]{--c:var(--lab);--cs:var(--lab-s)}[data-t=db]{--c:var(--db);--cs:var(--db-s)}
.head{padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.head h2{margin:0;font-size:19px;letter-spacing:-.01em}.head .sub{color:var(--ink-3);font-size:13px;font-family:var(--font-mono)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-size:13px}.seg button.on{background:var(--brand);color:#fff}
select{border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:6px 8px;font-size:13px}
.scroll{overflow:auto;border-top:1px solid var(--line);background:var(--subtle);border-radius:0 0 12px 12px}
.dg{position:relative}.dg svg{position:absolute;inset:0;pointer-events:none}
.n{position:absolute;border:1px solid var(--line-strong);border-left:4px solid var(--c);background:var(--cs);border-radius:8px;padding:3px 9px;text-align:left;cursor:pointer;overflow:hidden;transition:opacity .15s}
.n b{display:block;font-weight:600;font-size:12.5px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.n i{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);font-family:var(--font-mono);white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.n:hover{box-shadow:0 0 0 2px var(--c)}.n.focus{box-shadow:0 0 0 3px var(--c);background:var(--surface)}.n.dim{opacity:.18}
.e{fill:none;stroke:var(--ink-4);stroke-width:1.3;opacity:.7}.e.x{stroke-dasharray:5 4}.e.hl{stroke:var(--brand);stroke-width:2.2;opacity:1}.e.dim{opacity:.07}
.el{font:10.5px var(--font-mono);fill:var(--ink-2);paint-order:stroke;stroke:var(--subtle);stroke-width:4px}
.cols{display:flex;gap:0;padding:8px 14px 0;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);background:var(--subtle)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px}
.box{padding:14px 16px}.box h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.row{display:flex;gap:8px;align-items:baseline;width:100%;border:0;background:none;text-align:left;padding:6px 6px;border-radius:6px;cursor:pointer;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.row:hover{background:var(--subtle)}
.row small{color:var(--ink-3);font-family:var(--font-mono);font-size:11.5px;margin-left:auto;text-align:right;overflow-wrap:anywhere}
.mono{font-family:var(--font-mono);font-size:12px;overflow-wrap:anywhere}.muted{color:var(--ink-3)}
.chip{display:inline-block;border:1px solid var(--line-strong);border-radius:99px;padding:2px 10px;font-size:12.5px;margin:2px 4px 2px 0;background:var(--subtle)}
.ln{padding:4px 0;border-top:1px solid var(--line)}.ln:first-of-type{border-top:0}
.note{padding:10px 16px;font-size:13px;color:var(--ink-2);border-top:1px solid var(--line)}
@media(max-width:860px){.lay{grid-template-columns:minmax(0,1fr)}.pick{position:static;max-height:240px}}
</style></head><body>

<script type="application/json" id="g">{"nodes":{"ctl-auth-AuthController":{"name":"AuthController","lane":"ctl","tone":"auth","sub":"Controller · auth","info":["POST /api/v1/auth/login  ·  public / authenticated","POST /api/v1/auth/refresh  ·  public / authenticated","POST /api/v1/auth/logout  ·  public / authenticated","POST /api/v1/auth/register  ·  ADMIN","GET /api/v1/auth/profile  ·  public / authenticated","GET /api/v1/auth/doctors  ·  NURSE, DOCTOR, ADMIN","GET /api/v1/auth/users/resolve  ·  SYSTEM","GET /api/v1/auth/users/resolve-id  ·  SYSTEM"],"doc":"","flows":["login","refresh","register"]},"repo-auth-RefreshTokenRepository":{"name":"RefreshTokenRepository","lane":"repo","tone":"auth","sub":"Repository · auth","info":["findByTokenHashForUpdate()","revokeFamily()","revokeAllForUser()","deleteSessionsEndedBefore()"],"doc":"","flows":[]},"repo-auth-UserAccountRepository":{"name":"UserAccountRepository","lane":"repo","tone":"auth","sub":"Repository · auth","info":["findByUsername()","existsByUsername()","existsByEmail()","findByRoleAndEnabledTrueOrderByFullNameAsc()"],"doc":"","flows":["login"]},"svc-auth-AuthService":{"name":"AuthService","lane":"svc","tone":"auth","sub":"Service · auth","info":["registerNewUser() → UserAccountRepository.existsByUsername, UserAccountRepository.existsByEmail, UserAccountRepository.save, AuthService.trimToNull","authenticateUser() → UserAccountRepository.findByUsername, RefreshTokenService.startSession, AuthService.toLoginResponse","refresh() → RefreshTokenService.rotate, AuthService.toLoginResponse","toLoginResponse() → JwtTokenProvider.generateToken, JwtTokenProvider.getExpirationMs","listActiveDoctors() → UserAccountRepository.findByRoleAndEnabledTrueOrderByFullNameAsc, AuthService.toSummary","resolveUser() → UserAccountRepository.findByUsername, AuthService.toSummary","toSummary()","trimToNull()"],"doc":"","flows":["login","refresh","register"]},"svc-auth-RefreshTokenService":{"name":"RefreshTokenService","lane":"svc","tone":"auth","sub":"Service · auth","info":["startSession() → RefreshTokenService.now, RefreshTokenService.issue","rotate() → RefreshTokenRepository.findByTokenHashForUpdate, RefreshTokenRepository.revokeFamily, RefreshTokenService.now, RefreshTokenService.sha256, RefreshTokenService.issue","revoke() → RefreshTokenRepository.findByTokenHashForUpdate, RefreshTokenRepository.revokeFamily, RefreshTokenService.sha256, RefreshTokenService.now","revokeAllForUser() → RefreshTokenRepository.revokeAllForUser, RefreshTokenService.now","purgeExpired() [@Scheduled] → RefreshTokenRepository.deleteSessionsEndedBefore, RefreshTokenService.now","issue() → RefreshTokenRepository.save, RefreshTokenService.sha256, RefreshTokenService.truncate","now()","sha256()","truncate()"],"doc":"Issues, rotates and revokes refresh tokens. ; Idle timeout (app.refresh.idle-ttl): each rotation pushes expiry forward (sliding session). ; Session cap (app.refresh.session-ttl): a family can never outlive its first login by more than this. ; Reuse detection: presenting a token that was already rotated (outside a short","flows":["login","refresh"]},"repo-opd-AccessGrantRepository":{"name":"AccessGrantRepository","lane":"repo","tone":"opd","sub":"Repository · opd","info":["existsByVisitIdAndUsernameAndExpiresAtAfter()"],"doc":"","flows":["breakglass"]},"repo-opd-ClinicalAccessLogRepository":{"name":"ClinicalAccessLogRepository","lane":"repo","tone":"opd","sub":"Repository · opd","info":["findByVisitIdOrderByOccurredAtAsc()"],"doc":"","flows":[]},"svc-opd-ClinicalAccessService":{"name":"ClinicalAccessService","lane":"svc","tone":"opd","sub":"Service · opd","info":["recordRead() → ClinicalAccessLogRepository.save","clinicalView() → VisitRepository.findById","breakGlass() → VisitRepository.findById, AccessGrantRepository.save, ClinicalAccessLogRepository.save, VisitService.recordEvent"],"doc":"Read audit and break-glass grants.","flows":["review","signoff","breakglass"]},"ctl-opd-PatientController":{"name":"PatientController","lane":"ctl","tone":"opd","sub":"Controller · opd","info":["POST /api/v1/opd/patients  ·  NURSE, ADMIN","GET /api/v1/opd/patients  ·  NURSE, DOCTOR, ADMIN"],"doc":"","flows":["register"]},"ctl-opd-QueueStreamController":{"name":"QueueStreamController","lane":"ctl","tone":"opd","sub":"Controller · opd","info":["GET /api/v1/opd/stream  ·  NURSE, DOCTOR, ADMIN"],"doc":"Live \"something changed in your queue\" notices for the worklist screens.","flows":["queue"]},"ctl-opd-TriageController":{"name":"TriageController","lane":"ctl","tone":"opd","sub":"Controller · opd","info":["POST /api/v1/opd/triage/vitals  ·  NURSE (open visit)","GET /api/v1/opd/triage/vitals/visit/{visitId}  ·  NURSE, DOCTOR (assigned / break-glass)"],"doc":"","flows":["vitals"]},"ctl-opd-VisitController":{"name":"VisitController","lane":"ctl","tone":"opd","sub":"Controller · opd","info":["POST /api/v1/opd/visits  ·  NURSE, ADMIN","GET /api/v1/opd/visits/{id}  ·  NURSE, ADMIN, DOCTOR (assigned / break-glass)","GET /api/v1/opd/visits/{id}/clinical  ·  DOCTOR (assigned / break-glass)","POST /api/v1/opd/visits/{id}/break-glass  ·  DOCTOR","GET /api/v1/opd/visits/{id}/events  ·  NURSE, ADMIN, DOCTOR (assigned / break-glass)","GET /api/v1/opd/visits/doctor/queue  ·  DOCTOR","GET /api/v1/opd/visits/triage-queue  ·  NURSE, ADMIN","GET /api/v1/opd/visits/today  ·  NURSE, DOCTOR, ADMIN","POST /api/v1/opd/visits/{id}/start-consultation  ·  DOCTOR (assigned, open visit)","POST /api/v1/opd/visits/{id}/send-to-lab  ·  DOCTOR (assigned, open visit)","POST /api/v1/opd/visits/{id}/conclude  ·  DOCTOR (assigned, open visit)","POST /api/v1/opd/visits/lab-status/refresh  ·  DOCTOR, ADMIN","GET /api/v1/opd/visits/{id}/lab-results  ·  DOCTOR (assigned / break-glass)","GET /api/v1/opd/visits/{id}/lab-report  ·  DOCTOR (assigned / break-glass)"],"doc":"Visit endpoints. Role checks that depend on the visit itself (assigned doctor, status) go through the visitAccess policy bean (security/VisitAccessPolicy), never ],"doc":"Writes outbox rows. MANDATORY: a row only makes sense inside the transaction of the change that needs it.","flows":["sendlab"]},"repo-opd-PatientRepository":{"name":"PatientRepository","lane":"repo","tone":"opd","sub":"Repository · opd","info":["findFirstByPhone()","findByMrn()","search()","findAllByOrderByCreatedAtDesc()","getNextMrnSequenceValue()"],"doc":"","flows":[]},"repo-opd-VisitEventRepository":{"name":"VisitEventRepository","lane":"repo","tone":"opd","sub":"Repository · opd","info":["findByVisitIdOrderByOccurredAtAsc()"],"doc":"","flows":[]},"repo-opd-VisitRepository":{"name":"VisitRepository","lane":"repo","tone":"opd","sub":"Repository · opd","info":["hasActiveVisit()","findDoctorQueue()","findTriageQueue()","findTodaysVisits()","findQueueItem()","findWithPatient()","findByStatusAndLatestLabOrderIdIsNotNull()","findAccessView()","findAssignedDoctorUsername()","attachLabOrder()","returnUndeliveredLabOrder()","transition()"],"doc":"","flows":["vitals","queue","sendlab"]},"repo-opd-VitalSignsRepository":{"name":"VitalSignsRepository","lane":"repo","tone":"opd","sub":"Repository · opd","info":["findFirstByVisitIdOrderByRecordedAtDesc()","findByVisitIdOrderByRecordedAtDesc()"],"doc":"","flows":[]},"svc-opd-ConsultationWorkflowService":{"name":"ConsultationWorkflowService","lane":"svc","tone":"opd","sub":"Service · opd","info":["refreshLabStatuses() → VisitRepository.findByStatusAndLatestLabOrderIdIsNotNull, LabIntegrationService.getOrders, ServiceTokenProvider.bearer, VisitRepository.transition, VisitService.recordEvent","startConsultation() → VisitRepository.findById, VisitService.requireAssignedDoctor, VisitService.recordEvent","getLabResults() → VisitRepository.findById, ConsultationWorkflowService.loadLabResults","getLabReport() → VisitRepository.findWithPatient, LabReportPdfService.render, ConsultationWorkflowService.loadLabResults","conclude() → VisitRepository.findById, VisitService.requireAssignedDoctor, VisitService.recordEvent","loadLabResults() → ServiceTokenProvider.bearer, LabIntegrationService.getOrders, LabIntegrationService.getResults"],"doc":"","flows":["queue","review","signoff","encryption"]},"svc-opd-DoctorIntegrationService":{"name":"DoctorIntegrationService","lane":"svc","tone":"opd","sub":"Service · opd","info":["requireDoctor() [@Cacheable] [@Bulkhead] [@CircuitBreaker]"],"doc":"Looks up staff in the auth service over the internal, secret-protected endpoint.","flows":["register"]},"svc-opd-LabIntegrationService":{"name":"LabIntegrationService","lane":"svc","tone":"opd","sub":"Service · opd","info":["raiseLabInvestigationOrder() [@Bulkhead] [@CircuitBreaker] → LabIntegrationService.execute","getOrders() [@Bulkhead] [@CircuitBreaker] → LabIntegrationService.execute","getResults() [@Bulkhead] [@CircuitBreaker] → LabIntegrationService.execute","execute()"],"doc":"","flows":["queue","sendlab","review"]},"svc-opd-LabReportPdfService":{"name":"LabReportPdfService","lane":"svc","tone":"opd","sub":"Service · opd","info":["render() [@Bulkhead] → LabReportPdfService.addInfo, LabReportPdfService.age, LabReportPdfService.sex, LabReportPdfService.orDash, LabReportPdfService.format…","addInfo() → LabReportPdfService.orDash","cell()","age()","sex()","format()","orDash()"],"doc":"","flows":["review"]},"svc-opd-LabStatusSyncJob":{"name":"LabStatusSyncJob","lane":"svc","tone":"opd","sub":"Background job · opd","info":["sync() [@Scheduled] → ConsultationWorkflowService.refreshLabStatuses"],"doc":"One server-side job asks the lab which waiting orders are done, instead of every doctor's screen calling /lab-status/refresh on its own timer. Lab load stays flat no matter how many doctors are signed in. Runs only when scheduling is enabled (see SchedulingConfig).","flows":["queue"]},"svc-opd-PatientService":{"name":"PatientService","lane":"svc","tone":"opd","sub":"Service · opd","info":["registerPatient() → DoctorIntegrationService.requireDoctor, PatientService.rejectDuplicatePhone, PatientService.createPatientWi () => URL.revokeObjectURL(url), 60_000);\n  } catch (e) {\n    win?.close();\n    throw e;\n  }\n},"],"doc":"","flows":["review"]},"api-LabApi-catalogue":{"name":"LabApi.catalogue","lane":"api","tone":"api","sub":"GET /api/v1/lab/tests","info":["catalogue: () => api.get<LabTest[]>('/api/v1/lab/tests').then((r) => r.data),"],"doc":"","flows":["sendlab"]},"api-LabApi-queue":{"name":"LabApi.queue","lane":"api","tone":"api","sub":"GET /api/v1/lab/orders/queue","info":["queue: (statuses?: LabOrderStatus[]) =>\n  api\n    .get<LabOrder[]>('/api/v1/lab/orders/queue', { params: { status: statuses }, paramsSerializer: { indexes: null } })\n    .then((r) => r.data),"],"doc":"","flows":["collect"]},"api-LabApi-collectSample":{"name":"LabApi.collectSample","lane":"api","tone":"api","sub":"POST /api/v1/lab/orders/{x}/tests/{x}/collect","info":["collectSample: (id: number, testCode: string) =>\n  api.post<LabOrder>(`/api/v1/lab/orders/${id}/tests/${encodeURIComponent(testCode)}/collect`).then((r) => r.data),"],"doc":"","flows":["collect"]},"api-LabApi-setStatus":{"name":"LabApi.setStatus","lane":"api","tone":"api","sub":"PATCH /api/v1/lab/orders/{x}/status","info":["setStatus: (id: number, status: LabOrderStatus) =>\n  api.patch<LabOrder>(`/api/v1/lab/orders/${id}/status`, { status }).then((r) => r.data),"],"doc":"","flows":[]},"api-LabApi-parameters":{"name":"LabApi.parameters","lane":"api","tone":"api","sub":"GET /api/v1/lab/tests/parameters","info":["parameters: (codes: string[]) =>\n  api.get<TestParameter[]>('/api/v1/lab/tests/parameters', { params: { codes: codes.join(',') } }).then((r) => r.data),"],"doc":"","flows":["results"]},"api-LabApi-submitResults":{"name":"LabApi.submitResults","lane":"api","tone":"api","sub":"POST /api/v1/lab/orders/{x}/results","info":["submitResults: (orderId: number, results: ResultEntry[]) =>\n  api.post<LabResultItem[]>(`/api/v1/lab/orders/${orderId}/results`, { results }).then((r) => r.data),"],"doc":"","flows":["results"]},"api-Session-refresh":{"name":"Session.refresh","lane":"api","tone":"api","sub":"POST /api/v1/auth/refresh","info":["/**\n * Exchanges the refresh cookie for a new access token. Concurrent callers share one request,\n * so ten 401s arriving together trigger a single refresh. Resolves null when the session is over.\n */\nexport function refreshAccessToken(): Promise<string | null> {\n  inFlight ??= api\n    .post<SessionResponse>(REFRESH_URL, null, { headers: { 'X-JB-Refresh': '1' } })\n    .then((res) => {\n      setAccessToken(res.data.accessToken);\n      sessionListener?.(res.data);\n      return res.data.accessToken;\n    })\n    .catch(() => {\n      setAccessToken(null);\n      sessionListener?.(null);\n      return null;\n    })\n    .finally(() => { inFlight = null; });\n  return inFlight;\n}"],"doc":"","flows":["refresh"]},"api-QueueStream-connect":{"name":"QueueStream.connect","lane":"api","tone":"api","sub":"GET /api/v1/opd/stream","info":["/**\n * Calls `onChange` (debounced) whenever the OPD service reports a visit change relevant to this user.\n * Uses fetch-based SSE because native EventSource can't send an Authorization header, and the access\n * token only lives in memory. Keep usePolling running at a slow interval as a fallback.\n */\nexport function useQueueStream(onChange: () => void, enabled = true) {\n  const callback = useRef(onChange);\n  useEffect(() => { callback.current = onChange; });\n\n  useEffect(() => {\n    if (!enabled) return;\n    const ctrl = new AbortController();\n    let timer: ReturnType<typeof setTimeout> | undefined;\n    const fire = () => {\n      clearTimeout(timer);\n      timer = setTimeout(() => callback.current(), DEBOUNCE_MS);\n    };\n\n    fetchEventSource(STREAM_URL, {\n      signal: ctrl.signal,\n      openWhenHidden: false,   // closes while the tab is hidden, reconnects when it is shown again\n      // Read the token on every (re)connect: it is replaced every 15 minutes.\n      fetch: (input, init) => fetch(input, {\n        ...init,\n        credentials: 'same-origin',\n        headers: { ...(init?.headers as Record<string, string>), Authorization: `Bearer ${getAccessToken() ?? ''}` },\n      }),\n      async onopen(res) {\n        if (res.ok) return;\n        if (res.status === 401) {\n          await refreshAccessToken();   // expired token: refresh, then the library reconnects\n          throw new RetriableError('token refreshed');\n        }\n        throw new RetriableError(`stream refused: HTTP ${res.status}`);\n      },\n      onmessage(msg) {\n        if (msg.event === 'visit') fire();\n      },\n      onerror() {\n        return RETRY_MS;   // keep retrying quietly; polling covers the gap\n      },\n    }).catch(() => { /* aborted on unmount */ });\n\n    return () => {\n      clearTimeout(timer);\n      ctrl.abort();\n    };\n  }, [enabled]);\n}"],"doc":"","flows":["queue"]},"route-login":{"name":"/login","lane":"route","tone":"ui","sub":"Route · any user","info":["Renders Login"],"doc":"","flows":[]},"route-registration":{"name":"/registration","lane":"route","tone":"ui","sub":"Route · NURSE, ADMIN","info":["Renders Registration"],"doc":"","flows":[]},"route-triage":{"name":"/triage","lane":"route","tone":"ui","sub":"Route · NURSE, ADMIN","info":["Renders TriageQueue"],"doc":"","flows":[]},"route-triage-visitId":{"name":"/triage/:visitId","lane":"route","tone":"ui","sub":"Route · NURSE, ADMIN","info":["Renders VitalsPage"],"doc":"","flows":[]},"route-doctor":{"name":"/doctor","lane":"route","tone":"ui","sub":"Route · DOCTOR","info":["Renders DoctorWorkspace"],"doc":"","flows":[]},"route-lab":{"name":"/lab","lane":"route","tone":"ui","sub":"Route · LABTECH, ADMIN","info":["Renders LabWorkspace"],"doc":"","flows":[]},"route-staff":{"name":"/staff","lane":"route","tone":"ui","sub":"Route · ADMIN","info":["Renders Staff"],"doc":"","flows":[]},"route-forbidden":{"name":"/forbidden","lane":"route","tone":"ui","sub":"Route · any user","info":["Renders Forbidden"],"doc":"","flows":[] Provider","ui-AuthProvider","api-AuthApi-logout"]},{"id":"register","title":"Register a new patient","who":"Nurse","summary":"One transaction creates the patient, issues the day's next token, opens the visit and writes the first audit event. The doctor is validated against the auth service before the transaction starts, so no database connection waits on an HTTP call.","steps":["ui-VisitFields","api-AuthApi-doctors","svc-auth-AuthService","ui-NewPatientForm","api-OpdApi-registerPatient","gw-opd-service-route","ctl-opd-PatientController","svc-opd-PatientService","svc-opd-DoctorIntegrationService","ctl-auth-AuthController","db-opd-patients","svc-opd-VisitService","svc-opd-TokenIssuer","db-opd-daily_token_counters","db-opd-visits","db-opd-visit_events","svc-opd-QueueStreamHub"]},{"id":"vitals","title":"Record vitals","who":"Nurse","summary":"The triage list refreshes when the live stream says a visit changed. Saving vitals is allowed only for a nurse on an open visit (checked by the visit access policy). The first set moves the visit from REGISTERED to TRIAGED and the patient appears in the doctor's queue.","steps":["ui-TriageQueue","api-OpdApi-triageQueue","ctl-opd-VisitController","repo-opd-VisitRepository","ui-VitalsPage","api-OpdApi-saveVitals","gw-opd-service-route","ctl-opd-TriageController","svc-opd-VisitAccessPolicy","svc-opd-TriageService","db-opd-vital_signs","svc-opd-VisitService","db-opd-visit_events","svc-opd-QueueStreamHub"]},{"id":"queue","title":"Doctor's queue (live)","who":"Doctor","summary":"The doctor's screen opens a live stream and loads its list once; later changes arrive as events. Separately, one server-side job asks the lab every 15 seconds which orders are finished, so lab load stays flat however many doctors are signed in.","steps":["ui-DoctorWorkspace","api-QueueStream-connect","gw-opd-service-route","ctl-opd-QueueStreamController","svc-opd-QueueStreamHub","api-OpdApi-myQueue","ctl-opd-VisitController","svc-opd-VisitService","repo-opd-Visit     else if(l==='api')inn[n].forEach(function(e){add(e[0],n,e[2]);push(e[0],'*',nx)});
    else if(l==='gw'){AP.forEach(function(a){if(a[1]===n&&(m==='*'||a[3]===m)){add(a[0],n,E.filter(function(e){return e[0]===a[0]&&e[1]===n})[0][2]);push(a[0],'*',nx)}})}
    else if(l==='db')inn[n].forEach(function(e){add(e[0],n,'SQL');push(e[0],'*',nx)});
    else{ME.forEach(function(r){if(r[2]===n&&(m==='*'||r[3]===m)){add(r[0],n,r[4]);push(r[0],r[1],nx)}});
     if(l==='ctl')AP.forEach(function(a){if(a[2]===n&&(m==='*'||a[3]===m)){add(a[1],n,a[3]);push(a[1],a[3],nx)}})}
   }});

function layout(ids,colOf,compact){
 var W=compact?172:216,H=compact?34:46,CG=compact?56:84,RG=compact?8:14,P=14,cols={},pos={};
 ids.forEach(function(i){var c=colOf(i);(cols[c]=cols[c]||[]).push(i)});
 var keys=Object.keys(cols).map(Number).sort(function(a,b){return a-b}),maxH=0;
 keys.forEach(function(k){maxH=Math.max(maxH,cols[k].length*(H+RG))});
 keys.forEach(function(k,ci){var list=cols[k];
  function sc(i){var nb=inn[i].map(function(e){return e[0]}).concat(out[i].map(function(e){return e[1]})).filter(function(x){return pos[x]});return nb.length?nb.reduce(function(s,x){return s+pos[x].y},0)/nb.length:1e6}
  list.sort(function(a,b){return (sc(a)-sc(b))||N[a].name.localeCompare(N[b].name)});
  var off=compact?0:(maxH-list.length*(H+RG))/2;
  list.forEach(function(i,r){pos[i]={x:P+ci*(W+CG),y:P+off+r*(H+RG)}})});
 return {pos:pos,W:W,H:H,w:P*2+keys.length*(W+CG)-CG,h:P*2+maxH-RG}}
function diagram(ids,colOf,o){

  var a=L.pos[e[0]],b=L.pos[e[1]],x1=a.x+L.W,y1=a.y+L.H/2,x2=b.x,y2=b.y+L.H/2,dx=Math.max(40,Math.abs(x2-x1)/2),c=o.edgeCls?o.edgeCls(e):'';
  svg+='<path class="e '+(e[3]||'')+' '+c+'" d="M'+x1+' '+y1+'C'+(x1+dx)+' '+y1+' '+(x2-dx)+' '+y2+' '+x2+' '+y2+'" marker-end="url(#'+(c==='hl'?'ah':'ar')+')"><title>'+esc(N[e[0]].name+' → '+N[e[1]].name+((o.edgeLabel?o.edgeLabel(e):e[2])?'  ['+(o.edgeLabel?o.edgeLabel(e):e[2])+']':''))+'</title></path>';
  if(o.labels&&(o.edgeLabel?o.edgeLabel(e):e[2])&&c!=='dim'&&o.labels(e)){var t=(o.edgeLabel?o.edgeLabel(e):e[2]).split(' | ')[0];if(t.length>26)t=t.slice(0,25)+'…';lab+='<text class="el" text-anchor="middle" x="'+((x1+x2)/2)+'" y="'+((y1+y2)/2-4)+'">'+esc(t)+'</text>'}});
 var h='<div class="dg" style="width:'+L.w+'px;height:'+L.h+'px"><svg width="'+L.w+'" height="'+L.h+'">'+svg+lab+'</svg>';

 return h+'</div>'}

 var mn=Math.min.apply(null,ids.map(function(i){return dep[i]})),mx=Math.max.apply(null,ids.map(function(i){return dep[i]}));
 var f=N[S.id];

 LANES.forEach(function(l){var items=Object.keys(N).filter(function(k){return N[k].lane===l&&N[k].name.toLowerCase().indexOf(S.q.toLowerCase())>=0}).sort(function(a,b){return N[a].tone.localeCompare(N[b].tone)||N[a].name.localeCompare(N[b].name)});
  if(!items.length)return;h+='<h4>'+LL[l]+' ('+items.length+')</h4>';items.forEach(function(k){h+='<button data-go="'+k+'" data-t="'+N[k].tone+'" class="'+(k===S.id?'on':'')+'"><span class="dot"></span>'+esc(N[k].name)+'</button>'})});
 h+='</aside><div><section class="card"><div class="head"><div><h2>'+esc(f.name)+'</h2><div class="sub">'+esc(f.sub)+'</div></div><div class="ctl"><div class="seg" role="group" aria-label="Direction">';
 [['up','Who calls it'],['both','Both'],['down','What it calls']].forEach(function(x){h+='<button data-dir="'+x[0]+'" class="'+(S.dir===x[0]?'on':'')+'">'+x[1]+'</button>'});
 h+='</div><label>Depth <select id="dp">'+[1,2,3,9].map(function(d){return '<option value="'+d+'"'+(S.depth===d?' selected':'')+'>'+(d===9?'Full chain':d+' hop'+(d>1?'s':''))+'</option>'}).join('')+'</select></label></div></div>';
 var names=function(k){return k===0?'This component':k<0?(-k===1?'Called by':'Called by · '+(-k)+' hops up'):(k===1?'Calls':'Calls · '+k+' hops down')};
 var L0=216,CG0=84,keys=[];for(var k=mn;k<=mx;k++)keys.push(k);
 h+='<div class="scroll">'+colHeads(keys,L0,CG0,names)+diagram(ids,function(i){return dep[i]-mn},{
  edgeOK:function(e){var k=e[0]+'>'+e[1];return tu.ek[k]||td.ek[k]},
  edgeLabel:function(e){var k=e[0]+'>'+e[1];return tu.lb[k]||td.lb[k]||e[2]},
  edgeCls:function(e){return (e[0]===S.id||e[1]===S.id)?'hl':''},labels:function(){return true},nodeCls:function(i){return i===S.id?'focus':''}})+'</div>';
 h+='<div class="note">Click any box to re-centre the flow on it. Dashed lines are direct service-to-service HTTP calls that bypass the gateway. Labels in brackets, such as (event) and (policy), are in-process hand-offs: live-update events and access-policy checks.</div></section><div class="grid">';
 function rows(list,idx){return list.length?list.map(function(e){var o=N[e[idx]];return '<button class="row" data-go="'+o.id+'" data-t="'+o.tone+'"><span class="dot"></span><span>'+esc(o.name)+'</span><small>'+esc(e[2]||o.sub)+'</small></button>'}).join(''):'<div class="muted">Nothing — this is where the flow starts.</div>'}
 h+='<div class="card box"><h3>Called by ('+inn[S.id].length+')</h3>'+rows(inn[S.id],0)+'</div>';
 h+='<div class="card box"><h3>Calls ('+out[S.id].length+')</h3>'+(out[S.id].length?rows(out[S.id],1):'<div class="muted">Nothing — this is where the flow ends.</div>')+'</div>';
 h+='<div class="card box"><h3>Inside this component</h3>'+(f.doc?'<p style="margin:0 0 8px">'+esc(f.doc)+'</p>':'')+(f.info.length?f.info.map(function(x){return '<div class="ln mono">'+esc(x)+'</div>'}).join(''):'<div class="muted">No further detail.</div>')+'</div>';
 var fl=f.flows.map(function(id){return FL.filter(function(x){return x.id===id})[0]});
 h+='<div class="card box"><h3>Part of these user journeys</h3>'+(fl.length?fl.map(function(x){return '<a class="chip" href="#map-'+x.id+'">'+esc(x.title)+'</a>'}).join('')+'<p class="muted" style="margin:8px 0 0">Open one to see it traced across the whole system.</p>':'<div class="muted">Not on a documented journey.</div>')+'</div></div></div></div>';
 view.innerHTML=h;
 var q=document.getElementById('q');q.oninput=function(){S.q=q.value;var p=q.selectionStart;flowView();var n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)};

 (G.news||[]).forEach(function(n,i){
  h+='<div class="card box"><h3>'+(i+1)+'. '+esc(n.t)+'</h3><p style="margin:0 0 8px">'+esc(n.d)+'</p>'+
