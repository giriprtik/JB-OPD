<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeevan Bikas Flow Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f4f6f8;--surface:#fff;--subtle:#f7f9fa;--line:#e3e8ee;--line-strong:#cfd7e0;--ink:#0f1c2a;--ink-2:#3c4a5a;--ink-3:#6b7888;--ink-4:#98a3af;--brand:#0d7d79;--brand-soft:#e6f4f2;--brand-ink:#0b6461;
--ui:#175cd3;--ui-s:#eef4ff;--api:#3f6fb0;--api-s:#f0f5fb;--gw:#4a5868;--gw-s:#f1f3f6;--auth:#b54708;--auth-s:#fff4ea;--opd:#0d7d79;--opd-s:#e6f4f2;--lab:#6941c6;--lab-s:#f4f0fe;--db:#5b6675;--db-s:#eff1f4;
--font-sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1417;--surface:#121d21;--subtle:#152227;--line:#223238;--line-strong:#2f444b;--ink:#e6eef0;--ink-2:#b9c7cb;--ink-3:#8597a0;--ink-4:#627580;--brand:#3dbab3;--brand-soft:#123331;--brand-ink:#6fd3cc;--ui:#84adff;--ui-s:#15223a;--api:#8fb3e3;--api-s:#152030;--gw:#a9b6c4;--gw-s:#1a2228;--auth:#f7a66b;--auth-s:#2b1c10;--opd:#3dbab3;--opd-s:#123331;--lab:#b9a3f5;--lab-s:#221a36;--db:#a3adb9;--db-s:#1a2226;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1417;--surface:#121d21;--subtle:#152227;--line:#223238;--line-strong:#2f444b;--ink:#e6eef0;--ink-2:#b9c7cb;--ink-3:#8597a0;--ink-4:#627580;--brand:#3dbab3;--brand-soft:#123331;--brand-ink:#6fd3cc;--ui:#84adff;--ui-s:#15223a;--api:#8fb3e3;--api-s:#152030;--gw:#a9b6c4;--gw-s:#1a2228;--auth:#f7a66b;--auth-s:#2b1c10;--opd:#3dbab3;--opd-s:#123331;--lab:#b9a3f5;--lab-s:#221a36;--db:#a3adb9;--db-s:#1a2226;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--font-sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
.gutter{padding-inline:max(16px,env(safe-area-inset-left,0px))}
.inner{max-width:1400px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .inner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:10px}
.brand{display:flex;gap:10px;align-items:center}.mark{width:28px;height:28px;border-radius:7px;background:var(--brand);display:grid;place-items:center}
.brand b{font-weight:600}.brand small{display:block;color:var(--ink-3);font-size:12.5px}
.tabs{display:flex;gap:2px}.tabs a{text-decoration:none;color:var(--ink-3);font-weight:500;font-size:13.5px;padding:7px 12px;border-radius:8px}
.tabs a[aria-current=page]{color:var(--brand-ink);background:var(--brand-soft)}
main{padding-block:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.lay{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px;align-items:start}
.pick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);max-height:calc(100vh - 90px);overflow:auto;padding:10px}
.pick input{width:100%;height:34px;border:1px solid var(--line-strong);border-radius:8px;background:var(--subtle);padding:0 10px;margin-bottom:6px}
.pick h4{margin:12px 6px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.pick button{display:flex;width:100%;gap:8px;align-items:center;text-align:left;border:0;background:none;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.pick button:hover{background:var(--subtle)}.pick button.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
[data-t=ui]{--c:var(--ui);--cs:var(--ui-s)}[data-t=api]{--c:var(--api);--cs:var(--api-s)}[data-t=gw]{--c:var(--gw);--cs:var(--gw-s)}[data-t=auth]{--c:var(--auth);--cs:var(--auth-s)}[data-t=opd]{--c:var(--opd);--cs:var(--opd-s)}[data-t=lab]{--c:var(--lab);--cs:var(--lab-s)}[data-t=db]{--c:var(--db);--cs:var(--db-s)}
.head{padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.head h2{margin:0;font-size:19px;letter-spacing:-.01em}.head .sub{color:var(--ink-3);font-size:13px;font-family:var(--font-mono)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-size:13px}.seg button.on{background:var(--brand);color:#fff}
select{border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:6px 8px;font-size:13px}
.scroll{overflow:auto;border-top:1px solid var(--line);background:var(--subtle);border-radius:0 0 12px 12px}
.dg{position:relative}.dg svg{position:absolute;inset:0;pointer-events:none}
.n{position:absolute;border:1px solid var(--line-strong);border-left:4px solid var(--c);background:var(--cs);border-radius:8px;padding:3px 9px;text-align:left;cursor:pointer;overflow:hidden;transition:opacity .15s}
.n b{display:block;font-weight:600;font-size:12.5px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.n i{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);font-family:var(--font-mono);white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.n:hover{box-shadow:0 0 0 2px var(--c)}.n.focus{box-shadow:0 0 0 3px var(--c);background:var(--surface)}.n.dim{opacity:.18}
.e{fill:none;stroke:var(--ink-4);stroke-width:1.3;opacity:.7}.e.x{stroke-dasharray:5 4}.e.hl{stroke:var(--brand);stroke-width:2.2;opacity:1}.e.dim{opacity:.07}
.el{font:10.5px var(--font-mono);fill:var(--ink-2);paint-order:stroke;stroke:var(--subtle);stroke-width:4px}
.cols{display:flex;gap:0;padding:8px 14px 0;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);background:var(--subtle)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px}
.box{padding:14px 16px}.box h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.row{display:flex;gap:8px;align-items:baseline;width:100%;border:0;background:none;text-align:left;padding:6px 6px;border-radius:6px;cursor:pointer;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.row:hover{background:var(--subtle)}
.row small{color:var(--ink-3);font-family:var(--font-mono);font-size:11.5px;margin-left:auto;text-align:right;overflow-wrap:anywhere}
.mono{font-family:var(--font-mono);font-size:12px;overflow-wrap:anywhere}.muted{color:var(--ink-3)}
.chip{display:inline-block;border:1px solid var(--line-strong);border-radius:99px;padding:2px 10px;font-size:12.5px;margin:2px 4px 2px 0;background:var(--subtle)}
.ln{padding:4px 0;border-top:1px solid var(--line)}.ln:first-of-type{border-top:0}
.note{padding:10px 16px;font-size:13px;color:var(--ink-2);border-top:1px solid var(--line)}
@media(max-width:860px){.lay{grid-template-columns:minmax(0,1fr)}.pick{position:static;max-height:240px}}
</style></head><body>

<script>
(function(){
var G=JSON.parse(document.getElementById('g').textContent),N=G.nodes,E=G.edges,FL=G.flows,view=document.getElementById('view');
var out={},inn={};Object.keys(N).forEach(function(k){N[k].id=k;out[k]=[];inn[k]=[]});
E.forEach(function(e){out[e[0]].push(e);inn[e[1]].push(e)});
var LANES=['route','ui','api','gw','ctl','svc','repo','db'],LL={route:'Routes',ui:'Screens & components',api:'API client',gw:'Gateway',ctl:'Controllers',svc:'Services',repo:'Repositories',db:'Tables'};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function trace(id,down,max){
 var d={},ek={},lb={},seenS={},q=[[id,'*']],lv=0;d[id]=0;seenS[id+'|*']=1;
 var ME=G.me,AP=G.ap,ln=N[id].lane;
 function add(a,b,l){var k=a+'>'+b;ek[k]=1;if(l)lb[k]=l}
 function push(n,m,nx){var k=n+'|'+m;if(seenS[k])return;seenS[k]=1;nx.push([n,m]);if(!(n in d))d[n]=lv}
 while(q.length&&lv<max){var nx=[];lv++;
  q.forEach(function(s){var n=s[0],m=s[1],l=N[n].lane;
   if(down){
    if(l==='route'||l==='ui')out[n].forEach(function(e){add(n,e[1],e[2]);push(e[1],'*',nx)});
    else if(l==='api'){AP.forEach(function(a){if(a[0]===n){add(n,a[1],E.filter(function(e){return e[0]===n&&e[1]===a[1]})[0][2]);push(a[1],a[3],nx)}})}
    else if(l==='gw'){AP.forEach(function(a){if(a[1]===n&&(m==='*'||a[3]===m)){add(n,a[2],a[3]);push(a[2],a[3],nx)}})}
    else if(l==='db'){}
    else{ME.forEach(function(r){if(r[0]===n&&(m==='*'||r[1]===m)){add(n,r[2],r[4]);push(r[2],r[3],nx)}});
     if(l==='repo')out[n].forEach(function(e){if(N[e[1]].lane==='db'){add(n,e[1],'SQL');push(e[1],'*',nx)}})}
   }else{
    if(l==='ui'||l==='api'&&0)inn[n].forEach(function(e){add(e[0],n,e[2]);push(e[0],'*',nx)});
    else if(l==='route'){}
    else if(l==='api')inn[n].forEach(function(e){add(e[0],n,e[2]);push(e[0],'*',nx)});
    else if(l==='gw'){AP.forEach(function(a){if(a[1]===n&&(m==='*'||a[3]===m)){add(a[0],n,E.filter(function(e){return e[0]===a[0]&&e[1]===n})[0][2]);push(a[0],'*',nx)}})}
    else if(l==='db')inn[n].forEach(function(e){add(e[0],n,'SQL');push(e[0],'*',nx)});
    else{ME.forEach(function(r){if(r[2]===n&&(m==='*'||r[3]===m)){add(r[0],n,r[4]);push(r[0],r[1],nx)}});
     if(l==='ctl')AP.forEach(function(a){if(a[2]===n&&(m==='*'||a[3]===m)){add(a[1],n,a[3]);push(a[1],a[3],nx)}})}
   }});
  q=nx}
 return {d:d,ek:ek,lb:lb}}
function layout(ids,colOf,compact){
 var W=compact?172:216,H=compact?34:46,CG=compact?56:84,RG=compact?8:14,P=14,cols={},pos={};
 ids.forEach(function(i){var c=colOf(i);(cols[c]=cols[c]||[]).push(i)});
 var keys=Object.keys(cols).map(Number).sort(function(a,b){return a-b}),maxH=0;
 keys.forEach(function(k){maxH=Math.max(maxH,cols[k].length*(H+RG))});
 keys.forEach(function(k,ci){var list=cols[k];
  function sc(i){var nb=inn[i].map(function(e){return e[0]}).concat(out[i].map(function(e){return e[1]})).filter(function(x){return pos[x]});return nb.length?nb.reduce(function(s,x){return s+pos[x].y},0)/nb.length:1e6}
  list.sort(function(a,b){return (sc(a)-sc(b))||N[a].name.localeCompare(N[b].name)});
  var off=compact?0:(maxH-list.length*(H+RG))/2;
  list.forEach(function(i,r){pos[i]={x:P+ci*(W+CG),y:P+off+r*(H+RG)}})});
 return {pos:pos,W:W,H:H,w:P*2+keys.length*(W+CG)-CG,h:P*2+maxH-RG}}
function diagram(ids,colOf,o){
 var L=layout(ids,colOf,o.compact),set={};ids.forEach(function(i){set[i]=1});
 var svg='<defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--ink-3)"/></marker><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--brand)"/></marker></defs>',lab='';
 E.forEach(function(e){if(!set[e[0]]||!set[e[1]]||(o.edgeOK&&!o.edgeOK(e)))return;
  var a=L.pos[e[0]],b=L.pos[e[1]],x1=a.x+L.W,y1=a.y+L.H/2,x2=b.x,y2=b.y+L.H/2,dx=Math.max(40,Math.abs(x2-x1)/2),c=o.edgeCls?o.edgeCls(e):'';
  svg+='<path class="e '+(e[3]||'')+' '+c+'" d="M'+x1+' '+y1+'C'+(x1+dx)+' '+y1+' '+(x2-dx)+' '+y2+' '+x2+' '+y2+'" marker-end="url(#'+(c==='hl'?'ah':'ar')+')"><title>'+esc(N[e[0]].name+' → '+N[e[1]].name+((o.edgeLabel?o.edgeLabel(e):e[2])?'  ['+(o.edgeLabel?o.edgeLabel(e):e[2])+']':''))+'</title></path>';
  if(o.labels&&(o.edgeLabel?o.edgeLabel(e):e[2])&&c!=='dim'&&o.labels(e)){var t=(o.edgeLabel?o.edgeLabel(e):e[2]).split(' | ')[0];if(t.length>26)t=t.slice(0,25)+'…';lab+='<text class="el" text-anchor="middle" x="'+((x1+x2)/2)+'" y="'+((y1+y2)/2-4)+'">'+esc(t)+'</text>'}});
 var h='<div class="dg" style="width:'+L.w+'px;height:'+L.h+'px"><svg width="'+L.w+'" height="'+L.h+'">'+svg+lab+'</svg>';
 ids.forEach(function(i){var n=N[i],p=L.pos[i];h+='<button class="n '+(o.nodeCls?o.nodeCls(i):'')+'" data-t="'+n.tone+'" data-id="'+i+'" style="left:'+p.x+'px;top:'+p.y+'px;width:'+L.W+'px;height:'+L.H+'px" title="'+esc(n.name+' — '+n.sub)+'"><b>'+esc(n.name)+'</b>'+(o.compact?'':'<i>'+esc(n.sub)+'</i>')+'</button>'});
 return h+'</div>'}
function colHeads(keys,W,CG,names){return '<div class="cols">'+keys.map(function(k,i){return '<div style="flex:none;width:'+(W+CG)+'px">'+esc(names(k))+'</div>'}).join('')+'</div>'}

/* ---------- component flow ---------- */
var S={id:'svc-opd-PatientService',dir:'both',depth:9,q:''};
function flowView(){
 if(!N[S.id])S.id='svc-opd-PatientService';
 var tu=S.dir==='down'?{d:{},ek:{},lb:{}}:trace(S.id,false,S.depth),td=S.dir==='up'?{d:{},ek:{},lb:{}}:trace(S.id,true,S.depth);
 var ids=[S.id],dep={};dep[S.id]=0;Object.keys(tu.d).forEach(function(k){if(k!==S.id){dep[k]=-tu.d[k];ids.push(k)}});Object.keys(td.d).forEach(function(k){if(k!==S.id&&!(k in dep)){dep[k]=td.d[k];ids.push(k)}});
 var mn=Math.min.apply(null,ids.map(function(i){return dep[i]})),mx=Math.max.apply(null,ids.map(function(i){return dep[i]}));
 var f=N[S.id];
 var h='<div class="lay"><aside class="card pick"><input id="q" type="search" placeholder="Find a component…" value="'+esc(S.q)+'" aria-label="Find a component">';
 LANES.forEach(function(l){var items=Object.keys(N).filter(function(k){return N[k].lane===l&&N[k].name.toLowerCase().indexOf(S.q.toLowerCase())>=0}).sort(function(a,b){return N[a].tone.localeCompare(N[b].tone)||N[a].name.localeCompare(N[b].name)});
  if(!items.length)return;h+='<h4>'+LL[l]+' ('+items.length+')</h4>';items.forEach(function(k){h+='<button data-go="'+k+'" data-t="'+N[k].tone+'" class="'+(k===S.id?'on':'')+'"><span class="dot"></span>'+esc(N[k].name)+'</button>'})});
 h+='</aside><div><section class="card"><div class="head"><div><h2>'+esc(f.name)+'</h2><div class="sub">'+esc(f.sub)+'</div></div><div class="ctl"><div class="seg" role="group" aria-label="Direction">';
 [['up','Who calls it'],['both','Both'],['down','What it calls']].forEach(function(x){h+='<button data-dir="'+x[0]+'" class="'+(S.dir===x[0]?'on':'')+'">'+x[1]+'</button>'});
 h+='</div><label>Depth <select id="dp">'+[1,2,3,9].map(function(d){return '<option value="'+d+'"'+(S.depth===d?' selected':'')+'>'+(d===9?'Full chain':d+' hop'+(d>1?'s':''))+'</option>'}).join('')+'</select></label></div></div>';
 var names=function(k){return k===0?'This component':k<0?(-k===1?'Called by':'Called by · '+(-k)+' hops up'):(k===1?'Calls':'Calls · '+k+' hops down')};
 var L0=216,CG0=84,keys=[];for(var k=mn;k<=mx;k++)keys.push(k);
 h+='<div class="scroll">'+colHeads(keys,L0,CG0,names)+diagram(ids,function(i){return dep[i]-mn},{
  edgeOK:function(e){var k=e[0]+'>'+e[1];return tu.ek[k]||td.ek[k]},
  edgeLabel:function(e){var k=e[0]+'>'+e[1];return tu.lb[k]||td.lb[k]||e[2]},
  edgeCls:function(e){return (e[0]===S.id||e[1]===S.id)?'hl':''},labels:function(){return true},nodeCls:function(i){return i===S.id?'focus':''}})+'</div>';
 h+='<div class="note">Click any box to re-centre the flow on it. Dashed lines are direct service-to-service calls that bypass the gateway.</div></section><div class="grid">';
 function rows(list,idx){return list.length?list.map(function(e){var o=N[e[idx]];return '<button class="row" data-go="'+o.id+'" data-t="'+o.tone+'"><span class="dot"></span><span>'+esc(o.name)+'</span><small>'+esc(e[2]||o.sub)+'</small></button>'}).join(''):'<div class="muted">Nothing — this is where the flow starts.</div>'}

 h+='<div class="card box"><h3>Calls ('+out[S.id].length+')</h3>'+(out[S.id].length?rows(out[S.id],1):'<div class="muted">Nothing — this is where the flow ends.</div>')+'</div>';
 h+='<div class="card box"><h3>Inside this component</h3>'+(f.doc?'<p style="margin:0 0 8px">'+esc(f.doc)+'</p>':'')+(f.info.length?f.info.map(function(x){return '<div class="ln mono">'+esc(x)+'</div>'}).join(''):'<div class="muted">No further detail.</div>')+'</div>';

 h+='<div class="card box"><h3>Part of these user journeys</h3>'+(fl.length?fl.map(function(x){return '<a class="chip" href="#map-'+x.id+'">'+esc(x.title)+'</a>'}).join('')+'<p class="muted" style="margin:8px 0 0">Open one to see it traced across the whole system.</p>':'<div class="muted">Not on a documented journey.</div>')+'</div></div></div></div>';
