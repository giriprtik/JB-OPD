spring.application.name=jb-opd-service
server.port=${SERVER_PORT:8082}
app.hospital.name=Jeevan Bikas Hospital

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5455/opd_clinical_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:opd_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:opd_secure_password}

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

app.jwt.secret=${APP_JWT_SECRET}
app.internal-secret=${INTERNAL_SERVICES_SECRET}
auth.service.url=${AUTH_SERVICE_URL:http://jb-auth-api:8081}
lab.service.url=${LAB_SERVICE_URL:http://jb-lab-service:8083}

logging.level.root=INFO
logging.level.com.hospital=INFO

# ---------------------------------------------------------------- outbound HTTP
app.http.connect-timeout-ms=2000
app.http.response-timeout=4s

# ---------------------------------------------------------------- background jobs
# Integration tests turn this off so jobs don't run against mocked services.
app.scheduling.enabled=${APP_SCHEDULING_ENABLED:true}
# One server-side lab status sync replaces per-screen polling of /lab-status/refresh.
app.lab-sync.delay-ms=${APP_LAB_SYNC_DELAY_MS:15000}

# ---------------------------------------------------------------- resilience (lab + auth)
# Only 5xx-style downstream failures count; a caller's 400/409 never trips a breaker.
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=60
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.default.record-failure-predicate=com.hospital.opd.resilience.DownstreamFailurePredicate
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.instances.lab.base-config=default
resilience4j.circuitbreaker.instances.auth.base-config=default

# Cap concurrent calls so a slow dependency can't eat every Tomcat thread.
resilience4j.bulkhead.instances.lab.max-concurrent-calls=20
resilience4j.bulkhead.instances.lab.max-wait-duration=0
resilience4j.bulkhead.instances.auth.max-concurrent-calls=10
resilience4j.bulkhead.instances.auth.max-wait-duration=0

management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,circuitbreakers,metrics

# ---------------------------------------------------------------- field encryption (clinical free text)
# id:base64key[,id2:base64key2]; each key from `openssl rand -base64 32`. Keep an offline copy: lose it, lose the data.
app.crypto.keys=${APP_CRYPTO_KEYS}
app.crypto.active-key=${APP_CRYPTO_ACTIVE_KEY:k1}
# true only while migrating an existing database: lets old plaintext rows be read until the backfill finishes.
app.crypto.allow-plaintext=${APP_CRYPTO_ALLOW_PLAINTEXT:false}
# Run the one-off backfill/rotation job at startup (then set back to false).
app.crypto.backfill=${APP_CRYPTO_BACKFILL:false}

# Lab-report PDF rendering: a few at once; others wait up to 2 s, then get a 503.
resilience4j.bulkhead.instances.pdf.max-concurrent-calls=4
resilience4j.bulkhead.instances.pdf.max-wait-duration=2s

# ---------------------------------------------------------------- connection pool
# Fail fast (3 s) instead of hanging a desk for Hikari's default 30 s when the pool is exhausted.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.leak-detection-threshold=10000
# Don't hold a DB connection for the whole HTTP request (incl. JSON rendering); services return DTOs.
spring.jpa.open-in-view=false
