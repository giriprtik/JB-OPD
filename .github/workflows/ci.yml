name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [jb-auth-service, jb-opd-service, jb-lab-service, jb-gateway]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      # `verify` = unit tests (surefire, *Test) + integration tests (failsafe, *IT).
      # The integration tests start PostgreSQL with Testcontainers; Docker is preinstalled on the runner.
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/target/surefire-reports/
            ${{ matrix.service }}/target/failsafe-reports/
          retention-days: 7

  frontend:
    name: jb-hospital-ui
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: jb-hospital-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: jb-hospital-ui/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests with coverage
        run: npm run coverage
      - name: Production build
        run: npx vite build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage
          path: jb-hospital-ui/coverage/
          retention-days: 7

  # Builds every Docker image, starts the whole stack and drives it through nginx -> gateway -> services.
  e2e:
    name: docker compose smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Smoke test
        run: scripts/smoke-test.sh http://localhost:3000

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
