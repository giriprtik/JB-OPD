r) => api.post(`/api/v1/opd/visits/${id}/start-consultation`),","to":"opd:VisitController","m":"startConsultation","usedBy":[{"file":"pages/Doctor/index.tsx","fn":"DoctorWorkspace"}]},{"id":"OpdApi.sendToLab","obj":"OpdApi","name":"sendToLab","method":"POST","path":"/api/v1/opd/visits/{x}/send-to-lab","src":"sendToLab: (id: number, testCodes: string[], clinicalNotes?: string) =>\n  api.post(`/api/v1/opd/visits/${id}/send-to-lab`, { testCodes, clinicalNotes }),","to":"opd:VisitController","m":"sendToLab","usedBy":[{"file":"pages/Doctor/Consultation.tsx","fn":"OrderTests"}]},{"id":"OpdApi.conclude","obj":"OpdApi","name":"conclude","method":"POST","path":"/api/v1/opd/visits/{x}/conclude","src":"conclude: (id: number, diagnosis: string, consultationNotes: string) =>\n  api.post(`/api/v1/opd/visits/${id}/conclude`, { diagnosis, consultationNotes }),","to":"opd:VisitController","m":"conclude","usedBy":[{"file":"pages/Doctor/Consultation.tsx","fn":"SignOff"}]},{"id":"OpdApi.labResults","obj":"OpdApi","name":"labResults","method":"GET","path":"/api/v1/opd/visits/{x}/lab-results","src":"labResults: async (id: number): Promise<VisitLabResults | null> => {\n  const r = await api.get<VisitLabResults>(`/api/v1/opd/visits/${id}/lab-results`);\n  return r.status === 204 ? null : r.data;\n},","to":"opd:VisitController","m":"getLabResults","usedBy":[{"file":"pages/Doctor/Consultation.tsx","fn":"Consultation"}]},{"id":"OpdApi.openLabReport","obj":"OpdApi","name":"openLabReport","method":"GET","path":"/api/v1/opd/visits/{x}/lab-report","src":"/** Opens the PDF in a new tab (download fallback when pop-ups are blocked). */\nopenLabReport: async (id: number) => {\n  const win = window.open('', '_blank');\n  try {\n    const r = await api.get(`/api/v1/opd/visits/${id}/lab-report`, { responseType: 'blob' });\n    const url = URL.createObjectURL(new Blob([r.data], { type: 'application/pdf' }));\n    if (win) win.location.href = url;\n    else Object.assign(document.createElement('a'), { href: url, download: `lab-report-${id}.pdf` }).click();\n    setTimeout(() => URL.revokeObjectURL(url), 60_000);\n  } catch (e) {\n    win?.close();\n    throw e;\n  }\n},","to":"opd:VisitController","m":"getLabReport","usedBy":[{"file":"pages/Doctor/Consultation.tsx","fn":"LabResults"}]},{"id":"LabApi.catalogue","obj":"LabApi","name":"catalogue","method":"GET","path":"/api/v1/lab/tests","src":"catalogue: () => api.get<LabTest[]>('/api/v1/lab/tests').then((r) => r.data),","to":"lab:LabTestController","m":"getCatalogue","usedBy":[{"file":"pages/Doctor/Consultation.tsx","fn":"Consultation"}]},{"id":"LabApi.queue","obj":"LabApi","name":"queue","method":"GET","path":"/api/v1/lab/orders/queue","src":"queue: (statuses?: LabOrderStatus[]) =>\n  api\n    .get<LabOrder[]>('/api/v1/lab/orders/queue', { params: { status: statuses }, paramsSerializer: { indexes: null } })\n    .then((r) => r.data),","to":"lab:LabOrderController","m":"getOrderQueue","usedBy":[{"file":"pages/Lab/index.tsx","fn":"LabWorkspace"}]},{"id":"LabApi.collectSample","obj":"LabApi","name":"collectSample","method":"POST","path":"/api/v1/lab/orders/{x}/tests/{x}/collect","src":"collectSample: (id: number, testCode: string) =>\n  api.post<LabOrder>(`/api/v1/lab/orders/${id}/tests/${encodeURIComponent(testCode)}/collect`).then((r) => r.data),","to":"lab:LabOrderController","m":"collectSample","usedBy":[{"file":"pages/Lab/index.tsx","fn":"LabWorkspace"}]},{"id":"LabApi.setStatus","obj":"LabApi","name":"setStatus","method":"PATCH","path":"/api/v1/lab/orders/{x}/status","src":"setStatus: (id: number, status: LabOrderStatus) =>\n  api.patch<LabOrder>(`/api/v1/lab/orders/${id}/status`, { status }).then((r) => r.data),","to":"lab:LabOrderController","m":"changeOrderStatus","usedBy":[]},{"id":"LabApi.parameters","obj":"LabApi","name":"parameters","method":"GET","path":"/api/v1/lab/tests/parameters","src":"parameters: (codes: string[]) =>\n  api.get<TestParameter[]>('/api/v1/lab/tests/parameters', { params: { codes: codes.join(',') } }).then((r) => r.data),","to":"lab:LabTestController","m":"getParameters","usedBy":[{"file":"pages/Lab/ResultEntry.tsx","fn":"ResultEntry"}]},{"id":"LabApi.submitResults","obj":"LabApi","name":"submitResults","method":"POST","path":"/api/v1/lab/orders/{x}/results","src":"submitResults: (orderId: number, results: ResultEntry[]) =>\n  api.post<LabResultItem[]>(`/api/v1/lab/orders/${orderId}/results`, { results }).then((r) => r.data),","to":"lab:LabOrderController","m":"submitOrderResults","usedBy":[{"file":"pages/Lab/ResultEntry.tsx","fn":"ResultEntry"}]},{"id":"Session.refresh","obj":"Session","name":"refresh","method":"POST","path":"/api/v1/auth/refresh","src":"/**\n * Exchanges the refresh cookie for a new access token. Concurrent callers share one request,\n * so ten 401s arriving together trigger a single refresh. Resolves null when the session is over.\n */\nexport function refreshAccessToken(): Promise<string | null> {\n  inFlight ??= api\n    .post<SessionResponse>(REFRESH_URL, null, { headers: { 'X-JB-Refresh': '1' } })\n    .then((res) => {\n      setAccessToken(res.data.accessToken);\n      sessionListener?.(res.data);\n      return res.data.accessToken;\n    })\n    .catch(() => {\n      setAccessToken(null);\n      sessionListener?.(null);\n      return null;\n    })\n    .finally(() => { inFlight = null; });\n  return inFlight;\n}","file":"lib/api.ts","to":"auth:AuthController","m":"refresh","usedBy":[{"file":"context/AuthContext.tsx","fn":"AuthProvider"},{"file":"hooks/useQueueStream.ts","fn":"useQueueStream"},{"file":"lib/api.ts","fn":"refreshAccessToken"}]},{"id":"QueueStream.connect","obj":"QueueStream","name":"connect","method":"GET","path":"/api/v1/opd/stream","src":"/**\n * Calls `onChange` (debounced) whenever the OPD service reports a visit change relevant to this user.\n * Uses fetch-based SSE because native EventSource can't send an Authorization header, and the access\n * token only lives in memory. Keep usePolling running at a slow interval as a fallback.\n */\nexport function useQueueStream(onChange: () => void, enabled = true) {\n  const callback = useRef(onChange);\n  useEffect(() => { callback.current = onChange; });\n\n  useEffect(() => {\n    if (!enabled) return;\n    const ctrl = new AbortController();\n    let timer: ReturnType<typeof setTimeout> | undefined;\n    const fire = () => {\n      clearTimeout(timer);\n      timer = setTimeout(() => callback.current(), DEBOUNCE_MS);\n    };\n\n    fetchEventSource(STREAM_URL, {\n      signal: ctrl.signal,\n      openWhenHidden: false,   // closes while the tab is hidden, reconnects when it is shown again\n      // Read the token on every (re)connect: it is replaced every 15 minutes.\n      fetch: (input, init) => fetch(input, {\n        ...init,\n        credentials: 'same-origin',\n        headers: { ...(init?.headers as Record<string, string>), Authorization: `Bearer ${getAccessToken() ?? ''}` },\n      }),\n      async onopen(res) {\n        if (res.ok) return;\n        if (res.status === 401) {\n          await refreshAccessToken();   // expired token: refresh, then the library reconnects\n          throw new RetriableError('token refreshed');\n        }\n        throw new RetriableError(`stream refused: HTTP ${res.status}`);\n      },\n      onmessage(msg) {\n        if (msg.event === 'visit') fire();\n      },\n      onerror() {\n        return RETRY_MS;   // keep retrying quietly; polling covers the gap\n      },\n    }).catch(() => { /* aborted on unmount */ });\n\n    return () => {\n      clearTimeout(timer);\n      ctrl.abort();\n    };\n  }, [enabled]);\n}","file":"hooks/useQueueStream.ts","to":"opd:QueueStreamController","m":"stream","usedBy":[{"file":"hooks/useQueueStream.ts","fn":"useQueueStream"},{"file":"pages/Doctor/index.tsx","fn":"DoctorWorkspace"},{"file":"pages/Registration/index.tsx","fn":"Registration"},{"file":"pages/Triage/index.tsx","fn":"TriageQueue"}]}]},"news":[{"t":"Short-lived tokens and silent refresh","d":"Access token is now 15 minutes and kept in memory only. A rotating HttpOnly refresh cookie renews it; replaying an old refresh token revokes the whole login.","flows":["login","refresh"],"classes":["auth:RefreshTokenService","auth:RefreshCookieFactory"],"tables":["auth.refresh_token"]},{"t":"Live queue updates (SSE) and one lab-sync job","d":"Screens receive visit changes as server-sent events. One server job asks the lab for finished orders every 15 s instead of every doctor screen polling.","flows":["queue","vitals"],"classes":["opd:QueueStreamHub","opd:QueueStreamController","opd:LabStatusSyncJob"],"tables":[]},{"t":"SYSTEM service token and resilience","d":"OPD calls lab with its own 5-minute SYSTEM token. Circuit breakers, bulkheads, real HTTP timeouts and a doctor cache protect every downstream call.","flows":["queue","register"],"classes":["opd:ServiceTokenProvider","opd:DoctorIntegrationService","opd:LabIntegrationService"],"tables":[]},{"t":"Transactional outbox for lab orders","d":"Send-to-lab commits the status change and an outbox row together. A relay delivers it with an idempotency key; the lab never creates duplicates.","flows":["sendlab"],"classes":["opd:OutboxService","opd:OutboxRelay","lab:LabOrderService"],"tables":["opd.outbox_message","lab.lab_orders"]},{"t":"Per-visit access policy, break-glass and read audit","d":"Only the assigned doctor (or a doctor with a 30-minute break-glass grant) can read clinical data, and every read is logged. Diagnosis moved to its own /clinical endpoint.","flows":["review","breakglass","signoff"],"classes":["opd:VisitAccessPolicy","opd:ClinicalAccessService"],"tables":["opd.access_grant","opd.clinical_access_log"]},{"t":"AES-256-GCM field encryption","d":"Clinical free text is encrypted before it reaches Postgres, with key rotation and a backfill job.","flows":["encryption","results"],"classes":["opd:FieldCipher","opd:EncryptedStringConverter","opd:EncryptionBackfill","lab:FieldCipher"],"tables":[]},{"t":"Lab-report PDF cache","d":"Completed reports are cached by lab order id; rendering is bulkhead-limited and the response is no-store.","flows":["review"],"classes":["opd:ConsultationWorkflowService","opd:LabReportPdfService"],"tables":[]},{"t":"Race-free token counter, no HTTP inside DB transactions","d":"Daily token is one INSERT ... RETURNING. Registration and send-to-lab no longer hold a DB connection while calling another service.","flows":["register"],"classes":["opd:TokenIssuer","opd:PatientService","opd:VisitService"],"tables":["opd.daily_token_counters"]}]}</script>
<script type="application/json" id="flowdata">[{"id":"login","title":"Sign in","who":"Any staff member","summary":"The auth service checks the password with BCrypt and returns a 15-minute access token in the response body, plus a rotating refresh token in an HttpOnly cookie. The browser keeps the access token in memory only. Every other service verifies the token locally, so there is no call back to auth on each request.","steps":[{"t":"ui","ref":"pages/Login.tsx#Login","note":"Form submit calls login() from the auth context."},{"t":"ui","ref":"context/AuthContext.tsx#AuthProvider","note":"Keeps the access token in a JavaScript variable (never localStorage) and remembers who is signed in."},{"t":"api","ref":"AuthApi.login","note":"POST /api/v1/auth/login. The axios client sends credentials so the browser accepts the refresh cookie."},{"t":"gw","ref":"auth-service-route","note":"Path /api/v1/auth/** goes to the auth service. The route strips X-Internal-Secret so outsiders cannot fake an internal call."},{"t":"m","ref":"auth:AuthController#login","note":"Public endpoint. Passes the User-Agent along for the session record."},{"t":"m","ref":"auth:AuthService#authenticateUser","note":"BCrypt password check, then it issues both tokens."},{"t":"m","ref":"auth:UserAccountRepository#findByUsername","note":"Loads the account (must be enabled)."},{"t":"m","ref":"auth:JwtTokenProvider#generateToken","note":"15-minute HS256 access token: subject, role and display name."},{"t":"m","ref":"auth:RefreshTokenService#startSession","note":"Starts a new token family. A random 256-bit value is made; only its SHA-256 hash is stored."},{"t":"db","ref":"auth.refresh_token","note":"INSERT: token_hash, family_id, expires_at (2 h idle window) and session_ends_at (12 h hard cap)."},{"t":"m","ref":"auth:RefreshCookieFactory#create","note":"Set-Cookie jb_rt: HttpOnly (no JS access), SameSite=Strict, Secure, Path=/api/v1/auth so no other API call carries it."}]},{"id":"refresh","title":"Silent refresh and sign out","who":"Any signed-in user","summary":"Access tokens last 15 minutes. When a call returns 401 (or the page reloads), the UI swaps the refresh cookie for a new pair and replays the call. Each refresh token works once; replaying an old one revokes the whole login. Sign-out ends the family so every tab is signed out.","steps":[{"t":"ui","ref":"lib/api.ts#refreshAccessToken","note":"Single flight: ten 401s arriving together share one refresh request. If it fails, the session is over and the user goes to /login."},{"t":"api","ref":"Session.refresh","note":"POST /api/v1/auth/refresh with header X-JB-Refresh: 1. Cross-site forms cannot set that header (CSRF guard). The cookie travels by itself."},{"t":"gw","ref":"auth-service-route","note":"Same auth route as login."},{"t":"m","ref":"auth:AuthController#refresh","note":"Rejects calls without the marker header. On a bad token it answers 401 and clears the dead cookie."},{"t":"m","ref":"auth:AuthService#refresh","note":"Rotates the token, then signs a fresh access token for the same user."},{"t":"m","ref":"auth:RefreshTokenService#rotate","note":"Row-locks the presented token and revokes it as ROTATED. A token that was already rotated (outside a 10 s grace for two tabs) revokes the whole family: likely theft."},{"t":"db","ref":"auth.refresh_token","note":"Old row revoked, new row inserted in the same family. Idle expiry slides, but never passes session_ends_at."},{"t":"m","ref":"auth:JwtTokenProvider#generateToken","note":"New 15-minute access token."},{"t":"ui","ref":"context/AuthContext.tsx#AuthProvider","note":"A session listener updates who is signed in; the failed request is replayed with the new token."},{"t":"api","ref":"AuthApi.logout","note":"Sign out: POST /api/v1/auth/logout."},{"t":"m","ref":"auth:RefreshTokenService#revoke","note":"Revokes the whole family (reason LOGOUT), so other tabs of the same login are signed out too. The endpoint always answers 204."}]},{"id":"register","title":"Register a new patient","who":"Nurse","summary":"One transaction creates the patient, issues the day's next token, opens the visit and writes the first audit event. The doctor is validated against the auth service before the transaction starts, so no database connection waits on an HTTP call.","steps":[{"t":"ui","ref":"pages/Registration/VisitFields.tsx#VisitFields","note":"Doctor picker: fills its list from the auth service."},{"t":"api","ref":"AuthApi.doctors","note":"GET /api/v1/auth/doctors."},{"t":"m","ref":"auth:AuthService#listActiveDoctors","note":"Enabled DOCTOR accounts, ordered by name."},{"t":"ui","ref":"pages/Registration/NewPatientForm.tsx#NewPatientForm","note":"Patient details, priority and the chosen doctor."},{"t":"api","ref":"OpdApi.registerPatient","note":"POST /api/v1/opd/patients."},{"t":"gw","ref":"opd-service-route","note":"Path /api/v1/opd/** goes to the OPD service."},{"t":"m","ref":"opd:PatientController#register","note":"NURSE or ADMIN."},{"t":"m","ref":"opd:PatientService#registerPatient","note":"Deliberately not @Transactional: the duplicate-phone check and the doctor lookup run first, then the write runs inside a TransactionTemplate."},{"t":"m","ref":"opd:DoctorIntegrationService#requireDoctor","note":"@Cacheable for 5 minutes, plus a circuit breaker and bulkhead. A cache hit makes no HTTP call at all."},{"t":"m","ref":"auth:AuthController#resolve","note":"SYSTEM only. Reached directly with the X-Internal-Secret header, never through the gateway."},{"t":"m","ref":"opd:PatientService#createPatientWithVisit","note":"Inside the transaction: patient row with an MRN from a database sequence."},{"t":"db","ref":"opd.patients","note":"INSERT. Allergies are stored encrypted (AES-256-GCM)."},{"t":"m","ref":"opd:VisitService#openVisit","note":"@Transactional(MANDATORY): it must join the caller's transaction. Refuses a second open visit today."},{"t":"m","ref":"opd:TokenIssuer#next","note":"One INSERT ... ON CONFLICT ... RETURNING: row-locked, so two desks can never get the same token."},{"t":"db","ref":"opd.daily_token_counters","note":"Counter row for today."},{"t":"db","ref":"opd.visits","note":"INSERT: status REGISTERED. The chief complaint is stored encrypted."},{"t":"m","ref":"opd:VisitService#recordEvent","note":"Writes the audit row and publishes a VisitChanged event."},{"t":"db","ref":"opd.visit_events","note":"Audit row: who, from, to, when."},{"t":"m","ref":"opd:QueueStreamHub#onVisitChanged","note":"After the transaction commits, pushes a \"visit\" event to every open screen (server-sent events)."}]},{"id":"vitals","title":"Record vitals","who":"Nurse","summary":"The triage list refreshes when the live stream says a visit changed. Saving vitals is allowed only for a nurse on an open visit (checked by the visit access policy). The first set moves the visit from REGISTERED to TRIAGED and the patient appears in the doctor's queue.","steps":[{"t":"ui","ref":"pages/Triage/index.tsx#TriageQueue","note":"Worklist. A 60 s poll is only a fallback; the live stream triggers the reloads."},{"t":"api","ref":"OpdApi.triageQueue","note":"GET /api/v1/opd/visits/triage-queue."},{"t":"m","ref":"opd:VisitController#getTriageQueue","note":"NURSE or ADMIN."},{"t":"m","ref":"opd:VisitRepository#findTriageQueue","note":"Waiting visits, emergencies first."},{"t":"ui","ref":"pages/Triage/VitalsPage.tsx#VitalsPage","note":"Fields flag fever, tachycardia and low oxygen as you type."},{"t":"api","ref":"OpdApi.saveVitals","note":"POST /api/v1/opd/triage/vitals."},{"t":"gw","ref":"opd-service-route","note":"Routed to OPD."},{"t":"m","ref":"opd:TriageController#captureVitals","note":"@PreAuthorize calls the visit access policy with the visit id from the request body."},{"t":"m","ref":"opd:VisitAccessPolicy#canRecordVitals","note":"True only for a NURSE and a visit that is REGISTERED, TRIAGED or IN_CONSULTATION."},{"t":"m","ref":"opd:TriageService#recordVitals","note":"Saves the reading, then moves the visit on if it was still REGISTERED."},{"t":"db","ref":"opd.vital_signs","note":"INSERT. The symptoms text is stored encrypted."},{"t":"m","ref":"opd:VisitService#transitionStatus","note":"REGISTERED to TRIAGED, only if the visit is still in an allowed state (else 409)."},{"t":"db","ref":"opd.visit_events","note":"Audit row without any clinical data: just \"Vitals recorded\"."},{"t":"m","ref":"opd:QueueStreamHub#onVisitChanged","note":"The assigned doctor's screen updates by itself."}]},{"id":"queue","title":"Doctor's queue (live)","who":"Doctor","summary":"The doctor's screen opens a live stream and loads its list once; later changes arrive as events. Separately, one server-side job asks the lab every 15 seconds which orders are finished, so lab load stays flat however many doctors are signed in.","steps":[{"t":"ui","ref":"pages/Doctor/index.tsx#DoctorWorkspace","note":"Loads the queue, opens the stream and keeps a slow 60 s poll as a fallback."},{"t":"api","ref":"QueueStream.connect","note":"GET /api/v1/opd/stream with fetch-based SSE: EventSource cannot send an Authorization header. On a 401 it refreshes the token and reconnects."},{"t":"gw","ref":"opd-service-route","note":"Long-lived stream: the 20 s response timeout covers only time to first byte."},{"t":"m","ref":"opd:QueueStreamController#stream","note":"NURSE, DOCTOR or ADMIN."},{"t":"m","ref":"opd:QueueStreamHub#subscribe","note":"Registers the emitter (max 500). Sends \"ready\" at once, then a heartbeat every 25 s. Doctors only receive events for their own visits."},{"t":"api","ref":"OpdApi.myQueue","note":"GET /api/v1/opd/visits/doctor/queue."},{"t":"m","ref":"opd:VisitController#getMyQueue","note":"DOCTOR. The doctor is taken from the token, not from a parameter."},{"t":"m","ref":"opd:VisitService#getDoctorQueue","note":"Read-only transaction."},{"t":"m","ref":"opd:VisitRepository#findDoctorQueue","note":"One native query: visit, patient and latest vitals."},{"t":"db","ref":"opd.visits","note":"Source rows."},{"t":"m","ref":"opd:VisitService#toItem","note":"Native query rows skip JPA converters, so the service decrypts the text columns itself."},{"t":"m","ref":"opd:FieldCipher#decrypt","note":"AES-256-GCM. The key id is part of the authenticated data."},{"t":"m","ref":"opd:LabStatusSyncJob#sync","note":"Runs every 15 s on the server (APP_LAB_SYNC_DELAY_MS). A failure never kills the scheduler thread."},{"t":"m","ref":"opd:ConsultationWorkflowService#refreshLabStatuses","note":"Propagation.NOT_SUPPORTED: no database transaction is open while it waits for the lab."},{"t":"m","ref":"opd:ServiceTokenProvider#bearer","note":"A 5-minute SYSTEM token, signed locally with the shared secret and renewed a minute before expiry."},{"t":"m","ref":"opd:LabIntegrationService#getOrders","note":"One call for every waiting order. Bulkhead and circuit breaker around it."},{"t":"m","ref":"lab:LabOrderController#getOrders","note":"LABTECH or SYSTEM only. Doctors never read lab data directly."},{"t":"m","ref":"opd:VisitRepository#transition","note":"UPDATE ... WHERE status = AWAITING_LAB: a guarded move to LAB_RESULTS_READY."},{"t":"m","ref":"opd:VisitService#recordEvent","note":"Audit row for \"Results released\" and a live event for the screens."}]},{"id":"sendlab","title":"Send tests to the lab (outbox)","who":"Doctor","summary":"The doctor's click only writes to OPD's own database: the visit moves to AWAITING_LAB and the order is parked in an outbox table, in one transaction. A relay then delivers it to the lab with an idempotency key. A slow or down lab can no longer fail the click, create an orphan order or create a duplicate.","steps":[{"t":"ui","ref":"pages/Doctor/Consultation.tsx#OrderTests","note":"Test list and prices come from the lab catalogue."},{"t":"api","ref":"LabApi.catalogue","note":"GET /api/v1/lab/tests."},{"t":"api","ref":"OpdApi.sendToLab","note":"POST /api/v1/opd/visits/{id}/send-to-lab. Returns 204 as soon as the order is queued."},{"t":"gw","ref":"opd-service-route","note":"Routed to OPD."},{"t":"m","ref":"opd:VisitController#sendToLab","note":"@PreAuthorize uses the visit access policy: assigned doctor only."},{"t":"m","ref":"opd:VisitAccessPolicy#canWriteClinical","note":"Assigned doctor and the visit is not COMPLETED or CANCELLED."},{"t":"m","ref":"opd:VisitService#sendToLab","note":"One local transaction and no HTTP call. The @Version column on Visit makes a double-click fail with 409."},{"t":"m","ref":"opd:OutboxService#enqueueLabOrder","note":"Propagation.MANDATORY: only valid inside the transaction that changed the visit. Carries a random requestId."},{"t":"db","ref":"opd.outbox_message","note":"INSERT status PENDING. request_id is UNIQUE."},{"t":"m","ref":"opd:VisitService#recordEvent","note":"Audit row \"Lab order queued: CBC, URINE\". latest_lab_order_id stays empty until the lab accepts."},{"t":"m","ref":"opd:OutboxRelay#drain","note":"Background, every second. Claims due rows with FOR UPDATE SKIP LOCKED and leases them for 30 s, so several OPD instances never take the same row."},{"t":"m","ref":"opd:OutboxRelay#deliver","note":"At-least-once delivery. Retries use back-off up to 10 minutes; an open breaker leaves the row PENDING without using up an attempt."},{"t":"m","ref":"opd:LabIntegrationService#raiseLabInvestigationOrder","note":"Called with the SYSTEM token. The payload includes the requestId."},{"t":"m","ref":"lab:LabOrderController#placeOrder","note":"DOCTOR or SYSTEM. Answers 201 for a new order and 200 for a repeat of the same requestId."},{"t":"m","ref":"lab:LabOrderService#createOrder","note":"Looks the requestId up first, so a repeated delivery returns the same order. Normalises test codes; status PLACED."},{"t":"db","ref":"lab.lab_orders","note":"INSERT order (+ lab_order_tests rows). The clinical history is stored encrypted. A unique index on request_id backs the idempotency."},{"t":"m","ref":"opd:VisitRepository#attachLabOrder","note":"Only now is latest_lab_order_id set, and only if the visit is still AWAITING_LAB."},{"t":"m","ref":"opd:OutboxRelay#giveUp","note":"Failure path: after a permanent error (400/422) or 12 attempts, the message is FAILED and the visit goes back to IN_CONSULTATION with the reason in its history."}]},{"id":"collect","title":"Collect samples, one test at a time","who":"Lab technician","summary":"Each ordered test needs its own sample. The order stays PLACED until the last one is collected, then becomes SAMPLE_COLLECTED, which unlocks result entry.","steps":[{"t":"ui","ref":"pages/Lab/index.tsx#LabWorkspace","note":"Lab worklist, refreshed every 15 s."},{"t":"api","ref":"LabApi.queue","note":"GET /api/v1/lab/orders/queue."},{"t":"gw","ref":"lab-service-route","note":"Path /api/v1/lab/** goes to the lab service."},{"t":"m","ref":"lab:LabOrderController#getOrderQueue","note":"LABTECH or ADMIN."},{"t":"api","ref":"LabApi.collectSample","note":"POST /api/v1/lab/orders/{id}/tests/{code}/collect."},{"t":"m","ref":"lab:LabOrderController#collectSample","note":"LABTECH only."},{"t":"m","ref":"lab:LabOrderService#collectSample","note":"Refuses a sample twice for the same test. When every test has one, the order becomes SAMPLE_COLLECTED."},{"t":"m","ref":"lab:LabSampleCollectionRepository#saveAndFlush","note":"Flush now, so a duplicate click fails as a clean 409."},{"t":"db","ref":"lab.lab_sample_collections","note":"INSERT: order, test code, who collected, when."}]},{"id":"results","title":"Enter and release results","who":"Lab technician","summary":"All results for an order are saved and the order is completed in one transaction. Values outside the reference range are flagged on the server, not just in the browser. Result values and notes are stored encrypted.","steps":[{"t":"ui","ref":"pages/Lab/ResultEntry.tsx#ResultEntry","note":"High/Low flags show live as values are typed."},{"t":"api","ref":"LabApi.parameters","note":"GET /api/v1/lab/tests/parameters?codes=..."},{"t":"m","ref":"lab:LabTestController#getParameters","note":"Reference ranges for the ordered tests."},{"t":"api","ref":"LabApi.submitResults","note":"POST /api/v1/lab/orders/{id}/results."},{"t":"m","ref":"lab:LabOrderController#submitOrderResults","note":"LABTECH only."},{"t":"m","ref":"lab:LabResultEntryService#submitOrderResults","note":"Answers 409 until every sample is collected, flags out-of-range values, then completes the order."},{"t":"m","ref":"lab:LabResultService#submitResult","note":"Saves one result row."},{"t":"m","ref":"lab:EncryptedStringConverter#convertToDatabaseColumn","note":"Hibernate calls this on write for observed_value and technician_notes."},{"t":"db","ref":"lab.lab_results","note":"INSERT. The value column is TEXT because the ciphertext is longer than the plain value."}]},{"id":"review","title":"Open the patient and read lab results","who":"Doctor","summary":"Opening a patient and reading clinical data go through the per-visit access policy, and every clinical read is written to an audit log. The doctor's screen never talks to the lab: OPD fetches results with its own service token after it has decided the doctor may see them.","steps":[{"t":"ui","ref":"pages/Doctor/index.tsx#DoctorWorkspace","note":"Clicking a patient calls start-consultation first."},{"t":"api","ref":"OpdApi.startConsultation","note":"POST /api/v1/opd/visits/{id}/start-consultation."},{"t":"m","ref":"opd:VisitController#startConsultation","note":"@visitAccess.canWriteClinical: assigned doctor, visit still open."},{"t":"m","ref":"opd:ConsultationWorkflowService#startConsultation","note":"TRIAGED or LAB_RESULTS_READY to IN_CONSULTATION. Safe to repeat."},{"t":"db","ref":"opd.visit_events","note":"Audit row \"Consultation started\" or \"Doctor reviewing lab results\"."},{"t":"ui","ref":"pages/Doctor/Consultation.tsx#Consultation","note":"Loads the visit, the timeline, the catalogue and the lab results."},{"t":"api","ref":"OpdApi.labResults","note":"GET /api/v1/opd/visits/{id}/lab-results."},{"t":"m","ref":"opd:VisitController#getLabResults","note":"@visitAccess.canReadClinical, then logs the read."},{"t":"m","ref":"opd:VisitAccessPolicy#canReadClinical","note":"The assigned doctor, or a doctor with a live break-glass grant."},{"t":"m","ref":"opd:ClinicalAccessService#recordRead","note":"REQUIRES_NEW: the audit row is committed even if the read that follows fails."},{"t":"db","ref":"opd.clinical_access_log","note":"Append-only: visit, username, action, time."},{"t":"m","ref":"opd:ConsultationWorkflowService#getLabResults","note":"Returns 204 when no lab order was placed."},{"t":"m","ref":"opd:ConsultationWorkflowService#loadLabResults","note":"Uses the SYSTEM token: OPD already authorised the caller."},{"t":"m","ref":"opd:LabIntegrationService#getResults","note":"Fetches the result rows through the circuit breaker."},{"t":"m","ref":"lab:LabResultController#viewOrderResults","note":"LABTECH or SYSTEM. Decrypts the values on read."},{"t":"api","ref":"OpdApi.openLabReport","note":"GET /api/v1/opd/visits/{id}/lab-report for the PDF."},{"t":"m","ref":"opd:ConsultationWorkflowService#getLabReport","note":"Cached by lab order id (Caffeine, 64 MB, 2 h): a repeat view skips both lab calls and the render. Only completed reports are cached."},{"t":"m","ref":"opd:LabReportPdfService#render","note":"Bulkhead-limited to 4 renders at once. The response is Cache-Control: no-store so shared PCs keep nothing."}]},{"id":"signoff","title":"Sign off the visit","who":"Doctor","summary":"Signing off records the diagnosis and closes the visit. The server decides the status, the diagnosis is stored encrypted, and the audit trail records only that it was signed off, never the diagnosis text.","steps":[{"t":"ui","ref":"pages/Doctor/Consultation.tsx#SignOff","note":"Diagnosis and consultation notes."},{"t":"api","ref":"OpdApi.conclude","note":"POST /api/v1/opd/visits/{id}/conclude."},{"t":"m","ref":"opd:VisitController#conclude","note":"@visitAccess.canWriteClinical."},{"t":"m","ref":"opd:ConsultationWorkflowService#conclude","note":"Allowed from TRIAGED, IN_CONSULTATION or LAB_RESULTS_READY. While lab results are pending it answers 409."},{"t":"m","ref":"opd:EncryptedStringConverter#convertToDatabaseColumn","note":"Hibernate encrypts diagnosis and consultation notes as it flushes the update."},{"t":"db","ref":"opd.visits","note":"UPDATE: status COMPLETED, completed_at set, diagnosis and notes encrypted."},{"t":"m","ref":"opd:VisitService#recordEvent","note":"Audit row \"Signed off\". No clinical text is copied into it."},{"t":"db","ref":"opd.visit_events","note":"COMPLETED row with the doctor's username and time."},{"t":"api","ref":"OpdApi.clinical","note":"Later, the diagnosis is read back through its own endpoint."},{"t":"m","ref":"opd:VisitController#getClinical","note":"@visitAccess.canReadClinical. The normal visit responses no longer include the diagnosis."},{"t":"m","ref":"opd:ClinicalAccessService#clinicalView","note":"Decrypts and returns diagnosis and notes. The read was logged first."}]},{"id":"breakglass","title":"Emergency access (break-glass)","who":"Doctor (not assigned)","summary":"A doctor who is not assigned to a visit can open it in an emergency by giving a reason. The grant lasts 30 minutes, is logged, and appears in the visit's history so the assigned doctor can see who opened their patient and why. The endpoint exists; no screen calls it yet.","steps":[{"t":"gw","ref":"opd-service-route","note":"POST /api/v1/opd/visits/{id}/break-glass with {\"reason\": \"...\"} (API only for now)."},{"t":"m","ref":"opd:VisitController#breakGlass","note":"DOCTOR role; a reason is required."},{"t":"m","ref":"opd:ClinicalAccessService#breakGlass","note":"Refuses the assigned doctor (nothing to break). Creates the grant, logs the action and writes the visit event."},{"t":"db","ref":"opd.access_grant","note":"INSERT: visit, username, reason, granted_at, expires_at (30 minutes)."},{"t":"db","ref":"opd.clinical_access_log","note":"Action BREAK_GLASS."},{"t":"m","ref":"opd:VisitService#recordEvent","note":"History row \"Break-glass access: <reason>\", visible to the assigned doctor."},{"t":"m","ref":"opd:VisitAccessPolicy#canReadClinical","note":"From now on this doctor passes the clinical-read check for 30 minutes."},{"t":"m","ref":"opd:AccessGrantRepository#existsByVisitIdAndUsernameAndExpiresAtAfter","note":"The check is a single indexed lookup on the live grant."}]},{"id":"encryption","title":"Clinical text encrypted at rest","who":"Every write and read","summary":"Free-text clinical fields are encrypted with AES-256-GCM before they reach the database. JPA entities do it through an attribute converter; native query rows are decrypted by hand in the service. Keys come from configuration, can be rotated, and a backfill job migrates old rows.","steps":[{"t":"m","ref":"opd:ConsultationWorkflowService#conclude","note":"Any service that sets an encrypted entity field, here the diagnosis."},{"t":"m","ref":"opd:EncryptedStringConverter#convertToDatabaseColumn","note":"Hibernate calls it when the entity is written. Spring Boot injects the FieldCipher into it."},{"t":"m","ref":"opd:FieldCipher#encrypt","note":"Random 12-byte IV, active key id as authenticated data. Stored as enc:<keyId>:<base64>."},{"t":"db","ref":"opd.visits","note":"chief_complaint, consultation_notes and diagnosis hold ciphertext. Patient allergies and vitals symptoms are encrypted the same way; lab results and clinical history likewise in the lab database."},{"t":"m","ref":"opd:VisitService#toItem","note":"Native queries bypass converters, so this method decrypts the columns it reads."},{"t":"m","ref":"opd:FieldCipher#decrypt","note":"Verifies the tag. A tampered value or unknown key throws, and the message never contains the value."},{"t":"m","ref":"opd:EncryptionBackfill#run","note":"Optional startup job (OPD_CRYPTO_BACKFILL=true): encrypts old plaintext rows and re-wraps rows under an old key after rotation."}]}]</script>
<script>
(function () {
  var M = JSON.parse(document.getElementById('model').textContent);
  var FLOWS = JSON.parse(document.getElementById('flowdata').textContent);
  var C = M.classes;
  var view = document.getElementById('view');

  /* ---------------------------------------------------------------- helpers */
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function slug(s) { return String(s).replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
  var SVC = { auth: 'Auth service', opd: 'OPD service', lab: 'Lab service', gw: 'API gateway' };
  var LAYER_ORDER = ['controller', 'service', 'job', 'repository', 'model', 'dto', 'security', 'config', 'exception', 'app'];
  var LAYER_LABEL = { controller: 'Controllers', service: 'Services', job: 'Jobs, relays & streams', repository: 'Repositories', model: 'Entities & enums', dto: 'DTOs', security: 'Security', config: 'Configuration', exception: 'Errors', app: 'Application' };

  // hash <-> object maps
  var H = {};
  function methodKey(cid, i) {
    var c = C[cid], m = c.methods[i];
    var same = c.methods.filter(function (x) { return x.name === m.name; });
    var n = same.indexOf(m);
    return 'm-' + c.svc + '-' + c.name + '-' + (m.ctor ? 'new' : m.name) + (n > 0 ? '-' + (n + 1) : '');
  }
  Object.keys(C).forEach(function (cid) {
    var c = C[cid];
    H['c-' + c.svc + '-' + c.name] = { t: 'c', cid: cid };
    c.methods.forEach(function (m, i) { var k = methodKey(cid, i); m._h = k; H[k] = { t: 'm', cid: cid, i: i }; });
  });
  function mref(cid, name) { // first method of that name
    var c = C[cid]; if (!c) return null;
    for (var i = 0; i < c.methods.length; i++) if (c.methods[i].name === name) return c.methods[i];
    return null;
  }
  function mlink(cid, name, label) {
    var m = mref(cid, name), c = C[cid];
    if (!m) return '<span class="mono">' + esc(label || (c ? c.name : cid) + '.' + name) + '</span>';
    return '<a class="link" href="#' + m._h + '">' + esc(label || c.name + '.' + name + '()') + '</a>';
  }
  function clink(cid, label) { var c = C[cid]; return c ? '<a class="link" href="#c-' + c.svc + '-' + c.name + '">' + esc(label || c.name) + '</a>' : esc(cid); }

  var UIF = {}; // "file#fn" -> {file, fn}
  M.ui.files.forEach(function (f) { f.fns.forEach(function (fn) { var k = 'u-' + slug(f.file) + '-' + fn.name; fn._h = k; UIF[f.file + '#' + fn.name] = { f: f, fn: fn }; H[k] = { t: 'u', f: f, fn: fn }; }); H['uf-' + slug(f.file)] = { t: 'uf', f: f }; });
  var API = {}; M.ui.api.forEach(function (a) { API[a.id] = a; a._h = 'a-' + slug(a.id); H[a._h] = { t: 'a', a: a }; });
  Object.keys(M.dbs).forEach(function (d) { Object.keys(M.dbs[d].tables).forEach(function (t) { H['t-' + d + '-' + slug(t)] = { t: 't', d: d, tb: t }; }); });
  FLOWS.forEach(function (f) { H['flow-' + f.id] = { t: 'flow', f: f }; });
  function uilink(file, fn) { var x = UIF[file + '#' + fn]; return x ? '<a class="link" href="#' + x.fn._h + '">' + esc(fn) + '</a>' : esc(fn); }
  function apilink(id) { var a = API[id]; return a ? '<a class="link" href="#' + a._h + '">' + esc(id) + '()</a>' : esc(id); }
  function tlink(d, t) { return '<a class="link" href="#t-' + d + '-' + slug(t) + '">' + esc(d + '.' + t) + '</a>'; }

  function lane(k, txt) { return '<span class="lane ' + k + '">' + esc(txt) + '</span>'; }

  /* ---------------------------------------------------------------- syntax highlight */
