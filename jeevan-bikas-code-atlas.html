<title>Jeevan Bikas Code Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header with view tabs + search; each view is a full-width workspace.
   Same teal-on-neutral language as the Jeevan Bikas app; one hue per runtime "lane"
   (UI, API client, gateway, auth, OPD, lab, database) so a step's home is readable at a glance. */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --subtle: #f7f9fa; --line: #e3e8ee; --line-strong: #cfd7e0;
  --ink: #0f1c2a; --ink-2: #3c4a5a; --ink-3: #6b7888; --ink-4: #98a3af;
  --brand: #0d7d79; --brand-soft: #e6f4f2; --brand-ink: #0b6461;
  --l-ui: #175cd3; --l-ui-soft: #eef4ff;
  --l-api: #3f6fb0; --l-api-soft: #f0f5fb;
  --l-gw: #4a5868; --l-gw-soft: #f1f3f6;
  --l-auth: #b54708; --l-auth-soft: #fff4ea;
  --l-opd: #0d7d79; --l-opd-soft: #e6f4f2;
  --l-lab: #6941c6; --l-lab-soft: #f4f0fe;
  --l-db: #5b6675; --l-db-soft: #eff1f4;
  --ok: #067647; --warn: #9a5b05; --warn-soft: #fef6e7;
  --c-kw: #8b2f9c; --c-str: #0b7a4b; --c-com: #8a96a3; --c-ann: #b54708; --c-num: #175cd3; --c-type: #0b6461;
  --shadow: 0 1px 2px rgb(15 28 42 / .04), 0 1px 3px rgb(15 28 42 / .07);
  --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1417; --surface: #121d21; --subtle: #152227; --line: #223238; --line-strong: #2f444b;
    --ink: #e6eef0; --ink-2: #b9c7cb; --ink-3: #8597a0; --ink-4: #627580;
    --brand: #3dbab3; --brand-soft: #123331; --brand-ink: #6fd3cc;
    --l-ui: #84adff; --l-ui-soft: #15223a; --l-api: #8fb3e3; --l-api-soft: #152030;
    --l-gw: #a9b6c4; --l-gw-soft: #1a2228; --l-auth: #f7a66b; --l-auth-soft: #2b1c10;
    --l-opd: #3dbab3; --l-opd-soft: #123331; --l-lab: #b9a3f5; --l-lab-soft: #221a36;
    --l-db: #a3adb9; --l-db-soft: #1a2226;
    --ok: #47cd89; --warn: #f5b546; --warn-soft: #2b2110;
    --c-kw: #d7a1e8; --c-str: #7ed4a4; --c-com: #6b7d86; --c-ann: #f7a66b; --c-num: #84adff; --c-type: #6fd3cc;
    --shadow: 0 1px 2px rgb(0 0 0 / .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1417; --surface: #121d21; --subtle: #152227; --line: #223238; --line-strong: #2f444b;
  --ink: #e6eef0; --ink-2: #b9c7cb; --ink-3: #8597a0; --ink-4: #627580;
  --brand: #3dbab3; --brand-soft: #123331; --brand-ink: #6fd3cc;
  --l-ui: #84adff; --l-ui-soft: #15223a; --l-api: #8fb3e3; --l-api-soft: #152030;
  --l-gw: #a9b6c4; --l-gw-soft: #1a2228; --l-auth: #f7a66b; --l-auth-soft: #2b1c10;
  --l-opd: #3dbab3; --l-opd-soft: #123331; --l-lab: #b9a3f5; --l-lab-soft: #221a36;
  --l-db: #a3adb9; --l-db-soft: #1a2226;
  --ok: #47cd89; --warn: #f5b546; --warn-soft: #2b2110;
  --c-kw: #d7a1e8; --c-str: #7ed4a4; --c-com: #6b7d86; --c-ann: #f7a66b; --c-num: #84adff; --c-type: #6fd3cc;
  --shadow: 0 1px 2px rgb(0 0 0 / .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 14.5px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: var(--brand-ink); }
button { font: inherit; }
code, .mono { font-family: var(--font-mono); font-size: 0.92em; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1320px; margin: 0 auto; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .inner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .mark { width: 28px; height: 28px; border-radius: 7px; background: var(--brand); display: grid; place-items: center; flex: none; }
.brand b { font-weight: 600; font-size: 15px; white-space: nowrap; }
.brand span { color: var(--ink-3); font-size: 12.5px; white-space: nowrap; }
.tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1 1 auto; min-width: 0; scrollbar-width: none; }
.tabs a { text-decoration: none; color: var(--ink-3); font-weight: 500; font-size: 13.5px; padding: 7px 12px; border-radius: 8px; white-space: nowrap; }
.tabs a:hover { color: var(--ink); background: var(--subtle); }
.tabs a[aria-current="page"] { color: var(--brand-ink); background: var(--brand-soft); }
.search { position: relative; flex: 0 1 300px; min-width: 200px; }
.search input { width: 100%; height: 36px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--subtle); color: var(--ink); padding: 0 12px 0 32px; font: inherit; font-size: 13.5px; }
.search input:focus { outline: none; border-color: var(--brand); background: var(--surface); }
.search svg { position: absolute; left: 10px; top: 11px; color: var(--ink-4); }
.results { position: absolute; top: 42px; right: 0; width: min(440px, calc(100vw - 32px)); max-height: 60vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: 0 10px 30px rgb(15 28 42 / .15); padding: 6px; }
.results a { display: flex; gap: 10px; align-items: baseline; padding: 7px 10px; border-radius: 6px; text-decoration: none; color: var(--ink); }
.results a:hover, .results a.on { background: var(--subtle); }
.results .k { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); min-width: 58px; }
.results .s { color: var(--ink-3); font-size: 12px; margin-left: auto; white-space: nowrap; }

main { padding-block: 24px 64px; }
.view-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; margin-bottom: 18px; }
.view-head h1 { font-size: 24px; font-weight: 600; }
.view-head p { color: var(--ink-2); max-width: 74ch; margin-top: 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.lbl { font-size: 11.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }

/* Lane chips */
.lane { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 5px; white-space: nowrap; }
.lane::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.lane.ui { color: var(--l-ui); background: var(--l-ui-soft); }
.lane.api { color: var(--l-api); background: var(--l-api-soft); }
.lane.gw { color: var(--l-gw); background: var(--l-gw-soft); }
.lane.auth { color: var(--l-auth); background: var(--l-auth-soft); }
.lane.opd { color: var(--l-opd); background: var(--l-opd-soft); }
.lane.lab { color: var(--l-lab); background: var(--l-lab-soft); }
.lane.db { color: var(--l-db); background: var(--l-db-soft); }
.tag { display: inline-block; font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--ink-2); background: var(--subtle); white-space: nowrap; }
.tag.http { border-color: transparent; background: var(--brand-soft); color: var(--brand-ink); font-weight: 500; }
.tag.role { color: var(--l-auth); background: var(--l-auth-soft); border-color: transparent; }
.tag.tx { color: var(--l-lab); background: var(--l-lab-soft); border-color: transparent; }
.tag.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.link { color: var(--brand-ink); text-decoration: none; font-family: var(--font-mono); font-size: 12.5px; }
.link:hover { text-decoration: underline; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* Overview */
.ov { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.diagram { padding: 10px; overflow-x: auto; }
.diagram svg { display: block; width: 100%; min-width: 560px; height: auto; }
.nd { cursor: pointer; }
.nd rect.b { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.3; transition: stroke .15s; }
.nd:hover rect.b, .nd:focus-visible rect.b { stroke: var(--brand); stroke-width: 2; }
.nd text { font-family: var(--font-sans); font-size: 13px; font-weight: 600; fill: var(--ink); }
.nd .sub { font-family: var(--font-mono); font-size: 10.5px; font-weight: 400; fill: var(--ink-3); }
.nd rect.stripe { stroke: none; }
.edge { stroke: var(--line-strong); stroke-width: 1.4; fill: none; }
.edge.x { stroke-dasharray: 5 4; }
.elab { font-family: var(--font-mono); font-size: 10.5px; fill: var(--ink-3); }
.svc-grid { display: grid; gap: 10px; }
.svc-card { padding: 14px 16px; display: grid; gap: 8px; text-decoration: none; color: inherit; }
.svc-card:hover { border-color: var(--line-strong); }
.svc-card .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.svc-card .nums { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--ink-3); }
.svc-card .nums b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }
.layers { margin-top: 16px; padding: 16px; }
.layer-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.layer-row div { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--subtle); min-width: 0; }
.layer-row b { display: block; font-size: 13px; }
.layer-row span { font-size: 12px; color: var(--ink-3); }
.cross { margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cross div { border: 1px dashed var(--line-strong); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; color: var(--ink-2); }
.flow-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; margin-top: 16px; }
.flow-card { padding: 14px 16px; text-decoration: none; color: inherit; display: grid; gap: 6px; }
.flow-card:hover { border-color: var(--brand); }
.flow-card h3 { font-size: 14.5px; }
.flow-card p { font-size: 13px; color: var(--ink-3); }

/* Flows */
.flows { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; }
.flow-list { padding: 6px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); }
.flow-list a { display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--ink-2); font-size: 13.5px; }
.flow-list a small { display: block; color: var(--ink-3); font-size: 12px; }
.flow-list a:hover { background: var(--subtle); }
.flow-list a[aria-current="true"] { background: var(--brand-soft); color: var(--brand-ink); font-weight: 500; }
.flow-head { padding: 16px 18px; border-bottom: 1px solid var(--line); }
.flow-head h2 { font-size: 19px; }
.flow-head p { color: var(--ink-2); margin-top: 6px; max-width: 80ch; }
.ladder-wrap { overflow-x: auto; }
.ladder { min-width: 760px; padding: 6px 0 14px; }
.lanes-h, .rung { display: grid; grid-template-columns: 34px repeat(7, minmax(0, 1fr)); }
.lanes-h { position: sticky; top: 0; background: var(--surface); padding: 8px 0; border-bottom: 1px solid var(--line); z-index: 1; }
.lanes-h div { text-align: center; }
.rung { position: relative; min-height: 46px; }
.rung .num { font-family: var(--font-mono); font-size: 11px; color: var(--ink-4); display: grid; place-items: center; }
.rung .col { position: relative; }
.rung .col::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line); }
.step-btn { position: relative; z-index: 1; display: block; width: calc(100% - 8px); margin: 6px 4px; text-align: left; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); padding: 7px 9px; cursor: pointer; color: var(--ink); min-width: 0; }
.step-btn:hover { border-color: var(--brand); }
.step-btn.on { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.step-btn b { display: block; font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step-btn span { display: block; font-size: 11.5px; color: var(--ink-3); line-height: 1.35; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.step-btn.ui { border-left: 3px solid var(--l-ui); } .step-btn.api { border-left: 3px solid var(--l-api); }
.step-btn.gw { border-left: 3px solid var(--l-gw); } .step-btn.auth { border-left: 3px solid var(--l-auth); }
.step-btn.opd { border-left: 3px solid var(--l-opd); } .step-btn.lab { border-left: 3px solid var(--l-lab); }
.step-btn.db { border-left: 3px solid var(--l-db); }
.hop { position: absolute; top: -1px; height: 2px; background: var(--line-strong); z-index: 0; }
.step-detail { border-top: 1px solid var(--line); }

/* Endpoint table */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 11.5px; font-weight: 500; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--subtle); white-space: nowrap; }
td { padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink-2); }
tr:last-child td { border-bottom: 0; }
td.path { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink); white-space: nowrap; }
.verb { font-family: var(--font-mono); font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: var(--subtle); border: 1px solid var(--line); color: var(--ink-2); }

/* Code browser */
.code-grid { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 16px; align-items: start; }
.tree { padding: 8px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); max-height: calc(100vh - 100px); overflow-y: auto; }
.tree details { margin: 2px 0; }
.tree summary { cursor: pointer; padding: 6px 8px; border-radius: 6px; font-weight: 600; font-size: 13.5px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
.tree summary::-webkit-details-marker { display: none; }
.tree summary:hover { background: var(--subtle); }
.tree .layer { font-size: 11px; color: var(--ink-4); text-transform: uppercase; letter-spacing: .06em; padding: 8px 10px 2px; }
.tree a { display: flex; justify-content: space-between; gap: 6px; padding: 4px 10px; border-radius: 6px; text-decoration: none; color: var(--ink-2); font-family: var(--font-mono); font-size: 12.5px; }
.tree a:hover { background: var(--subtle); color: var(--ink); }
.tree a[aria-current="true"] { background: var(--brand-soft); color: var(--brand-ink); }
.tree a em { font-style: normal; color: var(--ink-4); font-size: 11px; }
.insp { min-width: 0; display: grid; gap: 14px; }
.insp-head { padding: 16px 18px; display: grid; gap: 8px; }
.insp-head h2 { font-family: var(--font-mono); font-size: 19px; font-weight: 500; overflow-wrap: anywhere; }
.insp-head { min-width: 0; }
.insp-head .crumbs .mono { overflow-wrap: anywhere; min-width: 0; }
.insp-head .crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--ink-3); }
.insp-head .doc { color: var(--ink-2); max-width: 85ch; }
.sig { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.panel { padding: 14px 18px; }
.panel h3 { font-size: 13px; margin-bottom: 8px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.mlist { display: grid; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
.mrow:first-child { border-top: 0; }
.mrow:hover { background: var(--subtle); }
.mrow b { font-family: var(--font-mono); font-weight: 500; font-size: 13px; color: var(--ink); }
.mrow .p { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); overflow-wrap: anywhere; }
.mrow .doc { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.mrow .badges { display: flex; flex-wrap: wrap; gap: 4px; justify-content: end; }
.linklist { display: grid; gap: 4px; }
.linklist .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.linklist .row > * { min-width: 0; overflow-wrap: anywhere; }
.empty { color: var(--ink-4); font-size: 13px; }

pre.code { margin: 0; padding: 14px 16px; overflow-x: auto; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; color: var(--ink); background: var(--subtle); border-top: 1px solid var(--line); border-radius: 0 0 12px 12px; tab-size: 4; }
pre.code .ln { display: inline-block; width: 3ch; margin-right: 14px; color: var(--ink-4); text-align: right; user-select: none; }
.t-kw { color: var(--c-kw); } .t-str { color: var(--c-str); } .t-com { color: var(--c-com); font-style: italic; }
.t-ann { color: var(--c-ann); } .t-num { color: var(--c-num); } .t-type { color: var(--c-type); }
.code-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 16px; }
.code-bar .lbl { min-width: 0; overflow-wrap: anywhere; }
.step-detail .chips b { min-width: 0; overflow-wrap: anywhere; }
.copy { flex: none; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer; }

/* DB */
.db-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.tbl { overflow: hidden; }
.tbl-h { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.tbl-h b { font-family: var(--font-mono); font-size: 13.5px; }
.cols { font-family: var(--font-mono); font-size: 12px; }
.cols div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 3px 14px; border-bottom: 1px dashed var(--line); }
.cols div:last-child { border-bottom: 0; }
.cols .ty { color: var(--ink-3); }
.cols .pk { color: var(--l-auth); }
.cols .fk { color: var(--l-lab); }
.cols .new { color: var(--brand-ink); }
.tbl-f { padding: 8px 14px; border-top: 1px solid var(--line); background: var(--subtle); font-size: 12px; display: grid; gap: 4px; }
.db-sec { margin-top: 24px; }
.db-sec > h2 { font-size: 17px; margin-bottom: 4px; }
.mig-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }

/* UI */
.routes td:first-child { font-family: var(--font-mono); white-space: nowrap; }
.ui-files { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 16px; }
.ui-file { padding: 12px 14px; display: grid; gap: 6px; }
.ui-file b { font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; overflow-wrap: anywhere; }

@media (max-width: 960px) {
  .ov, .flows, .code-grid, .two { grid-template-columns: minmax(0, 1fr); }
  .two > *, .insp > * { min-width: 0; }
  .flow-list, .tree { position: static; max-height: none; }
  .layer-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }

ting.isEmpty()) return 0;\n\n    Map<Long, LabOrderSummary> orders = labIntegrationService\n            .getOrders(waiting.stream().map(Visit::getLatestLabOrderId).toList(), authorization)\n            .stream()\n            .collect(Collectors.toMap(LabOrderSummary::id, Function.identity()));\n\n    int moved = 0;\n    for (Visit visit : waiting) {\n        LabOrderSummary order = orders.get(visit.getLatestLabOrderId());\n        if (order != null && \"COMPLETED\".equals(order.orderStatus())) {\n            int changed = visitRepository.transition(visit.getId(),\n                    EnumSet.of(VisitStatus.AWAITING_LAB), VisitStatus.LAB_RESULTS_READY);\n            if (changed > 0) {\n                visitService.recordEvent(visit.getId(), VisitStatus.AWAITING_LAB, VisitStatus.LAB_RESULTS_READY,\n                        \"lab-service\", \"Results released for lab order #\" + order.id());\n            }\n            moved += changed;\n        }\n    }\n    return moved;\n}","line":47,"tx":"propagation = Propagation.NOT_SUPPORTED","calls":[{"to":"opd:VisitRepository","m":"findByStatusAndLatestLabOrderIdIsNotNull"},{"to":"opd:VisitRepository","m":"transition"},{"to":"opd:VisitService","m":"recordEvent"}],"httpOut":[],"calledBy":[{"from":"opd:VisitController","m":"refreshLabStatuses"}]},{"name":"startConsultation","ctor":false,"returns":"void","params":["Long visitId","String doctor"],"mods":["public"],"anns":[{"n":"Transactional","a":""}],"doc":"Doctor opens the patient: TRIAGED / LAB_RESULTS_READY -> IN_CONSULTATION. Idempotent.","abstract":false,"src":"/** Doctor opens the patient: TRIAGED / LAB_RESULTS_READY -> IN_CONSULTATION. Idempotent. */\n@Transactional\npublic void startConsultation(Long visitId, String doctor) {\n    Visit visit = visitRepository.findById(visitId)\n            .orElseThrow(() -> new ResponseStatusException(HttpStatus.NOT_FOUND, \"Visit not found: \" + visitId));\n    VisitService.requireAssignedDoctor(visit, doctor);\n\n    VisitStatus from =   .orElseThrow(() -> new ResponseStatusException(HttpStatus.NOT_FOUND, \"Visit not found: \" + visitId));\n    VisitService.requireAssignedDoctor(visit, doctorUsername);\n\n    if (!CONCLUDABLE.contains(visit.getStatus())) {\n        String reason = visit.getStatus() == VisitStatus.AWAITING_LAB\n                ? \"Lab results are still pending for this visit\"\n                : \"Visit is \" + visit.getStatus() + \"; cannot conclude\";\n        throw new ResponseStatusException(HttpStatus.CONFLICT, reason);\n    }\n\n    VisitStatus from = visit.getStatus();\n    visit.setDiagnosis(request.getDiagnosis().trim());\n    visit.setConsultationNotes(request.getConsultationNotes().trim());\n    visit.setStatus(VisitStatus.COMPLETED);\n    visit.setCompletedAt(OffsetDateTime.now());\n    visitService.recordEvent(visitId, from, VisitStatus.COMPLETED, doctorUsername,\n            \"Signed off. Diagnosis: \" + visit.getDiagnosis());\n}","line":119,"tx":"read-write","calls":[{"to":"opd:VisitRepository","m":"findById"},{"to":"opd:VisitService","m":"requireAssignedDoctor"},{"to":"opd:VisitService","m":"recordEvent"}],"httpOut":[],"calledBy":[{"from":"opd:VisitController","m":"conclude"}]},{"name":"loadLabResults","ctor":false,"returns":"Optional<VisitLabResults>","params":["Visit visit","String authorization"],"mods":["private"],"anns":[],"doc":"","abstract":false,"src":"private Optional<VisitLabResults> loadLabResults(Visit visit, String authorization) {\n    Long orderId = visit.getLatestLabOrderId();\n    if (orderId == null) return Optional.empty();\n\n    LabOrderSummary order = labIntegrationService.getOrders(List.of(orderId), authorization).stream()\n            .findFirst()\n            .orElseThrow(() -> new ResponseStatusException(HttpStatus.BAD_GATEWAY,\n                    \"Lab order \" + orderId + \" not found in lab service\"));\n\n    List<LabResultItem> results = \"COMPLETED\".equals(order.orderStatus())\n            ? labIntegrationService.getResults(orderId,  Long raiseLabInvestigationOrder(Long visitId, String mrn, String patientName, List<String> testCodes,\n                                       String clinicalHistory, String authorization) {\n    LabOrderSummary created = execute(() -> labWebClient.post()\n            .uri(\"/api/v1/lab/orders\")\n            .header(HttpHeaders.AUTHORIZATION, authorization)\n            .contentType(MediaType.APPLICATION_JSON)\n            .bodyValue(new LabOrderRequest(visitId, mrn, patientName, testCodes, clinicalHistory))\n            .retrieve()\n            .bodyToMono(LabOrderSummary.class));\n\n    if (created == null || created.id() == null) {\n        throw new DownstreamServiceException(SERVICE, null, HttpStatus.BAD_GATEWAY,\n                \"Lab service did not return an order ID\", null);\n    }\n    return created.id();\n}","line":37,"calls":[{"to":"opd:LabIntegrationService","m":"execute"}],"httpOut":[{"method":"POST","path":"/api/v1/lab/orders","to":"lab:LabOrderController","m":"placeOrder"}],"calledBy":[{"from":"opd:VisitService","m":"sendToLab"}]},{"name":"getOrders","ctor":false,"returns":"List<LabOrderSummary>","params":["Collection<Long> ids","String authorization"],"mods":["public"],"anns":[],"doc":"Fetches orders by ID in one call.","abstract":false,"src":"/** Fetches orders by ID in one call. */\npublic List<LabOrderSummary> getOrders(Collection<Long> ids, String authorization) {\n    if (ids.isEmpty()) return List.of();\n    String csv = ids.stream().map(String::valueOf).collect(Collectors.joining(\",\"));\n    LabOrderSummary[] orders = execute(() -> labWebClient.get()\n            .uri(b -> b.path(\"/api/v1/lab/orders\").queryParam(\"ids\", csv).build())\n            .header(HttpHeaders.AUTHORIZATION, authorization)\n            .retrieve()\n            .bodyToMono(LabOrderSummary[].class));\n    return orders == null ? List.of() : List.of(orders);\n}","line":55,"calls":[{"to":"opd:LabIntegrationService","m":"execute"}],"httpOut":[{"method":"GET","path":" ientRequestException ex) {\n        throw new DownstreamServiceException(SERVICE, null, HttpStatus.SERVICE_UNAVAILABLE,\n                \"Lab service unreachable\", ex);\n    } catch (IllegalStateException ex) { // block(timeout)\n        throw new DownstreamServiceException(SERVICE, null, HttpStatus.GATEWAY_TIMEOUT,\n                \"Lab service timed out\", ex);\n    }\n}","line":77,"calls":[],"httpOut":[],"calledBy":[{"from":"opd:LabIntegrationService","m":"raiseLabInvestigationOrder"},{"from":"opd:LabIntegrationService","m":"getOrders"},{"from":"opd:LabIntegrationService","m":"getResults"}]}],"inner":[],"imports":["com.hospital.opd.dto.LabOrderRequest","com.hospital.opd.dto.LabOrderSummary","com.hospital.opd.dto.LabResultItem","com.hospital.opd.exception.DownstreamServiceException","org.slf4j.Logger","org.slf4j.LoggerFactory","org.springframework.http.HttpHeaders","org.springframework.http.HttpStatus","org.springframework.http.MediaType","org.springframework.stereotype.Service","org.springframework.web.reactive.function.client.WebClient","org.springframework.web.reactive.function.client.WebClientRequestException","org.springframework.web.reactive.function.client.WebClientResponseException","reactor.core.publisher.Mono","java.time.Duration","java.util.Collection","java.util.List","java.util.function.Supplier","java.util.stream.Collectors"],"decl":"class LabIntegrationService","lines":101,"layer":"service","id":"opd:LabIntegrationService","deps":[]},"opd:LabReportPdfService":{"svc":"opd","pkg":"com.hospital.opd.service","name":"LabReportPdfService","kind":"class","file":"jb-opd-service/src/main/java/com/hospital/opd/service/LabReportPdfService.java","anns":[{"n":"Service","a":""}],"doc":"","extends":"","implements":"","components":[],"fields":[{"type":"ZoneId","name":"ZONE","anns":[],"static":true},{"type":"DateTimeFormatter","name":"TS","anns":[],"static":true},{"type":"Color","name":"ABNORMAL","anns":[],"static":true},{"type":"Color","name":"HEADER_BG","anns":[],"static":true},{"type":"Color","name":"BORDER","anns":[],"static":true},{"type":"Color","name":"MUTED","anns":[],"static":true},{"type":"Font","name":"fTitle","anns":[],"static":false},{"type":"Font","name":"fSubtitle","anns":[],"static":false},{"type":"Font","name":"fSection","anns":[],"static":false},{"type":"Font","name":"fLabel","anns":[],"static":false},{"type":"Font","name":"fCell","anns":[],"static":false},{"type":"Font","name":"fHead","anns":[],"static":false},{"type":"Font","name":"fAbnormal","anns":[],"static":false},{"type":"Font","name":"fSmall","anns":[],"static":false},{"type":"String","name":"hospitalName","anns":[],"static":false}],"methods":[{"name":"LabReportPdfService","ctor":true,"returns":"","params":["String hospitalName"],"mods":["public"],"anns":[{"n":"Value","a":"\"${app.hospital.name:Jeevan Bikas Hospital}\""}],"doc":"","abstract":false,"src":"public LabReportPdfService(@Value(\"${app.hospital.name:Jeevan Bikas Hospital}\") String hospitalName) {\n    this.hospitalName = hospitalName;\n}","line":57,"calls":[],"httpOut":[],"calledBy":[]},{"name":"render","ctor":false,"returns":"byte[]","params":["Visit visit","Patient patient","VisitLabResults lab"],"mods":["public"],"anns":[],"doc":"","abstract":false,"src":"public byte[] render(Visit visit, Patient patient, VisitLabResults lab) {\n    ByteArrayOutputStream out = new ByteArrayOutputStream();\n    Document doc = new Document(PageSize.A4, 40, 40, 40, 40);\n    try {\n        PdfWriter.getInstance(doc, out);\n        doc.open();\n\n        Paragraph title = new Paragraph(hospitalName, fTitle);\n        title.setAlignment(Element.ALIGN_CENTER);\n        doc.add(title);\n\n        Paragraph subtitle = new Paragraph(\"Laboratory Investigation Report\", fSubtitle);\n        subtitle.setAlignment(Element.ALIGN_CENTER);\n        subtitle.setSpacingAfter(14);\n        doc.add(subtitle);\n\n        // Patient / order details\n        PdfPTable info = new PdfPTable(new float[]{1.3f, 2.2f, 1.3f, 2.2f});\n        info.setWidthPercentage(100);\n        info.setSpacingAfter(14);\n        addInfo(info, \"Patient\", patient.getFullName());\n        addInfo(info, \"MRN\", patient.getMrn());\n        addInfo(info, \"Age / Sex\", age(patient) + \" / \" + sex(patient));\n        addInfo(info, \"Blood group\", orDash(patient.getBloodGroup()));\n        addInfo(info, \"Visit / Token\", \"#\" + visit.getId() + \" / \" + visit.getTokenNumber());\n        addInfo(info, \"Lab order\", \"#\" + lab.orderId());\n        addInfo(info, \"Ordered on\", format(lab.orderedAt()));\n        addInfo(info, \"Referring doctor\", orDash(lab.orderedByDoctor()));\n        doc.add(info);\n\n        // One table per test, in the order the results came back\n        Map<String, List<LabResultItem>> byTest = lab.results().stream()\n                .collect(Collectors.groupingBy(LabResultItem::testCode, LinkedHashMap::new, Collectors.toList()));\n\n        for (Map.Entry<String, List<LabResultItem>> entry : byTest.entrySet()) {\n            List<LabResultItem> rows = entry.getValue();\n            String testName = rows.get(0).testName() != null ? rows.get(0).testName() : entry.getKey();\n\n            Paragraph section = new Paragraph(testName + \" (\" + entry.getKey() + \")\", fSection);\n            section.setSpacingBefore(6);\n            section.setSpacingAfter(4);\n            doc.add(section);\n\n            PdfPTable table = new PdfPTable(new float[]{4f, 2f, 3.4f, 1.6f});\n            table.setWidthPercentage(100);\n            table.setHeaderRows(1);\n            for (String h : List.of(\"Parameter\", \"Result\", \"Reference range\", \"Flag\")) {\n                PdfPCell c = cell(h, fHead);\n                c.setBackgroundColor(HEADER_BG);\n                table.addCell(c);\n            }\n            for (LabResultItem r : rows) {\n                table.addCell(cell(r.parameterName(), fCell));\n                table.addCell(cell(r.observedValue(), r.abnormal() ? fAbnormal : fCell));\n                table.addCell(cell(orDash(r.referenceRange()), fCell));\n                table.addCell(cell(r.abnormal() ? \"ABNORMAL\" : \"\", fAbnormal));\n            }\n            doc.add(table);\n\n            String notes = rows.stream()\n                    .map(LabResultItem::technicianNotes)\n                    .filter(n -> n != null && !n.isBlank())\n                    .distinct()\n                    .collect(Collectors.joining(\" \"));\n            if (!notes.isEmpty()) {\n                Paragraph p = new Paragraph(\"Notes: \" + notes, fSmall);\n                p.setSpacingBefore(3);\n                doc.add(p);\n            }\n        }\n\n        // Footer\n        String enteredBy = lab.results().stream()\n                .map(LabResultItem::resultEnteredBy).filter(Objects::nonNull).distinct()\n                .collect(Collectors.joining(\", \"));\n        OffsetDateTime enteredAt = lab.results().stream()\n                .map(LabResultItem::resultEnteredAt).filter(Objects::nonNull)\n                .max(Comparator.naturalOrder()).orElse(null);\n\n        Paragraph footer = new Paragraph(\n                \"Results entered by \" + orDash(enteredBy) + \" on \" + format(enteredAt) + \".\", fSmall);\n        footer.setSpacingBefore(18);\n        doc.add(footer);\n        doc.add(new Paragraph(\n                \"Values marked ABNORMAL fall outside the reference range. Reference ranges shown are for adults \"\n                + \"and may vary by age and sex.\", fSmall));\n        doc.add(new Paragraph(\"Generated \" + format(OffsetDateTime.now()) + \". Electronically generated report.\", fSmall));\n    } catch (DocumentException e) {\n        throw new IllegalStateException(\"Failed to generate lab report PDF\", e);\n    } finally {\n        if (doc.isOpen()) doc.close();\n    }\n    return out.toByteArray();\n}","line":61,"calls":[{"to":"opd:LabReportPdfService","m":"addInfo"},{"to":"opd:LabReportPdfService","m":"age"},{"to":"opd:LabReportPdfService" "],"anns":[{"n":"Transactional","a":"propagation = Propagation.MANDATORY"}],"doc":"Opens a visit and issues today's next token. Must run inside the caller's transaction so the token, visit row and audit event commit (or roll back) together.","abstract":false,"src":"/**\n * Opens a visit and issues today's next token. Must run inside the caller's transaction so the\n * token, visit row and audit event commit (or roll back) together.\n */\n@Transactional(propagation = Propagation.MANDATORY)\npublic Visit openVisit(Patient patient, String chiefComplaint, VisitPriority priority,\n                       StaffSummary doctor, String registrar) {\n    if (patient.getId() != null && visitRepository.hasActiveVisit(patient.getId())) {\n        throw new ResponseStatusException(HttpStatus.CONFLICT,\n                patient.getFullName() + \" already has an open visit today. Complete or cancel it first.\");\n    }\n\n    LocalDate today = LocalDate.now(HOSPITAL_ZONE);\n    tokenCounterRepository.incrementAtomicToken(today);   // INSERT ... ON CONFLICT DO UPDATE: row-locked, race-free\n    Integer token = tokenCounterRepository.getCurrentTokenValue(today);\n\n    Visit visit = new Visit();\n    visit.setPatient(patient);\n    visit.setVisitDate(today);\n    visit.setTokenNumber(token);\n    visit.setChiefComplaint(chiefComplaint.trim());\n    visit.setPriority(priority);\n    visit.setStatus(VisitStatus.REGISTERED);\n    visit.setAssignedDoctorId(doctor.id());\n    visit.setAssignedDoctorUsername(doctor.username());\n    visit.setAssignedDoctorName(doctor.fullName());\n    visit.setRegisteredBy(registrar);\n    Visit saved = visitRepository.save(visit);\n\n    recordEvent(saved.getId(), null, VisitStatus.REGISTERED, registrar,\n            \"Registered with token #\" + token + \", assigned to \" + doctor.fullName());\n    return saved;\n}","line":58,"tx":"propagation = Propagation.MANDATORY","calls":[{"to":"opd:VisitRepository","m":"hasActiveVisit"},{"to":"opd:TokenCounterReposit alHistory(request.getClinicalHistory());\n    order.setOrderStatus(LabOrderStatus.PLACED);\n    order.setTestCodes(request.getTestCodes().stream()\n            .map(String::trim)\n            .filter(code -> !code.isEmpty())\n            .map(code -> code.toUpperCase(Locale.ROOT))\n            .collect(Collectors.toCollection(LinkedHashSet::new)));\n\n    LabOrder saved = labOrderRepository.save(order);\n    return toResponse(saved, List.of());\n}","line":34,"tx":"read-write","calls":[{"to":"lab:LabOrderRepository","m":"save"},{"to":"lab:LabOrderService","m":"toResponse"}],"httpOut":[],"calledBy":[{"from":"lab:LabOrderController","m":"placeOrder"}]},{"name":"collectSample","ctor":false,"returns":"LabOrderResponse","params":["Long orderId","String testCode","String technician"],"mods":["public"],"anns":[{"n":"Transactional","a":""}],"doc":"Records the sample for ONE test on the order. The order stays PLACED while any test is still pending and moves to SAMPLE_COLLECTED once every ordered test has its sample.","abstract":false,"src":"/**\n * Records the sample for ONE test on the order. The order stays PLACED while any test is\n * still pending and moves to SAMPLE_COLLECTED once every ordered test has its sample.\n */\n@Transactional\npublic LabOrderResponse collectSample(Long orderId, String testCode, String technician) {\n    LabOrder order = labOrderRepository.findById(orderId)\n            .orElseThrow(() -> new ResponseStatusException(HttpStatus.NOT_FOUND, \"Lab order not found: \" + orderId));\n    if (order.getOrderStatus() != LabOrderStatus.PLACED) {\n        throw new ResponseStatusException(HttpStatus.CONFLICT,\n                \"Order is \" + order.getOrderStatus() + \"; no samples are pending\");\n    }\n\n    String code = testCode.trim().toUpperCase(Locale.ROOT);\n    if (!order.getTestCodes().contains(code)) {\n        throw new ResponseStatusException(HttpStatus.BAD_REQUEST, code + \" is not on order #\" + orderId);\n    }\n    if (sampleRepository.existsByOrderIdAndTestCode(orderId, code)) {\n        throw new ResponseStatusException(HttpStatus.CONFLICT, \"The \" + code + \" sample is already collected\");\n    }\n\n    // saveAndFlush so the unique constraint fires here (as a 409) if two techs click at once.\n    sampleRepository.saveAndFlush(new LabSampleCollection(orderId, code, technician));\n\n    List<LabSampleCollection> collected = sampleRepository.findByOrderId(orderId);\n    if (collected.size() >= order.getTestCodes().size()) {\n        order.setOrderStatus(LabOrderStatus.SAMPLE_COLLECTED);\n    }\n    return toResponse(order, collected);\n}","line":53,"tx":"read-write","calls":[{"to":"lab:LabOrderRepository","m":"findById"},{"to":"lab:LabSampleCollectionRepository","m":"existsByOrderIdAndTestCode"},{"to":"lab:LabSampleCollectionRepository","m":"saveAndFlush"},{"to":"lab:LabSampleCollectionRepository","m":"findByOrderId"},{"to":"lab:LabOrderService","m":"toResponse"}],"httpOut":[],"calledBy":[{"from":"lab:LabOrderController","m":"collectSample"}]},{"name":"updateStatus","ctor":false,"returns":"LabOrderResponse","params":["Long orderId","LabOrderStatus target"],"mods":["public"],"anns":[{"n":"Transactional","a":""}],"doc":"Only cancellation is a manual status change; sample collection is per test, completion is via results.","abstract":false,"src":"/** Only cancellation is a manual status change; sample collection is per test, completion is via results. */\n@Transactional\npublic LabOrderResponse updateStatus(Long orderId, LabOrderStatus target) {\n    LabOrder order = labOrderRepository.findById(orderId)\n            .orElseThrow(() -> new ResponseStatusException(HttpStatus.NOT_FOUND, \"Lab order not found: \" + orderId));\n\n    LabOrderStatus from = order.getOrderStatus();\n    if (target == LabOrderStatus.SAMPLE_COLLECTED) {\n        throw new ResponseStatusException(HttpStatus.BAD_REQUEST,\n                \"Collect each test's sample individually: POST /api/v1/lab/orders/{id}/tests/{testCode}/collect\");\n    }\n    boolean allowed = target == LabOrderStatus.CANCELLED\n            && (from == LabOrderStatus.PLACED || from == LabOrderStatus.SAMPLE_COLLECTED);\n    if (!allowed) {\n        throw new ResponseStatusException(HttpStatus.CONFLICT, \"Cannot move order from \" + from + \" to \" + target);\n    }\n    order.setOrderStatus(target);\n    return toResponse(order, sampleRepository.findByOrderId(orderId));\n}","line":84,"tx":"read-write","calls":[{"to":"lab:LabOrderRepository","m":"findById"},{"to":"lab:LabSampleCollectionRepository","m":"findByOrderId"},{"to":"lab:LabOrderService","m":"toResponse"}],"httpOut":[],"calledBy":[{"from":"lab:LabOrderController","m":"changeOrderStatus"}]},{"name":"getOrdersByStatuses","ctor":false,"returns":"List<LabOrderResponse>","params":["Collection<LabOrderStatus> statuses"],"mods":["public"],"anns":[{"n":"Transactional","a":"readOnly = true"}],"doc":"","abstract":false,"src":"@Transactional(readOnly = true)\npublic List<LabOrderResponse> getOrdersByStatuses(Collection<LabOrderStatus> statuses) {\n    return toResponses(labOrderRepository.findByOrderStatusInOrderByOrderedAtAsc(statuses));\n}","line":104,"tx":"readOnly = true","calls":[{"to":"lab:LabOrderRepository","m":"findByOrderStatusInOrderByOrderedAtAsc"},{"to":"lab:LabOrderService","m":"toResponses"}],"httpOut":[],"calledBy":[{"from":"lab:LabOrderController","m":"getOrderQueue"}]},{"name":"getOrdersByIds","ctor":false,"returns":"List<LabOrderResponse>","params":["Collection<Long> ids"],"mods":["public"],"anns":[{"n":"Transactional","a":"readOnly = true"}],"doc":"","abstract":false,"src":"@Transactional(readOnly = true)\npublic List<LabOrderResponse> getOrdersByIds(Collection<Long> ids) {\n    return toResponses(labOrderRepository.findAllById(ids));\n}","line":109,"tx":"readOnly = true","calls":[{"to":"lab:LabOrderRepository","m":"findAllById"},{"to":"lab:LabOrderService","m":"toResponses"}],"httpOut":[],"calledBy":[{"from":"lab:LabOrderController","m":"getOrders"}]},{"name":"toResponses","ctor":false,"returns":"List<LabOrderResponse>","params":["List<LabOrder> orders"],"mods":["private"],"anns":[],"doc":"Batch-loads sample rows for all orders in one query (no N+1 on the worklist).","abstract":false,"src":"/** Batch-loads sample rows for all orders in one query (no N+1 on the worklist). */\nprivate List<LabOrderResponse> toResponses(List<LabOrder> orders) {\n    if (orders.isEmpty()) return List.of();\n    Map<Long, List<LabSampleCollection>> byOrder = sampleRepository\n            .findByOrderIdIn(orders.stream().map(LabOrder::getId).toList()).stream()\n            .collect(Collectors.groupingBy(LabSampleCollection::getOrderId));\n    return orders.stream()\n            .map(o -> toResponse(o, byOrder.getOrDefault(o.getId(), List.of())))\n            .toList();\n}","line":114,"calls":[{"to":"lab:LabOrderService","m":"toResponse"}],"httpOut":[],"calledBy":[{"from":"lab:LabOrderService","m":"getOrdersByStatuses"},{"from":"lab:LabOrderService","m":"getOrdersByIds"}]},{"name":"toResponse","ctor":false,"returns":"LabOrderResponse","params":["LabOrder order","List<LabSampleCollection> collected"],"mods":["private"],"anns":[],"doc":"","abstract":false,"src":"private LabOrderResponse toResponse(LabOrder order, List<LabSampleCollection> collected) {\n    Map<String, LabSampleCollection> byTest = collected.stream()\n            .collect(Collectors.toMap(LabSampleCollection::getTestCode, Function.identity(), (a, b) -> a));\n    List<LabOrderResponse.Sample> samples = order.getTestCodes().stream()\n            .map(code -> {\n                LabSampleCollection s = byTest.get(code);\n                return s == null\n                        ? new LabOrderResponse.Sample(code, false, null, null)\n                        : new LabOrderResponse.Sample(code, true, s.getCollectedBy(), s.getCollectedAt());\n            })\n            .toList();\n    return new LabOrderResponse(\n            order.getId(),\n            order.getVisitId(),\n            order.getPatientMrn(),\n            order.getPatientName(),\n            order.getOrderedByDoctor(),\n            order.getOrderStatus(),\n            order.getClinicalHistory(),\n            order.getOrderedAt(),\n            List.copyOf(order.getTestCodes()),\n            samples);\n}","line":125,"calls":[],"httpOut":[],"calledBy":[{"from":"lab:LabOrderService","m":"createOrder"},{"from":"lab:LabOrderService","m":"collectSample"},{"from":"lab:LabOrderService","m":"updateStatus"},{"from":"lab:LabOrderService","m":"toResponses"}]}],"inner":[],"imports":["com.hospital.lab.dto.LabOrderRequest","com.hospital.lab.dto.LabOrderResponse","com.hospital.lab.model.LabOrder","com.hospital.lab.model.LabOrderStatus","com.hospital.lab.model.LabSampleCollection","com.hospital.lab.repository.LabOrderRepository","com.hospital.lab.repository.LabSampleCollectionRepository","org.springframework.http.HttpStatus","org.springframework.stereotype.Service","org.springframework.transaction.annotation.Transactional","org.springframework.web.server.ResponseStatusException","java.util.Collection","java.util.LinkedHashSet","java.util.List","java.util.Locale","java.util.Map","java.util.function.Function","java.util.stream.Collectors"],"decl":"class LabOrderService","lines":149,"layer":"service","id":"lab:LabOrderService","deps":["lab:LabOrderRepository","lab:LabSampleCollectionRepository"]},"lab:LabResultEntryService":{"svc":"lab","pkg":"com.hospital.lab.service","name":"LabResultEntryService","kind":"class","file":"jb-lab-service/src/main/java/com/hospital/lab/service/LabResultEntryService.java","anns":[{"n":"Service","a":""}],"doc":"","extends":"","implements":"","components":[],"fields":[{"type":"LabOrderRepository","name":"orderRepository","anns":[],"static":false},{"type":"LabTestParameterRepository","name":"parameterRepository","anns":[],"static":false},{"type":"LabResultService","name":"labResultService","anns":[],"static":false},{"type":"LabSampleCollectionRepository","name":"sampleRepository","anns":[],"static":false}],"methods":[{"name":"LabResultEntryService","ctor":true,"returns":"","params":["LabOrderRepository orderRepository","LabTestParameterRepository parameterRepository","LabResultService labResultService","LabSampleCollectionRepository sampleRepository"],"mods":["public"],"anns":[],"doc":"","abstract":false,"src":"public LabResultEntryService(LabOrderRepository orderRepository,\n                             LabTestParameterRepository parameterRepository,\n                             LabResultService labResultService,\n                             LabSampleCollectionRepository sampleRepository) {\n    this.orderRepository = orderRepository;\n    this.parameterRepository = parameterRepository;\n    this.labResultService = labResultService;\n    this.sampleRepository = sampleRepository;\n}","line":31,"calls":[],"httpOut":[],"calledBy":[]},{"name":"submitOrderResults","ctor":false,"returns":"List<LabResultResponse>","params":["Long orderId","OrderResultsRequest request","String technician"],"mods":["public"],"anns":[{"n":"Transactional","a":""}],"doc":"","abstract":false,"src":"@Transactional\npublic List<LabResultResponse> submitOrderResults(Long orderId, OrderResultsRequest request, String technician) {\n    LabOrder order = orderRepository.findById(orderId)\n            .orElseThrow(() -> new ResponseStatusException(HttpStatus.NOT_FOUND, \"Lab order not found: \" + orderId));\n\n    if (order.getOrderStatus() == LabOrderStatus.COMPLETED || order.getOrderStatus() == LabOrderStatus.CANCELLED) {\n        throw new ResponseStatusException(HttpStatus.CONFLICT, \"Order is already \" + order.getOrderStatus());\n    }\n\n    Set<String> orderedTests = order.getTestCodes();\n\n    // Results can only be released once every ordered test has its sample.\n    Set<String> collected = sampleRepository.findByOrderId(orderId).stream()\n            .map(LabSampleCollection::getTestCode)\n            .collect(Collectors.toSet());\n    List<String> pending = orderedTests.stream().filter(c -> !collected.contains(c)).toList();\n    if (!pending.isEmpty()) {\n        throw new ResponseStatusException(HttpStatus.CONFLICT,\n                \"Collect the sample for \" + String.join(\", \", pending) + \" before entering results\");\n    }\n    Map<String, LabTestParameter> catalogue = parameterRepository.findByTestCodes(orderedTests).stream()\n            .collect(Collectors.toMap(p -> key(p.getTest().getTestCode(), p.getParameterName()), Function.identity()));\n\n    List<LabResultResponse> saved = new ArrayList<>();\n    for (OrderResultsRequest.Entry entry : request.results()) {\n        String testCode = entry.testCode().trim().toUpperCase(Locale.ROOT);\n        if (!orderedTests.contains(testCode)) {\n            throw new ResponseStatusException(HttpStatus.BAD_REQUEST, testCode + \" was not ordered on this order\");\n        }\n        LabTestParameter def = catalogue.get(key(testCode, entry.parameterName()));\n        if (def == null) {\n            throw new ResponseStatusException(HttpStatus.BAD_REQUEST,\n                    \"Unknown parameter '\" + entry.parameterName() + \"' for \" + testCode);\n        }\n\n        LabResultSubmissionRequest single = new LabResultSubmissionRequest();\n        single.setOrderId(orderId);\n        single.setTestCode(testCode);\n        single.setParameterName(def.getParameterName());\n        single.setObservedValue(entry.observedValue().trim());\n        single.setReferenceRange(formatRange(def));\n        single.setAbnormal(isOutOfRange(entry.observedValue(), def) || Boolean.TRUE.equals(entry.abnormal()));\n        single.setTechnicianNotes(entry.technicianNotes());\n\n        saved.add(labResultService.submitResult(single, technician));\n    }\n\n    order.setOrderStatus(LabOrderStatus.COMPLETED); // same transaction: all results + completion, or nothing\n    return saved;\n}","line":41,"tx":"read-write","calls":[{"to":"lab:LabOrderRepository","m":"findById"},{"to":"lab NULL DEFAULT 0\n);\n\n-- 3. PATIENT CLINICAL VISITS LAYER\nCREATE TABLE visits (\n    id                      BIGSERIAL PRIMARY KEY,\n    patient_id              BIGINT      NOT NULL REFERENCES patients (id),\n    assigned_doctor_id      UUID,\n    visit_date              DATE        NOT NULL,\n    token_number            INTEGER     NOT NULL,\n    chief_complaint         TEXT        NOT NULL,\n    priority                VARCHAR(15) NOT NULL CHECK (priority IN ('NORMAL', 'URGENT', 'EMERGENCY')),\n    status                  VARCHAR(25) NOT NULL CHECK (status IN ('REGISTERED', 'TRIAGED', 'IN_CONSULTATION',\n                                                                    'AWAITING_LAB', 'LAB_RESULTS_READY', 'COMPLETED', 'CANCELLED')),\n    assigned_doctor_name    VARCHAR(150),\n    consultation_notes      TEXT,\n    diagnosis               TEXT,\n    latest_lab_order_id     BIGINT,\n    cancel_reason           TEXT,\n    registered_at           TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n    registered_by           VARCHAR(50) NOT NULL,\n    consultation_started_at TIMESTAMPTZ,\n    completed_at            TIMESTAMPTZ,\n    version                 BIGINT      NOT NULL DEFAULT 0,\n    CONSTRAINT uq_visits_token_per_day UNIQUE (visit_date, token_number)\n);\n\n-- 4. TRIAGE CLINICAL VITAL SIGNS\nCREATE TABLE vital_signs (\n    id                  BIGSERIAL PRIMARY KEY,\n    visit_id            BIGINT       NOT NULL REFERENCES visits (id),\n    temperature_celsius NUMERIC(4, 2) NOT NULL,\n    pulse_rate          INTEGER      NOT NULL,\n    blood_pressure      VARCHAR(20)  NOT NULL,\n    oxygen_saturation   INTEGER      NOT NULL, \n    symptoms_brief      TEXT,\n    recorded_by         VARCHAR(50)  NOT NULL,\n    recorded_at         TIMESTAMPTZ  NOT NULL DEFAULT CURRENT_TIMESTAMP\n);\n\n-- 5. COMPLIANCE AUDITING SYSTEMS\n-- Append-only tracking engine archiving every mutation step a patient experiences \nCREATE TABLE visit_events (\n    id          BIGSERIAL PRIMARY KEY,\n    visit_id    BIGINT      NOT NULL REFERENCES visits (id),\n    from_status VARCHAR(25),\n    to_status   VARCHAR(25) NOT NULL,\n    actor       VARCHAR(50) NOT NULL,\n    note        TEXT,\n    occurred_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP\n);\n\n-- =============================================================================\n-- PERFORMANCE & ENFORCEMENT OPTIMIZATIONS (Indexes and Partial Constraints)\n-- =============================================================================\nCREATE INDEX idx_patients_phone ON patients (phone);\nCREATE INDEX idx_patients_name_lower ON patients (lower(full_name));\nCREATE INDEX idx_visits_date_status ON visits (visit_date, status);\nCREATE INDEX idx_visits_patient ON visits (patient_id);\nCREATE INDEX idx_vital_signs_visit ON vital_signs (visit_id, recorded_at DESC);\nCREATE INDEX idx_visit_events_visit ON visit_events (visit_id, occurred_at);\n\n-- Guardrail Index: Prevents a patient from opening overlapping visits concurrently\nCREATE UNIQUE INDEX uq_visits_one_active_per_patient ON visits (patient_id)\n    WHERE status NOT IN ('COMPLETED', 'CANCELLED');\n"},{"file":"V2__visit_doctor_username.sql","src":"-- Doctor queues are keyed by the doctor's username (the JWT subject), so the OPD service\n-- can filter \"my patients\" without a round-trip to the auth service on every request.\nALTER TABLE visits ADD COLUMN assigned_doctor_username VARCHAR(50);\n\nCREATE INDEX idx_visits_doctor_status ON visits (assigned_doctor_username, status);\n"}]},"lab":{"tables":{"lab_tests":{"name":"lab_tests","cols":[{"name":"id","type":"BIGSERIAL","pk":true,"ref":null,"notnull":true,"added":"V1__init_lab_schema.sql"},{"name":"test_code","type":"VARCHAR(20)","pk":false,"ref":null,"notnull":true,"added":"V1__init_lab_schema.sql"},{"name":"test_name","type":"VARCHAR(150)","pk":false,"ref":null,"notnull":true,"added":"V1__init_lab_schema.sql"},{"name":"department","type":"VARCHAR(50)","pk":false,"ref":null,"notnull":true," me of the requesting doctor\n    order_status        VARCHAR(25)  NOT NULL CHECK (order_status IN ('PLACED', 'SAMPLE_COLLECTED', 'COMPLETED', 'CANCELLED')),\n    clinical_history    TEXT,                  -- Brief provisional diagnosis from the doctor\n    ordered_at          TIMESTAMPTZ  NOT NULL DEFAULT CURRENT_TIMESTAMP,\n    updated_at          TIMESTAMPTZ\n);\n\n-- 3. LAB TEST RESULTS COMPONENT (Detailed parameter values)\nCREATE TABLE lab_results (\n    id                  BIGSERIAL PRIMARY KEY,\n    order_id            BIGINT       NOT NULL REFERENCES lab_orders (id) ON DELETE CASCADE,\n    test_id             BIGINT       NOT NULL REFERENCES lab_tests (id),\n    parameter_name      VARCHAR(100) NOT NULL, -- e.g., 'Hemoglobin', 'WBC Count', 'Serum Bilirubin'\n    observed_value      VARCHAR(50)  NOT NULL, -- e.g., '14.2', '7500', '1.1'\n    reference_range     VARCHAR(100),          -- e.g., '13.5 - 17.5 g/dL', '4000 - 11000 /uL'\n    is_abnormal         BOOLEAN      NOT NULL DEFAULT FALSE, -- Auto-flagged if out of reference range\n    technician_notes    TEXT,\n    result_entered_by   VARCHAR(50)  NOT NULL, -- Lab Technician's username\n    result_entered_at   TIMESTAMPTZ  NOT NULL DEFAULT CURRENT_TIMESTAMP\n);\n\n-- =============================================================================\n-- PERFORMANCE & LOOKUP OPTIMIZATIONS\n-- =============================================================================\nCREATE INDEX idx_lab_orders_visit ON lab_orders (visit_id);\nCREATE INDEX idx_lab_orders_mrn ON lab_orders (patient_mrn);\nCREATE INDEX idx_lab_orders_status ON lab_orders (order_status);\nCREATE INDEX idx_lab_results_order ON lab_results (order_id);\n\n-- Seed basic lookup catalog data right away\nINSERT INTO lab_tests (test_code, test_name, department, cost) VALUES\n('CBC', 'Complete Blood Count', 'HAEMATOLOGY', 350.00),\n('LFT', 'Liver Function Test', 'BIOCHEMISTRY', 850.00),\n('FBS', 'Fasting Blood Sugar', 'BIOCHEMISTRY', 120.00),\n('RFT', 'Renal Function Test', 'BIOCHEMISTRY', 600.00);\n"},{"file":"V2__lab_order_tests.sql","src":"CREATE TABLE lab_order_tests (\n    order_id  BIGINT      NOT NULL REFERENCES lab_orders(id) ON DELETE CASCADE,\n    test_code VARCHAR(20) NOT NULL,\n    PRIMARY KEY (order_id, test_code)\n);"},{"file":"V3__lab_test_parameters.sql","src":"-- Missing tests the doctor can order\nINSERT INTO lab_tests (test_code, test_name, department, cost) VALUES\n('LIPID', 'Lipid Profile', 'BIOCHEMISTRY', 700.00),\n('URINE', 'Urinalysis',   'PATHOLOGY',    200.00)\nON CONFLICT (test_code) DO NOTHING;\n\n-- Parameter catalogue with adult reference ranges (NULL = no numeric range / qualitative)\nCREATE TABLE lab_test_parameters (\n    id             BIGSERIAL PRIMARY KEY,\n    test_id        BIGINT        NOT NULL REFERENCES lab_tests (id) ON DELETE CASCADE,\n    parameter_name VARCHAR(100)  NOT NULL,\n    unit           VARCHAR(30),\n    ref_low        NUMERIC(12,3),\n    ref_high       NUMERIC(12,3),\n    display_order  INT           NOT NULL DEFAULT 0,\n    UNIQUE (test_id, parameter_name)\n);\n\nINSERT INTO lab_test_parameters (test_id, parameter_name, unit, ref_low, ref_high, display_order)\nSELECT t.id, v.name, v.unit, v.lo, v.hi, v.ord\nFROM lab_tests t\nJOIN (VALUES\n    ('CBC',   'Hemoglobin',          'g/dL',       12.0::numeric, 17.5::numeric, 1),\n    ('CBC',   'Total WBC Count',     'x10^3/uL',   4.0,   11.0,  2),\n    ('CBC',   'RBC Count',           'x10^6/uL',   4.0,   6.0,   3),\n    ('CBC',   'Hematocrit',          '%',          36.0,  52.0,  4),\n    ('CBC',   'MCV',                 'fL',         80.0,  100.0, 5),\n    ('CBC',   'Platelet Count',      'x10^3/uL',   150.0, 450.0, 6),\n    ('CBC',   'Neutrophils',         '%',          40.0,  75.0,  7),\n    ('CBC',   'Lymphocytes',         '%',          20.0,  45.0,  8),\n\n    ('LFT',   'Total Bilirubin',     'mg/dL',      0.2,   1.2,   1),\n    ('LFT',   'Direct Bilirubin',    'mg/dL',      0.0,   0.3,   2),\n    ('LFT',   'AST (SGOT)',          'U/L',        5.0,   40.0,  3),\n    ('LFT',   'ALT (SGPT)',          'U/L',        7.0,   56.0,  4),\n    ('LFT',   'Alkaline Phosphatase','U/L',        44.0,  147.0, 5),\n    ('LFT',   'Total Protein',       'g/dL',       6.0,   8.3,   6),\n    ('LFT',   'Albumin',             'g/dL',       3.5,   5.0,   7),\n\n    ('FBS',   'Fasting Glucose',     'mg/dL',      70.0,  100.0, 1),\n\n    ('RFT',   'Urea',                'mg/dL',      15.0,  40.0,  1),\n    ('RFT',   'Creatinine',          'mg/dL',      0.6,   1.3,   2),\n    ('RFT',   'Sodium',              'mmol/L',     135.0, 145.0, 3),\n    ('RFT',   'Potassium',           'mmol/L',     3.5,   5.1,   4),\n    ('RFT',   'Uric Acid',           'mg/dL',      3.5,   7.2,   5),\n\n    ('LIPID', 'Total Cholesterol',   'mg/dL',      NULL,  200.0, 1),\n    ('LIPID', 'Triglycerides',       'mg/dL',      NULL,  150.0, 2),\n    ('LIPID', 'HDL Cholesterol',     'mg/dL',      40.0,  NULL,  3),\n    ('LIPID', 'LDL Cholesterol',     'mg/dL',      NULL,  100.0, 4),\n\n    ('URINE', 'pH',                  NULL,         4.5,   8.0,   1),\n    ('URINE', 'Specific Gravity',    NULL,         1.005, 1.030, 2),\n    ('URINE', 'Protein',             NULL,         NULL,  NULL,  3),\n    ('URINE', 'Glucose',             NULL,         NULL,  NULL,  4),\n    ('URINE', 'Pus Cells',           '/HPF',       0.0,   5.0,   5),\n    ('URINE', 'RBC',                 '/HPF',       0.0,   2.0,   6)\n) AS v(code, name, unit, lo, hi, ord) ON v.code = t.test_code;"},{"file":"V4__lab_order_patient_name.sql","src":"-- Denormalised patient name so the lab worklist is readable without calling the OPD service.\nALTER TABLE lab_orders ADD COLUMN patient_name VARCHAR(150);\n"},{"file":"V5__lab_sample_collections.sql","src":"-- Samples are collected per test, not per order: a CBC (EDTA tube) and a urinalysis (urine cup)\n-- are separate draws, often at different times. One row per collected test.\nCREATE TABLE lab_sample_collections (\n    id            BIGSERIAL    PRIMARY KEY,\n    order_id      BIGINT       NOT NULL REFERENCES lab_orders (id) ON DELETE CASCADE,\n    test_code     VARCHAR(20)  NOT NULL,\n    collected_by  VARCHAR(50)  NOT NULL,\n    collected_at  TIMESTAMPTZ  NOT NULL DEFAULT CURRENT_TIMESTAMP,\n    CONSTRAINT uq_sample_per_test UNIQUE (order_id, test_code),\n    CONSTRAINT fk_sample_ordered_test FOREIGN KEY (order_id, test_code)\n        REFERENCES lab_order_tests (order_id, test_code) ON DELETE CASCADE\n);\n\n-- Orders that were already past sample collection before this migration count as fully collected.\nINSERT INTO lab_sample_collections (order_id, test_code, collected_by, collected_at)\nSELECT t.order_id, t.test_code, 'system-migration', COALESCE(o.updated_at, o.ordered_at)\nFROM lab_order_tests t\nJOIN lab_orders o ON o.id = t.order_id\nWHERE o.order_status IN ('SAMPLE_COLLECTED', 'COMPLETED');\n"}]}},"gateway":[{"id":"auth-service-route","uri":"http://jb-auth-api:8081","path":"/api/v1/auth/**"},{"id":"opd-service-route","uri":"http://jb-opd-service:8082","path":"/api/v1/opd/**"},{"id":"lab-service-route","uri":"http://jb-lab-service:8083","path":"/api/v1/lab/**"}],"ui":{"files":[{"file":"App.tsx","area":"app","lines":61,"fns":[{"name":"Home","kind":"component","exported":false,"src":"function Home() {\n  const { user } = useAuth();\n  return <Navigate to={user ? HOME[user.role] : '/login'} replace />;\n}","apis":[],"uses":["Navigate"],"line":15},{"name":"Forbidden","kind":"component","exported":false,"src":"function Forbidden() {\n  return (\n    <Card className=\"max-w-lg mx-auto mt-10\">\n      <EmptyState icon={<ShieldAlert className=\"size-5\" />} title=\"You don't have access to this area\">\n        Your role can't open this workspace. Use the menu to go to your own area.\n      <\/EmptyState>\n    <\/Card>\n  );\n}","apis":[],"uses":["Card","EmptyState","ShieldAlert"],"line":20},{"name":"App","kind":"component","exported":true,"src":"export default function App() {\n s","OpdApi.labResults","OpdApi.visit"],"uses":["Alert","AlertTriangle","Button","Card","CardHeader","Droplets","Gauge","HeartPulse","LabResults","Meta","OrderTests","PriorityBadge","QueueItem","SignOff","Spinner","StatusBadge","Thermometer","Timeline","Token","VisitLabResults","Vital"],"line":21},{"name":"LabResults","kind":"component","exported":false,"src":"function LabResults({ visitId, lab }: { visitId: number; lab: VisitLabResults }) {\n  const [pdfBusy, setPdfBusy] = useState(false);\n  const [error, setError] = useState<string | null>(null);\n  const groups = useMemo(() => {\n    const m = new Map<string, typeof lab.results>();\n    lab.results.forEach((r) => m.set(r.testCode, [...(m.get(r.testCode) ?? []), r]));\n    return [...m.entries()];\n  }, [lab]);\n  const abnormal = lab.results.filter((r) => r.abnormal).length;\n  const completed = lab.orderStatus === 'COMPLETED';\n\n  return (\n    <Card>\n      <CardHeader icon={<FlaskConical className=\"size-[18px]\" />} title=\"Lab results\"\n        subtitle={<>Order #{lab.orderId} \u00b7 {lab.testCodes.join(', ')} \u00b7 {dateTime(lab.orderedAt)}<\/>}\n        actions={<>\n          <LabStatusBadge status={lab.orderStatus} />\n          {completed && abnormal > 0 && <Badge tone=\"red\">{abnormal} abnormal<\/Badge>}\n          {completed && (\n            <Button variant=\"secondary\" size=\"sm\" loading={pdfBusy} icon={<FileText className=\"size-4\" />}\n              onClick={async () => {\n                setPdfBusy(true); setError(null);\n                try { await OpdApi.openLabReport(visitId); } catch (e) { setError(apiError(e, \"Couldn't open the report\")); }\n                finally { setPdfBusy(false); }\n              }}>PDF report<\/Button>\n          )}\n        <\/>} />\n      {error && <div className=\"px-5 pt-4\"><Alert>{error}<\/Alert><\/div>}\n      {!completed ? (\n        <p className=\"px-5 py-4 text-[13px] text-ink-3\">Results will appear here when the lab releases them.<\/p>\n      ) : (\n        <div className=\"divide-y divide-line\">\n          {groups.map(([code, rows]) => (\n            <div key={code} className=\"px-5 py-4\">\n              <p className=\"text-[13px] font-semibold text-ink mb-2\">{rows[0].testName} <span className=\"font-mono font-normal text-ink-4\">{code}<\/span><\/p>\n              <table className=\"w-full text-[13px]\">\n                <thead>\n                  <tr className=\"text-left text-xs text-ink-4\">\n                    <th className=\"font-medium pb-1.5\">Parameter<\/th><th className=\"font-medium pb-1.5\">Result<\/th><th className=\"font-medium pb-1.5\">Reference<\/th>\n                  <\/tr>\n                <\/thead>\n                <tbody className=\"divide-y divide-line\">\n                  {rows.map((r) => (\n                    <tr key={r.id} className={r.abnormal ? 'bg-red-50/60' : ''}>\n                      <td className=\"py-1.5 pr-3 text-ink-2\">{r.parameterName}<\/td>\n                      <td className={cx('py-1.5 pr-3 font-semibold tabular-nums', r.abnormal ? 'text-red-700' : 'text-ink')}>\n                        {r.observedValue}{r.abnormal && <span className=\"ml-1.5 text-[11px] font-medium\">Abnormal<\/span>}\n                      <\/td>\n                      <td className=\"py-1.5 font-mono text-xs text-ink-3\">{r.referenceRange ?? '\u2013'}<\/td>\n                    <\/tr>\n                  ))}\n                <\/tbody>\n              <\/table>\n              {rows.some((r) => r.technicianNotes) && (\n                <p className=\"mt-2 text-xs text-ink-3 italic\">{[...new Set(rows.map((r) => r.technicianNotes).filter(Boolean))].join(' ')}<\/p>\n              )}\n            <\/div>\n          ))}\n        <\/div>\n      )}\n    <\/Card>\n  );\n}","apis":["OpdApi.openLabReport"],"uses":["Alert","Badge","Button","Card","CardHeader","FileText","FlaskConical","LabStatusBadge"],"line":111},{"name":"OrderTests","kind":"component","exported":false,"src":"function OrderTests({ visitId, catalogue, alreadyAtLab, onSent }: { visitId: number; catalogue: LabTest[]; alreadyAtLab: boolean; onSent: () => void }) {\n  const [picked, setPicked] = useState<string[]>([]);\n  const [notes, setNotes] = useState('');\n  const [busy, setBusy] = useState(false);\n  const [error, setError] = useState<string | null>(null);\n  const total = catalogue.filter((t) => picked.includes(t.testCode)).reduce((s, t) => s + Number(t.cost), 0);\n\n  const send = async () => {\n    setBusy(true); setError(null);\n    try { await OpdApi.sendToLab(visitId, picked, notes.trim() || undefined); onSent(); }\n    catch (e) { setError(apiError(e, \"Couldn't send to the lab\")); setBusy(false); }\n  };\n\n  return (\n    <Card>\n      <CardHeader icon={<FlaskConical className=\"size-[18px]\" />} title=\"Order lab tests\" subtitle=\"Patient moves to the lab queue\" />\n      <div className=\"p-5 space-y-4\">\n        {error && <Alert>{error}<\/Alert>}\n        {alreadyAtLab && <Alert kind=\"warning\">This visit already has an open lab order.<\/Alert>}\n        <div className=\"grid sm:grid-cols-2 gap-2\">\n          {catalogue.length === 0 && <p className=\"text-[13px] text-ink-3\">Loading test catalogue\u2026<\/p>}\n          {catalogue.map((t) => {\n            const on = picked.includes(t.testCode);\n            return (\n              <label key={t.testCode} className={cx('flex items-start gap-2.5 rounded-lg border px-3 py-2.5 cursor-pointer transition-colors',\n                on ? 'border-brand-500 bg-brand-50' : 'border-line hover:border-line-strong')}>\n                <input type=\"checkbox\" className=\"mt-0.5 accent-brand-600 size-4\" checked={on} disabled={busy}\n                  onChange={() => setPicked(on ? picked.filter((c) => c !== t.testCode) : [...picked, t.testCode])} />\n                <span className=\"min-w-0\">\n                  <span className=\"block text-[13px] font-medium text-ink leading-tight\">{t.testName}<\/span>\n                  <span className=\"block text-[11.5px] text-ink-3 font-mono mt-0.5\">{t.testCode} \u00b7 Rs {Number(t.cost).toFixed(0)}<\/span>\n                <\/span>\n              <\/label>\n            );\n          })}\n        <\/div>\n        <Field label=\"Clinical notes for the lab\" htmlFor=\"labNotes\" hint=\"Optional\">\n          <Input id=\"labNotes\" disabled={busy} placeholder=\"e.g. Suspected typhoid; fasting since 8am\" value={notes} onChange={(e) => setNotes(e.target.value)} />\n        <\/Field>\n        <div className=\"flex items-center justify-between gap-3\">\n          <span className=\"text-[13px] text-ink-3\">{picked.length ? <>Total <span className=\"font-medium text-ink tabular-nums\">Rs {total.toFixed(0)}<\/span><\/> : 'No tests selected'}<\/span>\n          <Button variant=\"secondary\" disabled={!picked.length || alreadyAtLab} loading={busy} onClick={send} icon={<Send className=\"size-4\" />}>\n            Send {picked.length || ''} to lab\n          <\/Button>\n        <\/div>\n      <\/div>\n    <\/Card>\n  );\n}","apis":["OpdApi.sendToLab"],"uses":["Alert","Button","Card","CardHeader","Field","FlaskConical","Input","Send"],"line":175},{"name":"SignOff","kind":"component","exported":false,"src":"function SignOff({ visitId, onDone }: { visitId: number; onDone: () => void }) {\n  const [diagnosis, setDiagnosis] = useState('');\n  const [notes, setNotes] = useState('');\n  const [busy, setBusy] = useState(false);\n  const [error, setError] = useState<string | null>(null);\n\n  const submit = async (e: FormEvent) => {\n    e.preventDefault();\n    setBusy(true); setError(null);\n    try { await OpdApi.conclude(visitId, diagnosis.trim(), notes.trim()); onDone(); }\n    catch (err) { setError(apiError(err, \"Couldn't complete the visit\")); setBusy(false); }\n  };\n\n  return (\n    <Card>\n      <CardHeader icon={<CheckCircle2 className=\"size-[18px]\" />} title=\"Diagnosis and sign-off\" subtitle=\"Completes the visit\" />\n      <form onSubmit={submit} className=\"p-5 spa b7 {e.actor} \u00b7 <span className=\"font-mono\">{time(e.occurredAt)}<\/span><\/span><\/p>\n              {e.note && <p className=\"text-xs text-ink-3 mt-0.5\">{e.note}<\/p>}\n            <\/div>\n          <\/li>\n        ))}\n      <\/ol>\n    <\/Card>\n  );\n}","apis":[],"uses":["Card","CardHeader","History"],"line":258}],"imports":["../../lib/services","../../lib/api","../../lib/types","../../lib/format","../../components/ui"]},{"file":"pages/Doctor/index.tsx","area":"pages/Doctor","lines":125,"fns":[{"name":"DoctorWorkspace","kind":"component","exported":true,"src":"export default function DoctorWorkspace() {\n  const { user } = useAuth();\n  const [tab, setTab] = useState<Tab>('queue');\n  const [selectedId, setSelectedId] = useState<number | null>(null);\n  const [openError, setOpenError] = useState<string | null>(null);\n\n  // Pull finished lab orders first so those visits show as \"Results ready\", then load every tab in one go.\n  const q = usePolling(async () => {\n    await OpdApi.refreshLabStatuses().catch(() => undefined);\n    const all = await OpdApi.myQueue(TABS.flatMap((t) => t.statuses));\n    return all;\n  }, [], 20000);\n\n  const byTab = (t: Tab) => (q.data ?? []).filter((i) => TABS.find((x) => x.id === t)!.statuses.includes(i.status));\n  const list = byTab(tab);\n  const readyCount = (q.data ?? []).filter((i) => i.status === 'LAB_RESULTS_READY').length;\n\n  const open = async (item: QueueItem) => {\n    setOpenError(null);\n    if (item.status === 'TRIAGED' || item.status === 'LAB_RESULTS_READY') {\n      try {\n        await OpdApi.startConsultation(item.visitId);\n      } catch (e) {\n        setOpenError(apiError(e, \"Couldn't open the consultation\"));\n        return;\n      }\n      q.reload();\n    }\n    setSelectedId(item.visitId);\n  };\n\n  return (\n    <>\n      <PageHeader title=\"My patients\" subtitle={`${user?.fullName} \u00b7 emergencies first, then by token`}\n        actions={<Button variant=\"secondary\" size=\"sm\" onClick={q.reload}\n          icon={<RefreshCw className={cx('size-4', q.refreshing && 'animate-spin')} />}>Refresh<\/Button>} />\n\n      <div className=\"grid lg:grid-cols-[360px_minmax(0,1fr)] gap-6 items-start\">\n        <Card className=\"lg:sticky lg:top-24 overflow-hidden\">\n          <div className=\"flex border-b border-line\" role=\"tablist\">\n            {TABS.map((t) => {\n              const n = byTab(t.id).length;\n              return (\n                <button key={t.id} role=\"tab\" aria-selected={tab === t.id} onClick={() => setTab(t.id)}\n                  className={cx('flex-1 h-11 -mb-px border-b-2 text-[13px] font-medium flex items-center justify-center gap-1.5',\n                    tab === t.id ? 'border-brand-600 text-brand-700' : 'border-transparent text-ink-3 hover:text-ink')}>\n                  {t.label}\n                  <span className={cx('text-[11px] rounded-full px-1.5 tabular-nums', tab === t.id ? 'bg-brand-50' : 'bg-subtle')}>{n}<\/span>\n                <\/button>\n              );\n            })}\n          <\/div>\n          {tab === 'queue' && readyCount > 0 && (\n            <p className=\"px-4 py-2 text-xs bg-emerald-50 text-emerald-800 border-b border-emerald-100\">\n              {readyCount} patient{readyCount === 1 ? ' has' : 's have'} lab results ready to review.\n            <\/p>\n          )}\n          {openError && <div className=\"p-3\"><Alert onClose={() => setOpenError(null)}>{openError}<\/Alert><\/div>}\n          {q.loading ? <Spinner /> : q.error ? (\n            <div className=\"p-3\"><Alert action={<Button size=\"sm\" variant=\"secondary\" onClick={q.reload}>Retry<\/Button>}>{q.error}<\/Alert><\/div>\n          ) : list.length === 0 ? (\n            <EmptyState icon={tab === 'lab' ? <FlaskConical className=\"size-5\" /> : <UserRound className=\"size-5\" />}\n              title={tab === 'queue' ? 'Your queue is clear' : tab === 'lab' ? 'No one is waiting on the lab' : 'Nothing completed yet'}>\n              {tab === 'queue' && 'Patients appear here once the nurse records their vitals.'}\n            <\/EmptyState>\n          ) : (\n            <ul className=\"divide-y divide-line max-h-[calc(100vh-260px)] overflow-y-auto\">\n              {list.map((i) => (\n                <li key={i.visitId}>\n                  <button type=\"button\" onClick={() => open(i)}\n                    className={cx('w-full text-left flex items-start gap-3 px-4 py-3 transition-colors',\n                      selectedId === i.visitId ? 'bg-brand-50' : 'hover:bg-subtle')}>\n                    <Token n={i.tokenNumber} />\n                    <div className=\"min-w-0 flex-1\">\n                      <div className=\"flex items-center justify-between gap-2\">\n                        <p className=\"text-[13.5px] font-medium text-ink truncate\">{i.patientFullName}<\/p>\n                        <PriorityBadge priority={i.priority} quiet />\n                      <\/div>\n                      <p className=\"text-xs text-ink-3 truncate mt-0.5\">{ageSex(i.patientAge, i.patientGender)} \u00b7 {i.chiefComplaint}<\/p>\n                      <div className=\"mt-1.5 flex items-center gap-1.5\">\n                        <StatusBadge status={i.status} />\n                        {i.patientAllergies && <Badge tone=\"red\">Allergy<\/Badge>}\n                      <\/div>\n                    <\/div>\n                  <\/button>\n                <\/li>\n              ))}\n            <\/ul>\n          )}\n        <\/Card>\n\n        {selectedId ? (\n          <Consultation key={selectedId} visitId={selectedId}\n            onChanged={() => q.reload()}\n            onClose={() => { setSelectedId(null); q.reload(); }} />\n        ) : (\n          <Card>\n            <EmptyState icon={<Stethoscope className=\"size-5\" />} title=\"Select a patient\">\n              Pick a patient from your queue to see their vitals, order tests or sign off the visit.\n            <\/EmptyState>\n          <\/Card>\n
