<script type="application/json" id="flowdata">[{"id":"login","title":"Sign in","who":"Any staff member","summary":"The auth service checks the password with BCrypt and issues a signed JWT. Every other service verifies that same token locally, so there is no call back to auth on each request.","steps":[{"t":"ui","ref":"pages/Login.tsx#Login","note":"Form submit calls login() from the auth context."},{"t":"ui","ref":"context/AuthContext.tsx#AuthProvider","note":"Calls the API, then stores the token and user in localStorage."},{"t":"api","ref":"AuthApi.login","note":"POST /api/v1/auth/login through nginx \u2192 gateway."},{"t":"gw","ref":"auth-service-route","note":"Path /api/v1/auth/** goes to jb-auth-api:8081; the X-Internal-Secret header is stripped."},{"t":"m","ref":"auth:AuthController#login","note":"Public endpoint (permitAll in SecurityConfig)."},{"t":"m","ref":"auth:AuthService#authenticateUser","note":"Unknown user, wrong password and disabled account all give the same error."},{"t":"m","ref":"auth:UserAccountRepository#findByUsername","note":"Derived JPA query."},{"t":"db","ref":"auth.user_account","note":"SELECT by username."},{"t":"m","ref":"auth:JwtTokenProvider#generateToken","note":"HS256 token; claims sub, roles, name; 8-hour expiry."},{"t":"m","ref":"opd:JwtAuthenticationFilter#doFilterInternal","note":"On every later request, OPD (and lab) verify the signature and read roles from the token."}]},{"id":"register","title":"Register a new patient","who":"Nurse","summary":"One transaction creates the patient, issues the day's next token, opens the visit and writes the first audit event. The doctor is validated against the auth service first.","steps":[{"t":"ui","ref":"pages/Registration/VisitFields.tsx#VisitFields","note":"Loads the doctor picker from the auth service."},{"t":"api","ref":"AuthApi.doctors","note":"GET /api/v1/auth/doctors."},{"t":"m","ref":"auth:AuthService#listActiveDoctors","note":"Enabled users with role DOCTOR."},{"t":"ui","ref":"pages/Registration/NewPatientForm.tsx#NewPatientForm","note":"Submit sends patient details plus complaint, priority and doctor."},{"t":"api","ref":"OpdApi.registerPatient","note":"POST /api/v1/opd/patients."},{"t":"gw","ref":"opd-service-route","note":"Path /api/v1/opd/** goes to jb-opd-service:8082."},{"t":"m","ref":"opd:PatientController#register","note":"@PreAuthorize NURSE or ADMIN; @Valid on the body."},{"t":"m","ref":"opd:PatientService#registerPatient","note":"@Transactional: everything below commits or rolls back together."},{"t":"m","ref":"opd:PatientRepository#findFirstByPhone","note":"Duplicate phone gives a 409 naming the existing MRN."},{"t":"m","ref":"opd:DoctorIntegrationService#requireDoctor","note":"WebClient call with the cluster secret; 400 if the user isn't a doctor."},{"t":"m","ref":"auth:AuthController#resolve","note":"Internal-only: the filter grants ROLE_SYSTEM for a valid X-Internal-Secret."},{"t":"m","ref":"opd:PatientRepository#getNextMrnSequenceValue","note":"nextval('patient_mrn_seq') formatted as JB-000123."},{"t":"db","ref":"opd.patients","note":"INSERT patient."},{"t":"m","ref":"opd:VisitService#openVisit","note":"Propagation.MANDATORY: must join the caller's transaction."},{"t":"m","ref":"opd:VisitRepository#hasActiveVisit","note":"409 if the patient already has an open visit."},{"t":"m","ref":"opd:TokenCounterRepository#incrementAtomicToken","note":"INSERT \u2026 ON CONFLICT DO UPDATE: row-locked, so two nurses can't get the same token."},{"t":"db","ref":"opd.daily_token_counters","note":"Upsert today's counter."},{"t":"db","ref":"opd.visits","note":"INSERT visit with status REGISTERED."},{"t":"m","ref":"opd:VisitService#recordEvent","note":"Audit row: 'Registered with token #N'."},{"t":"db","ref":"opd.visit_events","note":"INSERT event."}]},{"id":"vitals","title":"Record vitals","who":"Nurse","summary":"Vitals are stored against the visit. The first set moves the visit from REGISTERED to TRIAGED, which puts the patient in the doctor's queue.","steps":[{"t":"ui","ref":"pages/Triage/index.tsx#TriageQueue","note":"Polls the triage queue every 15 s; emergencies first."},{"t":"api","ref":"OpdApi.triageQueue","note":"GET /api/v1/opd/visits/triage-queue."},{"t":"m","ref":"opd:VisitRepository#findTriageQueue","note":"Native query ordered by priority, then token."},{"t":"ui","ref":"pages/Triage/VitalsPage.tsx#VitalsPage","note":"Flags fever, tachycardia, hypoxia and BP as you type (lib/format.ts)."},{"t":"api","ref":"OpdApi.saveVitals","note":"POST /api/v1/opd/triage/vitals."},{"t":"m","ref":"opd:TriageController#captureVitals","note":"Bean validation enforces plausible ranges (e.g. SpO\u2082 50\u2013100)."},{"t":"m","ref":"opd:TriageService#recordVitals","note":"Refuses closed visits; prefixes [FEVER] / [LOW SPO2] alerts."},{"t":"db","ref":"opd.vital_signs","note":"INSERT reading (re-takes are kept as history)."},{"t":"m","ref":"opd:VisitService#transitionStatus","note":"REGISTERED \u2192 TRIAGED, only from an allowed state."},{"t":"db","ref":"opd.visit_events","note":"Audit row with the readings."}]},{"id":"queue","title":"Doctor's queue","who":"Doctor","summary":"Before loading the queue, OPD asks the lab service which orders are finished and moves those patients to 'Results ready'. The queue itself is one query keyed on the doctor's own token.","steps":[{"t":"ui","ref":"pages/Doctor/index.tsx#DoctorWorkspace","note":"Polls every 20 s via usePolling."},{"t":"api","ref":"OpdApi.refreshLabStatuses","note":"POST /api/v1/opd/visits/lab-status/refresh."},{"t":"m","ref":"opd:ConsultationWorkflowService#refreshLabStatuses","note":"Loads AWAITING_LAB visits, asks lab for their orders in one call."},{"t":"m","ref":"opd:LabIntegrationService#getOrders","note":"GET /api/v1/lab/orders?ids=\u2026 with the doctor's own JWT forwarded."},{"t":"m","ref":"lab:LabOrderController#getOrders","note":"Lab service checks the doctor's role itself."},{"t":"m","ref":"lab:LabOrderService#getOrdersByIds","note":"Batch-loads sample rows too (no N+1)."},{"t":"m","ref":"opd:VisitRepository#transition","note":"Guarded update AWAITING_LAB \u2192 LAB_RESULTS_READY."},{"t":"api","ref":"OpdApi.myQueue","note":"GET /api/v1/opd/visits/doctor/queue?status=\u2026"},{"t":"m","ref":"opd:VisitController#getMyQueue","note":"Doctor comes from @AuthenticationPrincipal, never from the URL."},{"t":"m","ref":"opd:VisitRepository#findDoctorQueue","note":"Joins patients and the latest vitals with LEFT JOIN LATERAL."},{"t":"db","ref":"opd.vital_signs","note":"Latest reading per visit."}]},{"id":"sendlab","title":"Send tests to the lab","who":"Doctor","summary":"OPD creates the lab order first and changes the visit's status only after the lab service accepts it, so a lab failure never strands a patient in the wrong state.","steps":[{"t":"ui","ref":"pages/Doctor/Consultation.tsx#OrderTests","note":"Test list and prices come from the lab catalogue."},{"t":"api","ref":"LabApi.catalogue","note":"GET /api/v1/lab/tests."},{"t":"api","ref":"OpdApi.sendToLab","note":"POST /api/v1/opd/visits/{id}/send-to-lab."},{"t":"m","ref":"opd:VisitController#sendToLab","note":"DOCTOR only; forwards the Authorization header."},{"t":"m","ref":"opd:VisitService#sendToLab","note":"Propagation.NOT_SUPPORTED: no DB transaction held across the HTTP call."},{"t":"m","ref":"opd:VisitService#requireAssignedDoctor","note":"403 for another doctor's patient."},{"t":"m","ref":"opd:LabIntegrationService#raiseLabInvestigationOrder","note":"Sends MRN, patient name, tests and the clinical note."},{"t":"m","ref":"lab:LabOrderController#placeOrder","note":"@PreAuthorize DOCTOR, checked on the forwarded token."},{"t":"m","ref":"lab:LabOrderService#createOrder","note":"Normalises test codes; status PLACED."},{"t":"db","ref":"lab.lab_orders","note":"INSERT order (+ lab_order_tests rows)."},{"t":"m","ref":"opd:VisitRepository#markSentToLab","note":"Only now: \u2192 AWAITING_LAB, guarded against concurrent changes."},{"t":"m","ref":"opd:VisitService#recordEvent","note":"Audit row 'Lab order #N: CBC, URINE'."}]},{"id":"collect","title":"Collect samples, one test at a time","who":"Lab technician","summary":"Each ordered test needs its own sample. The order stays PLACED until the last one is collected, then becomes SAMPLE_COLLECTED, which unlocks result entry.","steps":[{"t":"ui","ref":"pages/Lab/index.tsx#LabWorkspace","note":"Click a test chip, then 'Collect CBC sample'."},{"t":"api","ref":"LabApi.queue","note":"GET /api/v1/lab/orders/queue?status=PLACED&status=SAMPLE_COLLECTED."},{"t":"api","ref":"LabApi.collectSample","note":"POST /api/v1/lab/orders/{id}/tests/{testCode}/collect."},{"t":"gw","ref":"lab-service-route","note":"Path /api/v1/lab/** goes to jb-lab-service:8083."},{"t":"m","ref":"lab:LabOrderController#collectSample","note":"LABTECH only."},{"t":"m","ref":"lab:LabOrderService#collectSample","note":"Rejects unknown tests (400) and repeats (409)."},{"t":"m","ref":"lab:LabSampleCollectionRepository#existsByOrderIdAndTestCode","note":"Friendly duplicate check."},{"t":"db","ref":"lab.lab_sample_collections","note":"INSERT; the unique (order_id, test_code) key also stops a double click."},{"t":"m","ref":"lab:LabSampleCollectionRepository#findByOrderId","note":"All collected? Then the order becomes SAMPLE_COLLECTED."}]},{"id":"results","title":"Enter and release results","who":"Lab technician","summary":"All results for an order are saved and the order is completed in one transaction. Values outside the reference range are flagged on the server, not just in the browser.","steps":[{"t":"ui","ref":"pages/Lab/ResultEntry.tsx#ResultEntry","note":"Shows High/Low live from the same reference ranges."},{"t":"api","ref":"LabApi.parameters","note":"GET /api/v1/lab/tests/parameters?codes=CBC,URINE."},{"t":"m","ref":"lab:LabTestController#getParameters","note":"Parameter catalogue with units and ranges."},{"t":"api","ref":"LabApi.submitResults","note":"POST /api/v1/lab/orders/{id}/results."},{"t":"m","ref":"lab:LabOrderController#submitOrderResults","note":"LABTECH only."},{"t":"m","ref":"lab:LabResultEntryService#submitOrderResults","note":"409 until every sample is collected."},{"t":"m","ref":"lab:LabTestParameterRepository#findByTestCodes","note":"join fetch of parameters with their test."},{"t":"m","ref":"lab:LabResultEntryService#isOutOfRange","note":"Numeric values checked against ref_low / ref_high."},{"t":"m","ref":"lab:LabResultService#submitResult","note":"One row per parameter."},{"t":"db","ref":"lab.lab_results","note":"INSERT results; order \u2192 COMPLETED in the same transaction."}]},{"id":"signoff","title":"Review results and sign off","who":"Doctor","summary":"OPD fetches results from the lab on demand and can render them as a PDF. Signing off records the diagnosis and closes the visit.","steps":[{"t":"ui","ref":"pages/Doctor/Consultation.tsx#Consultation","note":"Loads the visit, lab results and timeline in parallel."},{"t":"api","ref":"OpdApi.startConsultation","note":"Opening a 'Results ready' patient moves them back to IN_CONSULTATION."},{"t":"m","ref":"opd:ConsultationWorkflowService#startConsultation","note":"Idempotent; records 'Doctor reviewing lab results'."},{"t":"api","ref":"OpdApi.labResults","note":"GET /api/v1/opd/visits/{id}/lab-results (204 if none)."},{"t":"m","ref":"opd:ConsultationWorkflowService#getLabResults","note":"Order status, plus results once COMPLETED."},{"t":"m","ref":"opd:LabIntegrationService#getResults","note":"GET /api/v1/lab/results/order/{id}."},{"t":"m","ref":"lab:LabResultController#viewOrderResults","note":"DOCTOR / LABTECH / ADMIN."},{"t":"m","ref":"opd:LabReportPdfService#render","note":"OpenPDF report with abnormal values in red (PDF button)."},{"t":"ui","ref":"pages/Doctor/Consultation.tsx#SignOff","note":"Diagnosis and notes."},{"t":"api","ref":"OpdApi.conclude","note":"POST /api/v1/opd/visits/{id}/conclude."},{"t":"m","ref":"opd:ConsultationWorkflowService#conclude","note":"Server decides the status: COMPLETED, never from the client."},{"t":"db","ref":"opd.visit_events","note":"Final audit row with the diagnosis."}]}]</script>
<script>
(function () {
  var M = JSON.parse(document.getElementById('model').textContent);
  var FLOWS = JSON.parse(document.getElementById('flowdata').textContent);
  var C = M.classes;
  var view = document.getElementById('view');

  /* ---------------------------------------------------------------- helpers */
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function slug(s) { return String(s).replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
  var SVC = { auth: 'Auth service', opd: 'OPD service', lab: 'Lab service', gw: 'API gateway' };
  var LAYER_ORDER = ['controller', 'service', 'repository', 'model', 'dto', 'security', 'config', 'exception', 'app'];
  var LAYER_LABEL = { controller: 'Controllers', service: 'Services', repository: 'Repositories', model: 'Entities & enums', dto: 'DTOs', security: 'Security', config: 'Configuration', exception: 'Errors', app: 'Application' };

  // hash <-> object maps
  var H = {};
  function methodKey(cid, i) {
    var c = C[cid], m = c.methods[i];
    var same = c.methods.filter(function (x) { return x.name === m.name; });
    var n = same.indexOf(m);
    return 'm-' + c.svc + '-' + c.name + '-' + (m.ctor ? 'new' : m.name) + (n > 0 ? '-' + (n + 1) : '');
  }
  Object.keys(C).forEach(function (cid) {
    var c = C[cid];
    H['c-' + c.svc + '-' + c.name] = { t: 'c', cid: cid };
    c.methods.forEach(function (m, i) { var k = methodKey(cid, i); m._h = k; H[k] = { t: 'm', cid: cid, i: i }; });
  });
  function mref(cid, name) { // first method of that name
    var c = C[cid]; if (!c) return null;
    for (var i = 0; i < c.methods.length; i++) if (c.methods[i].name === name) return c.methods[i];
    return null;
  }
  function mlink(cid, name, label) {
    var m = mref(cid, name), c = C[cid];
    if (!m) return '<span class="mono">' + esc(label || (c ? c.name : cid) + '.' + name) + '</span>';
    return '<a class="link" href="#' + m._h + '">' + esc(label || c.name + '.' + name + '()') + '</a>';
  }
  function clink(cid, label) { var c = C[cid]; return c ? '<a class="link" href="#c-' + c.svc + '-' + c.name + '">' + esc(label || c.name) + '</a>' : esc(cid); }

  var UIF = {}; // "file#fn" -> {file, fn}
  M.ui.files.forEach(function (f) { f.fns.forEach(function (fn) { var k = 'u-' + slug(f.file) + '-' + fn.name; fn._h = k; UIF[f.file + '#' + fn.name] = { f: f, fn: fn }; H[k] = { t: 'u', f: f, fn: fn }; }); H['uf-' + slug(f.file)] = { t: 'uf', f: f }; });
  var API = {}; M.ui.api.forEach(function (a) { API[a.id] = a; a._h = 'a-' + slug(a.id); H[a._h] = { t: 'a', a: a }; });
  Object.keys(M.dbs).forEach(function (d) { Object.keys(M.dbs[d].tables).forEach(function (t) { H['t-' + d + '-' + slug(t)] = { t: 't', d: d, tb: t }; }); });
  FLOWS.forEach(function (f) { H['flow-' + f.id] = { t: 'flow', f: f }; });
  function uilink(file, fn) { var x = UIF[file + '#' + fn]; return x ? '<a class="link" href="#' + x.fn._h + '">' + esc(fn) + '</a>' : esc(fn); }
  function apilink(id) { var a = API[id]; return a ? '<a class="link" href="#' + a._h + '">' + esc(id) + '()</a>' : esc(id); }
  function tlink(d, t) { return '<a class="link" href="#t-' + d + '-' + slug(t) + '">' + esc(d + '.' + t) + '</a>'; }

      '<h2>' + esc(c.name) + '</h2><div class="chips">' + '<span class="tag">' + c.kind + '</span> ' + anns + (c.extends ? ' <span class="tag">extends ' + esc(c.extends) + '</span>' : '') + (c.implements ? ' <span class="tag">implements ' + esc(c.implements) + '</span>' : '') + '</div>' +
      (c.doc ? '<p class="doc">' + esc(c.doc) + '</p>' : '') + '</div>' +
      '<div class="two"><div class="card panel"><h3>Depends on (injected)</h3><div class="chips">' + deps + '</div></div><div class="card panel"><h3>Injected into</h3><div class="chips">' + usedBy + '</div></div></div>' + extra +
      '<div class="card"><div class="panel" style="padding-bottom:6px"><h3>Methods (' + c.methods.length + ')</h3></div><div class="mlist">' + (mlist || '<p class="empty panel">No methods: data only.</p>') + '</div></div>' + inner;
  }
  function methodBody(cid, m, compact) {
    var c = C[cid];
    var calls = (m.calls || []).map(function (x) { return '<div class="row">' + lane(C[x.to].svc, C[x.to].layer) + mlink(x.to, x.m) + '</div>'; }).join('');
    (m.httpOut || []).forEach(function (h) { calls += '<div class="row">' + lane(h.to ? C[h.to].svc : 'gw', 'HTTP ' + h.method) + (h.to ? mlink(h.to, h.m, C[h.to].name + '.' + h.m + '()') : '') + ' <span class="mono small muted">' + esc(h.path) + '</span></div>'; });
    var by = (m.calledBy || []).map(function (x) { return '<div class="row">' + lane(C[x.from].svc, x.http ? 'HTTP' : C[x.from].layer) + mlink(x.from, x.m) + '</div>'; }).join('');
    var ep = M.endpoints.filter(function (e) { return e.cls === cid && e.m === m.name; })[0];
    if (ep && ep.ui) ep.ui.forEach(function (a) { by += '<div class="row">' + lane('api', 'frontend') + apilink(a) + '</div>'; });
    var anns = m.anns.map(function (a) { return '<span class="tag' + (a.n === 'PreAuthorize' ? ' role' : a.n === 'Transactional' ? ' tx' : /Mapping$/.test(a.n) ? ' http' : '') + '">@' + esc(a.n) + (a.a && a.n !== 'Query' ? '(' + esc(a.a.length > 60 ? a.a.slice(0, 60) + '…' : a.a) + ')' : '') + '</span>'; }).join(' ');
    var tables = '';
    if (c.layer === 'repository' && c.tables) tables = '<div class="card panel"><h3>Touches</h3><div class="chips">' + c.tables.map(function (t) { return tlink(c.svc, t); }).join(' ') + '</div></div>';
    return (compact ? '<div class="card insp-head"><div class="crumbs">' + lane(c.svc, SVC[c.svc]) + clink(cid) + '<span class="mono">' + esc(c.file) + ':' + m.line + '</span></div><div class="sig">' + esc((m.returns ? m.returns + ' ' : '') + (m.ctor ? c.name : m.name) + '(' + m.params.join(', ') + ')') + '</div>' + (anns ? '<div class="chips">' + anns + '</div>' : '') + (m.doc ? '<p class="doc">' + esc(m.doc) + '</p>' : '') + '<p class="small"><a class="link" href="#' + m._h + '">Open in code browser →</a></p></div>' : '') +
      '<div class="two" style="margin-top:' + (compact ? '12px' : '0') + '"><div class="card panel"><h3>Calls</h3><div class="linklist">' + (calls || '<span class="empty">No calls to other project code.</span>') + '</div></div><div class="card panel"><h3>Called by</h3><div class="linklist">' + (by || '<span class="empty">Framework entry point (HTTP, scheduler or Spring).</span>') + '</div></div></div>' + tables +
      '<div style="margin-top:12px">' + codeBlock(m.src, m.line, c.file.split('/').pop() + ' · line ' + m.line) + '</div>';
  }
  function methodPage(cid, mi) {
    var c = C[cid], m = c.methods[mi];
    var anns = m.anns.map(function (a) { return '<span class="tag' + (a.n === 'PreAuthorize' ? ' role' : a.n === 'Transactional' ? ' tx' : /Mapping$/.test(a.n) ? ' http' : '') + '">@' + esc(a.n) + '</span>'; }).join(' ');
    return '<div class="card insp-head"><div class="crumbs">' + lane(c.svc, SVC[c.svc]) + clink(cid) + '<span class="mono">' + esc(c.file) + ':' + m.line + '</span></div>' +
      '<h2>' + esc(m.ctor ? 'new ' + c.name : m.name) + '()</h2><div class="sig">' + esc((m.mods.join(' ') + ' ' + (m.returns || '')).trim() + ' ' + (m.ctor ? c.name : m.name) + '(' + m.params.join(', ') + ')') + '</div>' +
      (m.http ? '<div class="chips"><span class="tag http">' + m.http.method + ' ' + esc(m.http.path) + '</span>' + (m.http.roles.length ? '<span class="tag role">' + m.http.roles.join(' · ') + '</span>' : '') + '</div>' : '') +
      (anns ? '<div class="chips">' + anns + '</div>' : '') + (m.doc ? '<p class="doc">' + esc(m.doc) + '</p>' : '') + inFlows('m', cid + '#' + m.name) + '</div>' + methodBody(cid, m, false);
  }
  function inFlows(t, ref) {
    var hits = [];
    FLOWS.forEach(function (f) { f.steps.forEach(function (s, i) { if (s.t === t && s.ref === ref) hits.push('<a class="link" href="#flow-' + f.id + '-' + i + '">' + esc(f.title) + ' · step ' + (i + 1) + '</a>'); }); });
    return hits.length ? '<p class="small muted">Appears in: ' + hits.join(' · ') + '</p>' : '';
  }

  /* ---- database */
  function tableCard(d, t) {
    var tb = M.dbs[d].tables[t];
    var repos = Object.values(C).filter(function (c) { return c.svc === d && (c.tables || []).indexOf(t) >= 0; });
    var ents = Object.values(C).filter(function (c) { return c.svc === d && c.table === t && c.layer === 'model'; });
    var cols = tb.cols.map(function (c) {
      var flag = c.pk ? '<span class="pk">PK</span>' : c.ref ? '<a class="fk link" href="#t-' + d + '-' + slug(c.ref) + '">→ ' + esc(c.ref) + '</a>' : (c.added !== tb.created ? '<span class="new">' + esc(c.added.split('__')[0]) + '</span>' : '');
      return '<div><span>' + esc(c.name) + ' <span class="ty">' + esc(c.type) + '</span></span>' + flag + '</div>';
    }).join('');
    return '<div class="card tbl" id="tbl-' + d + '-' + slug(t) + '"><div class="tbl-h"><b>' + esc(t === '_sequences' ? 'sequences' : t) + '</b><span class="tag">' + esc(tb.created.split('__')[0]) + '</span></div><div class="cols">' + cols + '</div>' +
      '<div class="tbl-f">' + (ents.length ? '<span>Entity: ' + ents.map(function (e) { return clink(e.id); }).join(', ') + '</span>' : '') + (repos.length ? '<span>Queried by: ' + repos.map(function (r) { return clink(r.id); }).join(', ') + '</span>' : '<span class="muted">Used through native SQL only</span>') + (tb.altered.length ? '<span>Altered by ' + tb.altered.map(esc).join(', ') + '</span>' : '') + '</div></div>';
  }
  function vDatabase(focusDb, focusTable) {
    var html = '<div class="view-head"><div><h1>Database</h1><p>Three Postgres databases, one per service; no service reads another\'s tables. Flyway owns every schema change. Columns marked V2, V4… were added by a later migration. Arrows are foreign keys.</p></div></div>';
    ['opd', 'lab', 'auth'].forEach(function (d) {
      var db = M.dbs[d];
      html += '<section class="db-sec" id="db-' + d + '"><h2>' + lane(d, d + '_db') + ' ' + SVC[d] + '</h2><div class="mig-list">' + db.migrations.map(function (m, i) { return '<button class="chip" type="button" data-mig="' + d + '-' + i + '">' + esc(m.file) + '</button>'; }).join('') + '</div><div id="mig-' + d + '"></div>' +
        '<div class="db-grid">' + Object.keys(db.tables).map(function (t) { return tableCard(d, t); }).join('') + '</div></section>';
    });
    view.innerHTML = html;
    view.querySelectorAll('[data-mig]').forEach(function (b) {
      b.addEventListener('click', function () {
        var p = b.getAttribute('data-mig').split('-'), d = p[0], m = M.dbs[d].migrations[+p[1]];
        var box = document.getElementById('mig-' + d), on = b.getAttribute('aria-pressed') === 'true';
        view.querySelectorAll('[data-mig^="' + d + '-"]').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        if (on) { box.innerHTML = ''; return; }
        b.setAttribute('aria-pressed', 'true');
        box.innerHTML = '<div style="margin-bottom:12px">' + codeBlock(m.src, 1, m.file) + '</div>'; bindCopy(box);
      });
    });
    var target = focusTable ? document.getElementById('tbl-' + focusDb + '-' + slug(focusTable)) : focusDb ? document.getElementById('db-' + focusDb) : null;
    if (target) { target.scrollIntoView({ block: 'start' }); if (focusTable) target.style.boxShadow = '0 0 0 3px var(--brand-soft), 0 0 0 4px var(--brand)'; }
  }

  /* ---- frontend */
  function apiBody(a, compact) {
    var used = a.usedBy.map(function (u) { return '<div class="row">' + lane('ui', u.file.split('/').slice(-2).join('/')) + uilink(u.file, u.fn) + '</div>'; }).join('');
    return (compact ? '' : '<div class="card insp-head"><div class="crumbs">' + lane('api', 'lib/services.ts') + '</div><h2>' + esc(a.id) + '()</h2><div class="chips"><span class="tag http">' + a.method + ' ' + esc(a.path) + '</span></div></div>') +
      '<div class="two" style="margin-top:' + (compact ? '0' : '14px') + '"><div class="card panel"><h3>Sends to</h3><div class="linklist"><div class="row"><span class="tag http">' + a.method + ' ' + esc(a.path) + '</span></div><div class="row">' + lane(C[a.to].svc, 'controller') + mlink(a.to, a.m) + '</div></div></div><div class="card panel"><h3>Used by</h3><div class="linklist">' + (used || '<span class="tag warn">not used by any screen</span>') + '</div></div></div>' +
      '<div style="margin-top:12px">' + codeBlock(a.src, null, 'lib/services.ts') + '</div>';
  }
  function uiBody(f, fn, compact) {
    var apis = fn.apis.map(function (a) { return '<div class="row">' + lane('api', 'API') + apilink(a) + (API[a] ? ' <span class="mono small muted">' + API[a].method + ' ' + esc(API[a].path) + '</span>' : '') + '</div>'; }).join('');
    var uses = fn.uses.map(function (u) {
      var hit = null; M.ui.files.forEach(function (ff) { ff.fns.forEach(function (x) { if (x.name === u && x.kind === 'component') hit = { f: ff, fn: x }; }); });
      return hit ? '<a class="link" href="#' + hit.fn._h + '">&lt;' + esc(u) + '&gt;</a>' : '<span class="mono small muted">&lt;' + esc(u) + '&gt;</span>';
    }).join(' ');
    return (compact ? '<div class="card insp-head"><div class="crumbs">' + lane('ui', fn.kind) + '<span class="mono">' + esc(f.file) + ':' + fn.line + '</span></div><p class="small"><a class="link" href="#' + fn._h + '">Open in frontend browser →</a></p></div>' : '') +
      '<div class="two" style="margin-top:12px"><div class="card panel"><h3>Calls the API</h3><div class="linklist">' + (apis || '<span class="empty">No direct API calls.</span>') + '</div></div><div class="card panel"><h3>Renders</h3><div class="chips">' + (uses || '<span class="empty">Plain markup only.</span>') + '</div></div></div>' +
      '<div style="margin-top:12px">' + codeBlock(fn.src, fn.line, f.file) + '</div>';
  }
  function vFrontend(sel) {
    var routes = M.ui.routes.map(function (r) {
      var hit = null; M.ui.files.forEach(function (ff) { ff.fns.forEach(function (x) { if (x.name === r.component) hit = { f: ff, fn: x }; }); });
      return '<tr><td>' + esc(r.path) + '</td><td>' + (hit ? '<a class="link" href="#' + hit.fn._h + '">' + esc(r.component) + '</a>' : esc(r.component)) + '</td><td>' + (r.roles.length ? r.roles.map(function (x) { return '<span class="tag role">' + x + '</span>'; }).join(' ') : '<span class="tag">any signed-in user / public</span>') + '</td><td class="mono small">' + (hit ? esc(hit.f.file) : '') + '</td></tr>';
    }).join('');
    var areas = {};
    M.ui.files.forEach(function (f) { (areas[f.area] = areas[f.area] || []).push(f); });
    var files = Object.keys(areas).sort().map(function (a) {
      return areas[a].map(function (f) {
        var fns = f.fns.filter(function (x) { return x.kind !== 'value'; });
        return '<div class="card ui-file"><b>' + esc(f.file) + '</b><span class="muted small">' + f.lines + ' lines</span><div class="chips">' + (fns.length ? fns.map(function (x) { return '<a class="link" href="#' + x._h + '">' + esc(x.name) + (x.kind === 'component' ? '' : x.kind === 'hook' ? ' (hook)' : '()') + '</a>'; }).join(' ') : '<span class="empty">types / data only</span>') + '</div></div>';
      }).join('');
    }).join('');
    var apiRows = M.ui.api.map(function (a) { return '<tr><td><a class="link" href="#' + a._h + '">' + esc(a.id) + '</a></td><td><span class="verb">' + a.method + '</span> <span class="mono small">' + esc(a.path) + '</span></td><td>' + mlink(a.to, a.m) + '</td><td>' + (a.usedBy.length ? a.usedBy.map(function (u) { return uilink(u.file, u.fn); }).join(', ') : '<span class="tag warn">unused</span>') + '</td></tr>'; }).join('');
    var detail = '';
    if (sel && sel.t === 'u') detail = '<div class="card insp-head" style="margin-bottom:12px"><div class="crumbs">' + lane('ui', sel.fn.kind) + '<span class="mono">' + esc(sel.f.file) + ':' + sel.fn.line + '</span></div><h2>' + esc(sel.fn.name) + '</h2>' + inFlows('ui', sel.f.file + '#' + sel.fn.name) + '</div>' + uiBody(sel.f, sel.fn, false);
    if (sel && sel.t === 'a') detail = apiBody(sel.a, false);
    view.innerHTML = '<div class="view-head"><div><h1>Frontend</h1><p>React 19 + TypeScript. Routes are guarded by role in <span class="mono">App.tsx</span>. Every server call goes through one typed function in <span class="mono">lib/services.ts</span>, which uses the shared axios client in <span class="mono">lib/api.ts</span> (token header, 401 handling, problem+json errors).</p></div></div>' +
      (detail ? '<div style="margin-bottom:22px">' + detail + '</div>' : '') +
      '<div class="card table-wrap routes"><table><thead><tr><th>Route</th><th>Page component</th><th>Roles</th><th>File</th></tr></thead><tbody>' + routes + '</tbody></table></div>' +
      '<h2 style="font-size:17px;margin:26px 0 10px">API client → backend</h2><div class="card table-wrap"><table><thead><tr><th>Function</th><th>Request</th><th>Handled by</th><th>Used by</th></tr></thead><tbody>' + apiRows + '</tbody></table></div>' +
      '<h2 style="font-size:17px;margin:26px 0 0">Files</h2><div class="ui-files">' + files + '</div>';
    bindCopy(view);
    if (detail) window.scrollTo(0, 0);
  }

  /* ---------------------------------------------------------------- copy buttons */
  function bindCopy(root) {
    root.querySelectorAll('[data-copy]').forEach(function (b) {
      b.addEventListener('click', function () {
        var pre = document.getElementById(b.getAttribute('data-copy'));
        var raw = pre.getAttribute('data-raw');
        function done() { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy'; }, 1400); }
        try {
          navigator.clipboard.writeText(raw).then(done, function () { selectPre(pre); });
        } catch (e) { selectPre(pre); }
      });
    });
  }
  function selectPre(pre) { var r = document.createRange(); r.selectNodeContents(pre); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }

  /* ---------------------------------------------------------------- search */
  var IDX = [];
  Object.values(C).forEach(function (c) {
    IDX.push({ k: 'class', t: c.name, s: SVC[c.svc], h: 'c-' + c.svc + '-' + c.name });
    c.methods.forEach(function (m) { if (!m.ctor) IDX.push({ k: 'method', t: c.name + '.' + m.name + '()', s: SVC[c.svc], h: m._h }); });
  });
  M.endpoints.forEach(function (e) { var m = mref(e.cls, e.m); IDX.push({ k: e.method, t: e.path, s: C[e.cls].name, h: m ? m._h : '' }); });
  Object.keys(M.dbs).forEach(function (d) { Object.keys(M.dbs[d].tables).forEach(function (t) { if (t !== '_sequences') IDX.push({ k: 'table', t: t, s: d + ' DB', h: 't-' + d + '-' + slug(t) }); }); });
  M.ui.files.forEach(function (f) { f.fns.forEach(function (fn) { if (fn.kind !== 'value') IDX.push({ k: fn.kind === 'component' ? 'UI' : 'UI fn', t: fn.name, s: f.file, h: fn._h }); }); });
  M.ui.api.forEach(function (a) { IDX.push({ k: 'api', t: a.id + '()', s: a.method + ' ' + a.path, h: a._h }); });
  FLOWS.forEach(function (f) { IDX.push({ k: 'flow', t: f.title, s: f.who, h: 'flow-' + f.id }); });
  var q = document.getElementById('q'), res = document.getElementById('results'), sel = -1, hits = [];
  q.addEventListener('input', function () {
    var v = q.value.trim().toLowerCase();
    if (v.length < 2) { res.hidden = true; return; }
    hits = IDX.filter(function (x) { return x.h && (x.t.toLowerCase().indexOf(v) >= 0 || x.s.toLowerCase().indexOf(v) >= 0); })
      .sort(function (a, b) { return a.t.toLowerCase().indexOf(v) - b.t.toLowerCase().indexOf(v) || a.t.length - b.t.length; }).slice(0, 14);
    sel = -1;
    res.innerHTML = hits.length ? hits.map(function (x, i) { return '<a href="#' + x.h + '" data-i="' + i + '"><span class="k">' + esc(x.k) + '</span><span>' + esc(x.t) + '</span><span class="s">' + esc(x.s) + '</span></a>'; }).join('') : '<p class="empty" style="padding:8px 10px">No matches</p>';
    res.hidden = false;
  });
  q.addEventListener('keydown', function (e) {
    var links = res.querySelectorAll('a');
    if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, links.length - 1); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); e.preventDefault(); }
    else if (e.key === 'Enter' && links[Math.max(sel, 0)]) { location.hash = links[Math.max(sel, 0)].getAttribute('href').slice(1); res.hidden = true; q.blur(); return; }
    else if (e.key === 'Escape') { res.hidden = true; return; }
    links.forEach(function (l, i) { l.classList.toggle('on', i === sel); });
  });
  res.addEventListener('click', function () { res.hidden = true; q.value = ''; });
  document.addEventListener('click', function (e) { if (!e.target.closest('.search')) res.hidden = true; });

  /* ---------------------------------------------------------------- router */
  var RESERVED = /^(settings|sidebar|customize|upgrade|downloads|comment-)/;
  function route() {
    var h = decodeURIComponent(location.hash.slice(1)) || 'overview';
    if (RESERVED.test(h)) h = 'overview';
    var tab = 'overview';
    var fm = h.match(/^flow-(\w+?)(?:-(\d+))?$/);
    if (h === 'overview') vOverview();
    else if (h === 'flows') { tab = 'flows'; vFlows(FLOWS[0].id); }
    else if (fm && FLOWS.some(function (f) { return f.id === fm[1]; })) { tab = 'flows'; vFlows(fm[1], fm[2] != null ? +fm[2] : null); }
    else if (h === 'endpoints') { tab = 'endpoints'; vEndpoints(); }
    else if (h === 'code') { tab = 'code'; vCode('opd'); }
    else if (/^code-(auth|opd|lab|gw)$/.test(h)) { tab = 'code'; vCode(h.slice(5)); }
    else if (H[h] && H[h].t === 'c') { tab = 'code'; vCode(null, H[h].cid); }
    else if (H[h] && H[h].t === 'm') { tab = 'code'; vCode(null, H[h].cid, H[h].i); }
    else if (h === 'database') { tab = 'database'; vDatabase(); }
    else if (/^database-(auth|opd|lab)$/.test(h)) { tab = 'database'; vDatabase(h.slice(9)); }
    else if (H[h] && H[h].t === 't') { tab = 'database'; vDatabase(H[h].d, H[h].tb); }
    else if (h === 'frontend') { tab = 'frontend'; vFrontend(); }
    else if (H[h] && (H[h].t === 'u' || H[h].t === 'a')) { tab = 'frontend'; vFrontend(H[h]); }
    else vOverview();
    document.querySelectorAll('.tabs a').forEach(function (a) { if (a.getAttribute('data-tab') === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    if (!/^t-|^database-/.test(h) && !(fm && fm[2])) window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
