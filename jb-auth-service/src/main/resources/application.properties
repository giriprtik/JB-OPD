spring.application.name=jb-auth-service
server.port=${SERVER_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5431/auth_records_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:auth_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:auth_secure_password}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

app.jwt.secret=${APP_JWT_SECRET}
# Access token: short-lived, held in browser memory only.
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:900000}
# Refresh token (HttpOnly cookie): sliding idle timeout, capped at one shift.
app.refresh.idle-ttl=${APP_REFRESH_IDLE_TTL:PT2H}
app.refresh.session-ttl=${APP_REFRESH_SESSION_TTL:PT12H}
# Browsers accept Secure cookies on http://localhost; set false only for plain-HTTP access from another host.
app.refresh.cookie-secure=${APP_REFRESH_COOKIE_SECURE:true}
app.internal-secret=${INTERNAL_SERVICES_SECRET}
app.seed.demo-users=${APP_SEED_DEMO_USERS:true}
app.seed.demo-password=${APP_SEED_DEMO_PASSWORD:Demo@1234}

logging.level.root=INFO
logging.level.com.hospital=INFO
