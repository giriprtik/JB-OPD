spring.application.name=jb-lab-service
server.port=${SERVER_PORT:8083}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5456/lab_clinical_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lab_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lab_secure_password}

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

app.jwt.secret=${APP_JWT_SECRET}

logging.level.root=INFO
logging.level.com.hospital=INFO

# ---------------------------------------------------------------- field encryption (clinical free text)
# id:base64key[,id2:base64key2]; each key from `openssl rand -base64 32`. Use a different key set from OPD.
app.crypto.keys=${APP_CRYPTO_KEYS}
app.crypto.active-key=${APP_CRYPTO_ACTIVE_KEY:k1}
app.crypto.allow-plaintext=${APP_CRYPTO_ALLOW_PLAINTEXT:false}
app.crypto.backfill=${APP_CRYPTO_BACKFILL:false}

# ---------------------------------------------------------------- connection pool
# Fail fast (3 s) instead of hanging a desk for Hikari's default 30 s when the pool is exhausted.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.leak-detection-threshold=10000
# Don't hold a DB connection for the whole HTTP request (incl. JSON rendering); services return DTOs.
spring.jpa.open-in-view=false
